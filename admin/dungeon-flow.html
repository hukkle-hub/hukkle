<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090b">
<title>흥양기 · 이동·탐험·조사 v66.0</title>
<style>
:root{--bg:#07090b;--panel:rgba(7,10,12,.90);--panel2:rgba(11,15,18,.77);--gold:#d7ad63;--gold2:#f1d9a1;--line:rgba(235,203,142,.18);--text:#eee7db;--muted:#a89f91;--teal:#8fc6bd;--red:#c56a5e;--blue:#9fcbe0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709;color:var(--text);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}button{font:inherit;color:inherit}
#game{position:fixed;inset:0;background:#050709}.scene-img{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;filter:brightness(.73) saturate(.82) contrast(1.06);transform:scale(1.025);transition:filter 1.1s ease,transform 4.5s ease,object-position 1s ease}
#game[data-phase="travel"] .scene-img{transform:scale(1.10) translateX(-1.2%)}#game[data-phase="explore"] .scene-img{transform:scale(1.045)}#game[data-phase="dungeon"] .scene-img{filter:brightness(.48) saturate(.63) contrast(1.17) hue-rotate(-6deg);transform:scale(1.07)}
.grade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,8,.10),rgba(3,6,8,.03) 48%,rgba(2,4,6,.50)),radial-gradient(circle at 52% 42%,transparent 25%,rgba(0,0,0,.30) 72%,rgba(0,0,0,.58) 100%)}
.rain,.fog,.memory{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}.rain{background-image:repeating-linear-gradient(100deg,transparent 0 18px,rgba(220,235,240,.095) 19px 20px,transparent 21px 36px);background-size:48px 48px;animation:rain 1.05s linear infinite}@keyframes rain{to{background-position:-48px 48px}}#game[data-phase="travel"] .rain{opacity:.20}
.fog{background:radial-gradient(ellipse at 18% 73%,rgba(149,199,199,.14),transparent 31%),radial-gradient(ellipse at 76% 62%,rgba(139,191,196,.12),transparent 36%),linear-gradient(180deg,transparent 37%,rgba(112,158,164,.10) 72%,transparent);filter:blur(16px);animation:fog 8s ease-in-out infinite alternate}@keyframes fog{to{transform:translateX(2.4%) scale(1.02)}}.memory{background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(196,230,230,.022) 10px 11px);mix-blend-mode:screen}#game[data-phase="dungeon"] .fog,#game[data-phase="dungeon"] .memory{opacity:1}
.topbar{position:absolute;z-index:15;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:start;gap:14px}.location,.phasebox{padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(7,10,13,.91),rgba(5,7,9,.76));backdrop-filter:blur(14px);box-shadow:0 14px 45px rgba(0,0,0,.28)}.location{min-width:215px}.location small,.phasebox small{display:block;color:var(--gold);font-size:8px;letter-spacing:.13em;font-weight:900}.location b{display:block;margin-top:3px;font:800 18px "Noto Serif KR",serif}.phasebox{text-align:right}.phasebox b{display:block;margin-top:3px;font-size:11px;color:#e7dac2}.meta{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}.meta i{font-style:normal;padding:2px 5px;border-radius:999px;border:1px solid rgba(255,255,255,.10);font-size:7px;color:#aaa}.meta .real{color:#bfe8dc;border-color:rgba(143,198,189,.27)}.meta .creative{color:#eed39d;border-color:rgba(215,173,99,.27)}
.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,rgba(7,10,13,.91),rgba(3,6,8,.94));backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.42)}
.travel{position:absolute;z-index:12;left:max(22px,env(safe-area-inset-left));bottom:22px;width:min(650px,calc(100vw - 44px));padding:15px 17px}.eyebrow{color:var(--gold);font-size:8px;letter-spacing:.13em;font-weight:900}.travel h2,.explore h2,.dungeon h2{margin:5px 0 6px;font:800 21px "Noto Serif KR",serif}.copy{margin:0;color:#bbb2a5;font-size:9px;line-height:1.6}.route-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}.route-step{position:relative;padding:8px 8px 9px;border-radius:11px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);min-height:48px}.route-step b{display:block;font-size:8px}.route-step span{display:block;margin-top:3px;color:#827c73;font-size:7px}.route-step.active{border-color:rgba(241,217,161,.42);background:rgba(215,173,99,.08)}.route-step.done{border-color:rgba(143,198,189,.28)}.route-step.done:after{content:'✓';position:absolute;right:6px;top:5px;color:var(--teal);font-size:8px}.travel-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:8px;color:#a39b90}.travel-status b{color:#e7d7b8}.progress{height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .09s linear}.actions{display:flex;gap:7px;margin-top:10px}.soft,.gold{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.05);font-size:9px;font-weight:850}.gold{border:0;background:linear-gradient(#efd391,#ae7b38);color:#171006}.gold:disabled,.soft:disabled{opacity:.4;filter:grayscale(1)}
.explore{position:absolute;z-index:12;left:max(22px,env(safe-area-inset-left));bottom:22px;width:min(625px,calc(100vw - 44px));padding:15px 17px}.invest-summary{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:10px}.clue-list{display:flex;gap:6px}.clue-chip{flex:1;padding:7px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);font-size:7px;color:#868078}.clue-chip b{display:block;color:#aaa398;font-size:8px;margin-bottom:2px}.clue-chip.recorded{border-color:rgba(143,198,189,.32);background:rgba(92,151,144,.08);color:#bfe4dc}.clue-chip.recorded b{color:#d3eee7}.tool-strip{display:flex;gap:5px}.tool{min-width:50px;padding:6px 7px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);text-align:center;font-size:7px;color:#aaa}.tool b{display:block;color:#e8d7b7;font-size:9px}.hotspot{position:absolute;z-index:11;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,217,143,.62);background:rgba(7,9,11,.44);box-shadow:0 0 0 8px rgba(218,174,98,.07),0 0 25px rgba(218,174,98,.18);display:grid;place-items:center;animation:pulse 2s ease-in-out infinite}.hotspot:before{content:'';width:7px;height:7px;border-radius:50%;background:#f0cf87;box-shadow:0 0 12px #e9bd69}.hotspot.recorded{border-color:rgba(143,198,189,.50);box-shadow:0 0 0 8px rgba(143,198,189,.055)}.hotspot.recorded:before{background:#a7dcd1;box-shadow:0 0 12px #9bd1c7}@keyframes pulse{50%{transform:scale(1.08)}}
.invest-sheet{position:absolute;z-index:25;right:max(22px,env(safe-area-inset-right));top:19%;width:min(390px,36vw);padding:15px;display:none}.invest-sheet.open{display:block}.invest-sheet .type{display:inline-flex;padding:3px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.10);font-size:7px;color:#aaa}.invest-sheet .type.real{color:#bfe8dc;border-color:rgba(143,198,189,.28)}.invest-sheet .type.anomaly{color:#f0c8b4;border-color:rgba(197,106,94,.28)}.invest-sheet h3{margin:7px 0 5px;font:800 18px "Noto Serif KR",serif}.invest-sheet p{font-size:8px;color:#aaa296;line-height:1.6;margin:0}.invest-stage{display:flex;gap:5px;margin-top:10px}.invest-stage span{flex:1;padding:5px;border-radius:8px;text-align:center;background:rgba(255,255,255,.035);font-size:7px;color:#777}.invest-stage span.on{background:rgba(215,173,99,.10);color:#f0d89e}.invest-methods{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.method{min-height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);text-align:left;padding:8px}.method b{display:block;font-size:8px;color:#e8d7b7}.method span{display:block;margin-top:2px;font-size:7px;color:#807a72}.method.recommended{border-color:rgba(215,173,99,.40);background:rgba(215,173,99,.075)}.method:disabled{opacity:.38}.confidence{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:8px;color:#999}.confidence b{color:#d8c49c}.record-box{margin-top:8px;padding:8px 9px;border-radius:10px;background:rgba(143,198,189,.055);border:1px solid rgba(143,198,189,.12);font-size:7px;color:#a9cfc7;line-height:1.5;display:none}.record-box.show{display:block}
.dungeon{position:absolute;z-index:12;left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));bottom:22px;display:grid;grid-template-columns:minmax(315px,1.05fr) 1fr;gap:10px}.dungeon-main,.zones{padding:14px 16px}.dungeon-main small{color:var(--teal);font-size:8px;letter-spacing:.12em}.zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.zone{position:relative;min-height:96px;padding:10px;text-align:left;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}.zone b{display:block;font:800 11px "Noto Serif KR",serif}.zone span{display:block;margin-top:5px;color:#8f897f;font-size:7px;line-height:1.45}.zone.active{border-color:rgba(143,198,189,.35);box-shadow:inset 0 0 23px rgba(90,148,142,.06)}.zone.visited:after{content:'조사됨';position:absolute;right:7px;top:7px;color:#a8d8ce;font-size:6px}.zone-progress{margin-top:10px;color:#9a9388;font-size:8px}
.source{position:absolute;z-index:8;right:max(16px,env(safe-area-inset-right));bottom:18px;max-width:410px;text-align:right;color:rgba(220,215,205,.48);font-size:6px;line-height:1.5}.toast{position:absolute;z-index:60;left:50%;top:13%;translate:-50% 0;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,224,160,.17);background:rgba(5,8,10,.88);backdrop-filter:blur(13px);font-size:8px;color:#e9dec9;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(4px)}
.orientation{display:none;position:fixed;inset:0;z-index:999;background:#050709;place-items:center;text-align:center;padding:30px}.orientation b{font:800 22px "Noto Serif KR",serif}.orientation p{color:#aaa;line-height:1.6}@media(max-width:900px){.invest-sheet{width:43vw}.dungeon{grid-template-columns:1fr 1.3fr}.route-steps{grid-template-columns:repeat(4,minmax(90px,1fr))}}@media(orientation:portrait) and (max-width:800px){.orientation{display:grid}}

.scene-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#030506;opacity:0;pointer-events:none;transition:opacity .35s ease;filter:brightness(.78) saturate(.88) contrast(1.06)}
#game[data-phase="travel"] .scene-video,#game[data-phase="boss"] .scene-video{opacity:1}
#game[data-phase="travel"] .scene-img,#game[data-phase="boss"] .scene-img{opacity:0}
.boss-reveal{position:absolute;z-index:18;left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));bottom:22px;display:flex;justify-content:flex-end}
.boss-copy{width:min(520px,48vw);padding:16px 18px;background:linear-gradient(145deg,rgba(7,10,13,.88),rgba(3,6,8,.95));border-color:rgba(197,106,94,.25)}
.boss-copy h2{margin:5px 0 5px;font:900 27px "Noto Serif KR",serif;color:#f0dfbf}.boss-taboo{margin-top:10px;padding:9px 11px;border-radius:11px;border:1px solid rgba(197,106,94,.22);background:rgba(74,19,23,.22);display:flex;align-items:center;justify-content:space-between}.boss-taboo small{color:#d58479;font-size:7px;letter-spacing:.15em}.boss-taboo b{font:800 12px "Noto Serif KR",serif;color:#f3c4bb}
@media(max-width:900px){.boss-copy{width:55vw}.boss-copy h2{font-size:21px}}

</style>
<style>
.explore-guide{display:none;position:absolute;z-index:18;top:18px;left:50%;translate:-50% 0;gap:5px;padding:7px;border:1px solid var(--line);border-radius:999px;background:rgba(5,8,10,.88);backdrop-filter:blur(12px);white-space:nowrap}.explore-guide span{padding:5px 8px;border-radius:999px;font-size:8px;color:#aaa}.explore-guide span:first-child{color:#f1d59b;background:rgba(215,173,99,.13)}#game[data-phase="explore"] .explore-guide{display:flex}.invest-sheet{top:142px!important;width:min(370px,32vw)!important;max-height:calc(100vh - 164px);overflow:auto}.scene-video{display:none!important}

/* v66: readable, touch-first static exploration. */
.scene-img{inset:0;width:100%;height:100%;filter:brightness(.84) saturate(.98) contrast(1.04);transform:scale(1.01)}
#game[data-phase="travel"] .scene-img,#game[data-phase="explore"] .scene-img,#game[data-phase="boss"] .scene-img{opacity:1;transform:scale(1.015)}
#game[data-phase="dungeon"] .scene-img{filter:brightness(.64) saturate(.84) contrast(1.10);transform:scale(1.02)}
.grade{background:linear-gradient(180deg,rgba(2,5,8,.10),transparent 44%,rgba(2,4,6,.40)),radial-gradient(circle at 52% 42%,transparent 38%,rgba(0,0,0,.34) 100%)}
.location small,.phasebox small,.eyebrow,.dungeon-main small{font-size:10px}.location b{font-size:22px}.phasebox b{font-size:14px}.meta i{font-size:9px;padding:3px 7px}
.travel,.explore{left:max(24px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:min(720px,calc(100vw - 48px));padding:19px 21px}
.travel h2,.explore h2,.dungeon h2{font-size:26px}.copy{font-size:12px;line-height:1.62}.route-step{min-height:64px;padding:10px}.route-step b{font-size:11px}.route-step span{font-size:10px;line-height:1.35}.travel-status,.zone-progress{font-size:11px}
.soft,.gold{min-height:44px;padding:0 17px;font-size:12px;cursor:pointer}.actions{gap:9px;margin-top:12px}
.explore-guide{top:max(86px,calc(env(safe-area-inset-top) + 74px));padding:8px;gap:6px}.explore-guide span{font-size:10px;padding:6px 10px}.explore-guide span.on{color:#171006;background:linear-gradient(#efd391,#ae7b38)}
.objective{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(241,217,161,.24);background:rgba(5,8,10,.68);color:#e9dcc4;font-size:12px}.objective b{color:#f1d59b}
.invest-summary{grid-template-columns:1fr;gap:10px}.clue-list{gap:8px}.clue-chip{padding:9px 10px;font-size:10px}.clue-chip b{font-size:11px}.tool-strip{display:none}
.hotspot{width:auto;min-width:142px;height:48px;padding:0 12px;border-radius:14px;display:flex;align-items:center;gap:9px;translate:-50% -50%;animation:markerPulse 2s ease-in-out infinite;background:rgba(5,8,10,.88);backdrop-filter:blur(8px)}
.hotspot:before{display:none}.spot-number{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:linear-gradient(#efd391,#ae7b38);color:#171006;font-size:12px;font-weight:950;flex:0 0 auto}.spot-label{text-align:left;font-size:11px;font-weight:850;white-space:nowrap}.hotspot.recorded .spot-number{background:#9ed6cb}.hotspot.recorded .spot-label{color:#c8e8e1}.hotspot.recorded{animation:none}
@keyframes markerPulse{50%{box-shadow:0 0 0 10px rgba(218,174,98,.10),0 0 28px rgba(218,174,98,.25)}}
.invest-sheet{top:max(100px,calc(env(safe-area-inset-top) + 88px))!important;right:max(24px,env(safe-area-inset-right));width:min(460px,40vw)!important;max-height:calc(100vh - 124px);padding:19px;overflow:auto}.invest-sheet h3{font-size:24px}.invest-sheet p{font-size:11px}.invest-sheet .type{font-size:10px}.invest-stage span{font-size:10px;padding:7px}.method{min-height:54px;padding:10px}.method b{font-size:11px}.method span{font-size:9px}.confidence{font-size:11px}.record-box{font-size:10px}.invest-hint{margin-top:10px;color:#d9c59d;font-size:11px;line-height:1.45}
.dungeon{left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));gap:12px}.dungeon-main,.zones{padding:18px 20px}.zone{min-height:122px;padding:13px}.zone b{font-size:14px}.zone span{font-size:10px;line-height:1.5}.zone.visited:after{font-size:9px}.boss-copy{width:min(580px,50vw);padding:20px 22px}.boss-copy h2{font-size:34px}.boss-taboo small{font-size:9px}.boss-taboo b{font-size:15px}
@media(max-width:900px){.invest-sheet{width:46vw!important}.travel,.explore{width:57vw}.dungeon{grid-template-columns:.9fr 1.25fr}.hotspot{min-width:120px}.spot-label{font-size:10px}.boss-copy{width:56vw}}
@media(max-height:620px){.travel,.explore{padding:14px 16px;bottom:14px}.route-step{min-height:52px}.invest-sheet{top:84px!important;max-height:calc(100vh - 98px)}.explore-guide{top:70px}.dungeon{bottom:14px}.zone{min-height:96px}}
.card :is(button,p,small,span,b),.topbar :is(button,p,small,span,b),.explore-guide span{font-size:max(12px,1em)!important}.card button,.zone,.hotspot{font-size:max(13px,1em)!important}
</style>

<body>
<div id="game" data-phase="travel">
 <video class="scene-video" id="sceneVideo" muted playsinline webkit-playsinline preload="metadata"></video><img class="scene-img" id="sceneImg" alt=""><div class="grade"></div><div class="rain"></div><div class="fog"></div><div class="memory"></div>
 <div class="topbar"><div class="location"><small id="regionKicker">REGION</small><b id="regionTitle"></b><div class="meta"><i class="real">實 현실 장소</i><i class="creative" id="creativeBadge" style="display:none">創 이면 해석</i></div></div><div class="phasebox"><small>현재 단계</small><b id="phaseTitle"></b><div class="meta"><i id="routeMemory">루트 기억 0</i><i id="clueCount">기록 0 / 3</i></div></div></div>
 <div class="explore-guide" aria-label="탐사 진행 순서"><span id="guideSelect">1 단서 선택</span><span id="guideObserve">2 관찰</span><span id="guideVerify">3 검증</span><span id="guideRecord">4 기록</span></div>
 <section class="travel card" id="travelPanel"><div class="eyebrow">JOURNEY · 현실 이동</div><h2 id="travelTitle"></h2><p class="copy" id="travelCopy"></p><div class="route-steps" id="routeSteps"></div><div class="travel-status"><span id="travelStatus"></span><b id="travelPct">0%</b></div><div class="progress"><i id="travelBar"></i></div><div class="actions"><button class="gold" id="nextTravel">계속 이동</button><button class="soft" id="skipTravel">바로 도착</button><button class="soft" id="exit1">지도</button></div></section>
 <section class="explore card" id="explorePanel" style="display:none"><div class="eyebrow">EXPLORATION · 탐험과 조사</div><h2 id="exploreTitle"></h2><p class="copy" id="exploreCopy"></p><div class="objective" id="exploreObjective"></div><div class="invest-summary"><div class="clue-list" id="clueList"></div><div class="tool-strip" id="toolStrip"></div></div><div class="actions"><button class="gold" id="nextClue">다음 단서 조사</button><button class="gold" id="enterDungeon" disabled>이면 경계 확인</button><button class="soft" id="exit2">지도</button></div></section>
 <div id="hotspots"></div>
 <aside class="invest-sheet card" id="investSheet"><span class="type" id="clueType"></span><h3 id="clueTitle"></h3><p id="clueDesc"></p><div class="invest-stage"><span id="sObserve">1 관찰</span><span id="sVerify">2 검증</span><span id="sRecord">3 기록</span></div><div class="invest-hint" id="investHint"></div><div class="invest-methods" id="investMethods"></div><div class="confidence"><span>조사 신뢰도</span><b id="confidence">미확인</b></div><div class="record-box" id="recordBox"></div><div class="actions"><button class="gold" id="advanceInvest">조사 계속</button><button class="soft" id="recordClue" disabled>기록 확정</button><button class="soft" id="closeInvest">닫기</button></div></aside>
 <section class="dungeon" id="dungeonPanel" style="display:none"><div class="dungeon-main card"><small>OTHER SIDE · 던전 배경 조사</small><h2 id="dungeonTitle"></h2><p class="copy" id="dungeonCopy"></p><div class="zone-progress" id="zoneProgress"></div><div class="actions"><button class="gold" id="completeRegion" disabled>배경 조사 완료</button><button class="soft" id="backExplore">현실 탐색으로</button><button class="soft" id="exit3">지도</button></div></div><div class="zones card"><div class="eyebrow">구역 조사</div><div class="zone-grid" id="zoneList"></div></div></section>
 
 <section class="boss-reveal" id="bossPanel" style="display:none">
  <div class="boss-copy card">
   <div class="eyebrow">創 · 네임드 등장 기록</div>
   <h2 id="bossName"></h2>
   <p class="copy" id="bossDesc"></p>
   <div class="boss-taboo"><small>금기</small><b id="bossTaboo"></b></div>
   <div class="actions"><button class="gold" id="confirmBoss">등장 기록 완료</button><button class="soft" id="replayBoss">장면 다시 보기</button></div>
  </div>
 </section>

function safeVideo(src,onEnd){try{video.pause()}catch{}video.src=src;video.currentTime=0;video.muted=true;video.playsInline=true;video.onended=onEnd||null;video.onerror=()=>{if(onEnd)onEnd()};const p=video.play();if(p&&p.catch)p.catch(()=>{if(onEnd)onEnd()})}
function setPhase(p){phase=p;game.dataset.phase=p;travel.style.display=p==='travel'?'block':'none';explore.style.display=p==='explore'?'block':'none';dungeon.style.display=p==='dungeon'?'grid':'none';bossPanel.style.display=p==='boss'?'flex':'none';$('#creativeBadge').style.display=(p==='dungeon'||p==='boss')?'inline-flex':'none';$('#phaseTitle').textContent=p==='travel'?'현실 이동':p==='explore'?'탐험 · 조사':p==='dungeon'?'이면 3구역 조사':'등장 기록';renderTop()}
function renderTop(){const r=refs[current],s=rstate();$('#regionKicker').textContent=r.tag;$('#regionTitle').textContent=r.name;$('#sourceNote').textContent=r.source;$('#routeMemory').textContent=`루트 기억 ${s.routeDone?1:0}`;$('#clueCount').textContent=`기록 ${s.clueStates.filter(x=>x.recorded).length} / 3`}
function start(){const r=refs[current],s=rstate();img.style.objectPosition=r.position;if(s.complete||s.bossSeen||s.zones.length>=r.zones.length)startBossReveal();else if(s.investigationComplete)startDungeon();else if(s.routeDone)startExplore();else startTravel();if(embedded)emit('hy-journey-ready',{version:'66.0'})}
function startTravel(){const r=refs[current],s=rstate();safeImg(ART[current].travel);try{video.pause()}catch{}video.muted=true;setPhase('travel');$('#travelTitle').textContent=r.travelTitle;$('#travelCopy').textContent=r.travelCopy;routeIndex=Math.max(0,Math.min(Number(s.routeIndex||0),r.route.length-1));renderRoute()}
function renderRoute(){const r=refs[current],p=(routeIndex/r.route.length)*100;$('#routeSteps').innerHTML=r.route.map((x,i)=>`<div class="route-step ${i<routeIndex?'done':''} ${i===routeIndex?'active':''}"><b>${i+1}. ${x[0]}</b><span>${x[1]}</span></div>`).join('');const step=r.route[Math.min(routeIndex,r.route.length-1)];$('#travelStatus').textContent=routeIndex>=r.route.length?'목적지 도착':`${step[0]} · ${step[1]}`;$('#travelBar').style.width=Math.round(p)+'%';$('#travelPct').textContent=Math.round(p)+'%';$('#nextTravel').textContent=routeIndex>=r.route.length-1?'목적지 도착':'다음 이동 구간'}
function runSegment(i){}
function advanceRoute(){const r=refs[current],s=rstate();routeIndex+=1;s.routeIndex=routeIndex;save();if(routeIndex>=r.route.length)return finishTravel();renderRoute();toast(`${routeIndex+1}/${r.route.length} 구간으로 이동합니다.`)}
function finishTravel(){try{video.pause()}catch{}const r=refs[current],s=rstate();const was=!s.routeDone;s.routeDone=true;s.routeIndex=r.route.length;save();if(was)emit('hy-journey-travel-complete',{walkSteps:r.route.reduce((a,x)=>a+Number(x[2]||0),0),route:r.route.map(x=>x[0])});startExplore()}
function startExplore(){try{video.pause()}catch{}const r=refs[current],s=rstate();safeImg(ART[current].explore);setPhase('explore');$('#exploreTitle').textContent=r.exploreTitle;$('#exploreCopy').textContent=r.exploreCopy;renderExplore()}
function renderExplore(){const r=refs[current],s=rstate(),n=s.clueStates.filter(x=>x.recorded).length,next=s.clueStates.findIndex(x=>!x.recorded);$('#clueList').innerHTML=r.clues.map((c,i)=>{const cs=s.clueStates[i],status=cs.recorded?(cs.confidence>=3?'추천 검증 완료':'기록 완료'):(cs.verified?'기록 대기':cs.observed?'검증 대기':'조사 필요');return `<button class="clue-chip ${cs.recorded?'recorded':''}" data-i="${i}"><b>${i+1}. ${c.title}</b>${status}</button>`}).join('');$('#clueList').querySelectorAll('button').forEach(b=>b.onclick=()=>openClue(+b.dataset.i));$('#toolStrip').innerHTML='';hotspots.innerHTML=r.clues.map((c,i)=>`<button class="hotspot ${s.clueStates[i].recorded?'recorded':''}" data-i="${i}" style="left:${c.x}%;top:${c.y}%" aria-label="${c.title}"><span class="spot-number">${s.clueStates[i].recorded?'✓':i+1}</span><span class="spot-label">${c.title}</span></button>`).join('');hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>openClue(+b.dataset.i));$('#exploreObjective').innerHTML=n<3?`<b>현재 목표</b> · 화면의 ${next+1}번 단서 ‘${r.clues[next].title}’를 누르거나 아래 ‘다음 단서 조사’를 누르세요.`:`<b>현실 조사 완료</b> · 기록 3개가 모였습니다. 이제 이면 경계를 확인할 수 있습니다.`;$('#nextClue').style.display=n<3?'inline-flex':'none';$('#enterDungeon').disabled=n<3;$('#enterDungeon').textContent=n<3?`기록 ${n} / 3`:'이면 경계 진입';renderGuide();renderTop();if(n===3&&!s.investigationComplete){s.investigationComplete=true;save();emit('hy-journey-investigation-complete',{records:r.clues.map((c,i)=>({clue:i,title:c.title,kind:c.kind,method:s.clueStates[i].method,confidence:s.clueStates[i].confidence}))})}}
function qty(id){return Number(parentCtx.itemQty?.[id]??0)}
function openClue(i){activeClue=i;const r=refs[current],c=r.clues[i];sheet.classList.add('open');$('#clueType').className='type '+(c.kind==='real'?'real':'anomaly');$('#clueType').textContent=c.kind==='real'?'實 현실 기록':'創 이상 징후';$('#clueTitle').textContent=`${i+1}. ${c.title}`;$('#clueDesc').textContent=c.desc;renderInvest()}
function availablePreferred(c){if(c.best==='photo'&&qty('camera')<1)return'observe2';if(c.best==='water'&&qty('water')<1)return'observe2';if(c.best==='mirror'&&qty('mirror')<1)return'observe2';if(c.best==='companion'&&!parentCtx.companionCard)return'observe2';return c.best}
function renderGuide(){const cs=activeClue>=0?rstate().clueStates[activeClue]:null;['#guideSelect','#guideObserve','#guideVerify','#guideRecord'].forEach(x=>$(x).classList.remove('on'));if(!cs)$('#guideSelect').classList.add('on');else if(!cs.observed)$('#guideObserve').classList.add('on');else if(!cs.verified)$('#guideVerify').classList.add('on');else $('#guideRecord').classList.add('on')}
function renderInvest(){if(activeClue<0)return;const r=refs[current],c=r.clues[activeClue],cs=rstate().clueStates[activeClue],preferred=availablePreferred(c);$('#sObserve').classList.toggle('on',cs.observed);$('#sVerify').classList.toggle('on',cs.verified);$('#sRecord').classList.toggle('on',cs.recorded);const methods=[{id:'observe',name:'기본 관찰',desc:'위치와 상태를 먼저 확인',ok:!cs.observed},{id:'observe2',name:'흔적 대조',desc:'도구 없이 주변과 비교',ok:cs.observed&&!cs.verified},{id:'photo',name:'사진 기록',desc:`카메라 보유 ${qty('camera')}`,ok:cs.observed&&!cs.verified&&qty('camera')>0},{id:'water',name:'정화수 확인',desc:`정화수 보유 ${qty('water')}`,ok:cs.observed&&!cs.verified&&qty('water')>0},{id:'mirror',name:'명두로 보기',desc:`명두 보유 ${qty('mirror')}`,ok:cs.observed&&!cs.verified&&qty('mirror')>0},{id:'companion',name:'동행 반응',desc:parentCtx.companionName||'동행 카드',ok:cs.observed&&!cs.verified&&!!parentCtx.companionCard}];$('#investMethods').innerHTML=methods.map(m=>`<button class="method ${preferred===m.id?'recommended':''}" data-m="${m.id}" ${m.ok?'':'disabled'}><b>${m.name}${preferred===m.id?' · 추천':''}</b><span>${m.desc}</span></button>`).join('');$('#investMethods').querySelectorAll('button:not([disabled])').forEach(b=>b.onclick=()=>useMethod(b.dataset.m));$('#confidence').textContent=cs.confidence>=3?'높음':cs.confidence===2?'보통':cs.confidence===1?'낮음':'미확인';$('#recordClue').disabled=!cs.verified||cs.recorded;$('#recordClue').textContent=cs.recorded?'기록 완료':'기록 확정';$('#recordBox').classList.toggle('show',cs.recorded);$('#recordBox').textContent=cs.recorded?c.record:'';const action=!cs.observed?'1단계 · 기본 관찰':!cs.verified?'2단계 · 추천 방법으로 검증':!cs.recorded?'3단계 · 기록 확정':'다음 단서로';$('#advanceInvest').textContent=action;$('#investHint').textContent=cs.recorded?'이 단서의 기록이 끝났습니다. 다음 단서로 진행하세요.':!cs.observed?'먼저 눈으로 단서의 위치와 상태를 확인합니다.':!cs.verified?'추천 방법이 없거나 도구가 부족해도 ‘흔적 대조’로 계속 진행할 수 있습니다.':'검증이 끝났습니다. 기록을 확정하면 탐사 진도가 저장됩니다.';renderGuide()}
async function advanceInvest(){if(activeClue<0)return;const c=refs[current].clues[activeClue],cs=rstate().clueStates[activeClue];if(!cs.observed)return useMethod('observe');if(!cs.verified)return useMethod(availablePreferred(c));if(!cs.recorded)return recordClue();sheet.classList.remove('open');activeClue=-1;const next=rstate().clueStates.findIndex(x=>!x.recorded);renderGuide();if(next>=0)openClue(next);else toast('현실 단서 3개를 모두 기록했습니다. 이면 경계로 진입하세요.')}
async function useMethod(m){const c=refs[current].clues[activeClue],cs=rstate().clueStates[activeClue];if(m==='observe'){cs.observed=true;cs.confidence=Math.max(cs.confidence,1);save();renderInvest();return toast('위치와 상태를 관찰했습니다. 이제 검증 방법을 고르세요.')}if(!cs.observed)return toast('먼저 기본 관찰이 필요합니다.');if(m==='water'){const ok=await consume('water',1);if(!ok)return toast('정화수가 부족합니다.')}cs.verified=true;cs.method=m;cs.confidence=Math.max(cs.confidence,c.best===m?3:2);save();renderInvest();toast(c.best===m?'추천 방법으로 검증했습니다.':'다른 방법으로도 기록 가능한 수준까지 확인했습니다.')}
function consume(item,qtyNeed){if(!embedded){if(qty(item)<qtyNeed)return Promise.resolve(false);parentCtx.itemQty[item]-=qtyNeed;return Promise.resolve(true)}return new Promise(resolve=>{const requestId='r'+Date.now()+Math.random().toString(16).slice(2);pendingItems.set(requestId,resolve);emit('hy-journey-use-item',{requestId,item,qty:qtyNeed});setTimeout(()=>{if(pendingItems.has(requestId)){pendingItems.delete(requestId);resolve(false)}},1800)})}
function recordClue(){if(activeClue<0)return;const r=refs[current],c=r.clues[activeClue],cs=rstate().clueStates[activeClue];if(!cs.verified||cs.recorded)return;cs.recorded=true;save();emit('hy-journey-clue',{clue:activeClue,title:c.title,kind:c.kind,method:cs.method,confidence:cs.confidence});renderInvest();renderExplore();toast(`${c.title} 기록을 저장했습니다. ‘다음 단서로’를 누르세요.`)}
function startDungeon(){try{video.pause()}catch{}const r=refs[current],s=rstate();safeImg(ART[current].dungeon);setPhase('dungeon');sheet.classList.remove('open');hotspots.innerHTML='';$('#dungeonTitle').textContent=r.dungeonTitle;$('#dungeonCopy').textContent=r.dungeonCopy;renderZones();emit('hy-journey-dungeon-open',{records:s.clueStates.filter(x=>x.recorded).length})}
function renderZones(){const r=refs[current],s=rstate();$('#zoneList').innerHTML=r.zones.map((z,i)=>`<button class="zone ${s.zones.includes(i)?'visited':''}" data-i="${i}"><b>${i+1}. ${z[0]}</b><span>${z[1]}</span></button>`).join('');$('#zoneList').querySelectorAll('button').forEach(b=>b.onclick=()=>visitZone(+b.dataset.i));const n=s.zones.length;$('#zoneProgress').textContent=n<r.zones.length?`현재 목표 · 오른쪽 구역 카드 조사 ${n} / ${r.zones.length}`:`이면 3구역 조사가 끝났습니다. ${r.boss.name}의 등장을 확인하세요.`;$('#completeRegion').disabled=n<r.zones.length;$('#completeRegion').textContent=n<r.zones.length?`구역 조사 ${n} / ${r.zones.length}`:`${r.boss.name} 등장 확인`;renderTop()}
function visitZone(i){const r=refs[current],s=rstate();img.style.objectPosition=r.zones[i][2];if(!s.zones.includes(i)){s.zones.push(i);save();emit('hy-journey-zone',{zone:i,title:r.zones[i][0],walkSteps:80})}renderZones();$('#zoneList').querySelectorAll('.zone').forEach((b,j)=>b.classList.toggle('active',j===i));toast(`${r.zones[i][0]} 배경을 조사했습니다.`)}
function complete(){const r=refs[current],s=rstate();if(s.zones.length<r.zones.length)return;startBossReveal()}
function startBossReveal(){const r=refs[current],s=rstate();try{video.pause()}catch{}safeImg(ART[current].boss||ART[current].dungeon);img.style.objectPosition=current==='yeoja'?'center top':r.position;setPhase('boss');$('#bossName').textContent=r.boss.name;$('#bossDesc').textContent=r.boss.desc;$('#bossTaboo').textContent=r.boss.taboo;$('#confirmBoss').textContent=s.complete?'기록 완료 · 지도':'등장 기록 완료';toast(`${r.boss.name}의 등장을 확인했습니다.`);emit('hy-journey-boss-open',{boss:r.boss.name,taboo:r.boss.taboo})}
function confirmBoss(){const r=refs[current],s=rstate();if(!s.bossSeen){s.bossSeen=true;s.complete=true;save();emit('hy-journey-boss-seen',{boss:r.boss.name,taboo:r.boss.taboo});emit('hy-journey-complete',{zones:s.zones.length,records:s.clueStates.filter(x=>x.recorded).length,boss:r.boss.name})}toast(`${r.name}의 이동·탐험·조사·등장 기록을 완료했습니다.`);setTimeout(()=>exit(),700)}
function replayBoss(){img.animate([{transform:'scale(1.015)'},{transform:'scale(1.06)'},{transform:'scale(1.015)'}],{duration:1800,easing:'ease-in-out'});toast('등장 장면을 다시 확인했습니다.')}
function exit(){if(embedded)emit('hy-journey-exit');else history.back()}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='hy-journey-context'){parentCtx={...parentCtx,...d,itemQty:{...parentCtx.itemQty,...(d.itemQty||{})}};if(phase==='explore')renderExplore();if(sheet.classList.contains('open'))renderInvest()}if(d.type==='hy-journey-item-result'){const fn=pendingItems.get(d.requestId);if(!fn)return;pendingItems.delete(d.requestId);if(d.ok&&d.item)parentCtx.itemQty[d.item]=Number(d.remaining||0);fn(!!d.ok);if(phase==='explore')renderExplore()}});
$('#nextTravel').onclick=advanceRoute;$('#skipTravel').onclick=finishTravel;$('#exit1').onclick=exit;$('#exit2').onclick=exit;$('#exit3').onclick=exit;$('#closeInvest').onclick=()=>{sheet.classList.remove('open');activeClue=-1;renderGuide()};$('#nextClue').onclick=()=>{const i=rstate().clueStates.findIndex(x=>!x.recorded);if(i>=0)openClue(i)};$('#advanceInvest').onclick=advanceInvest;$('#recordClue').onclick=recordClue;$('#enterDungeon').onclick=startDungeon;$('#backExplore').onclick=startExplore;$('#completeRegion').onclick=complete;$('#confirmBoss').onclick=confirmBoss;$('#replayBoss').onclick=replayBoss;
start();
})();
</script>
</body></html>
