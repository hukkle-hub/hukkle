<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0d">
<title>흥양기 · 배포 상태</title>
<style>
:root{--bg:#07090a;--panel:#111617;--line:rgba(255,226,160,.16);--gold:#ddb86f;--text:#f5efe2;--muted:#aaa394;--ok:#66b29c;--bad:#d65d58;--wait:#d5a955}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#202a2e,#07090a 58%);color:var(--text);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}main{width:min(1040px,calc(100% - 28px));margin:auto;padding:34px 0 70px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-family:"Noto Serif KR",serif;font-size:clamp(28px,5vw,54px);margin:5px 0}.kicker{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:900}.sub{color:var(--muted);font-size:12px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(#f0d28c,#b9843e);color:#171006;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,rgba(25,31,32,.95),rgba(8,11,12,.97));padding:17px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.card small{display:block;color:var(--muted);font-size:9px;letter-spacing:.08em}.card b{display:block;margin-top:8px;font-size:14px;word-break:break-all}.status{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--wait);box-shadow:0 0 14px currentColor}.ok .dot{background:var(--ok)}.bad .dot{background:var(--bad)}section{margin-top:14px}.wide{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:7px}.list li{padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.03);color:#d1c8b8;font-size:11px}.list li:before{content:"·";color:var(--gold);margin-right:8px}.log{height:230px;overflow:auto;background:#050707;border-radius:14px;border:1px solid rgba(255,255,255,.08);padding:12px;font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b9c2bc}.log div{border-bottom:1px solid rgba(255,255,255,.04);padding:3px 0}.muted{color:var(--muted)}code{color:#ffe0a0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wide{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><span class="kicker">HEUNGYANGGI LIVE OPS</span><h1>서버·배포 상태</h1><p class="sub">현재 배포된 클라이언트, GitHub Pages 빌드, 서비스워커와 Supabase API를 한 화면에서 확인합니다.</p></div><div class="actions"><button class="btn primary" id="refresh">전체 확인</button><button class="btn" id="openGame">게임 열기</button><button class="btn" id="clearCache">캐시 삭제</button></div></header>
<div class="grid">
  <article class="card" id="clientCard"><small>서버 최신 클라이언트</small><b id="clientVersion">확인 중</b></article>
  <article class="card" id="buildCard"><small>배포 커밋</small><b id="buildId">확인 중</b></article>
  <article class="card" id="apiCard"><small>Supabase API</small><b class="status"><i class="dot"></i><span id="apiStatus">확인 중</span></b></article>
  <article class="card" id="swCard"><small>서비스워커</small><b class="status"><i class="dot"></i><span id="swStatus">확인 중</span></b></article>
</div>
<section class="wide">
  <article class="card"><small>릴리스</small><h2 id="releaseName">-</h2><p class="sub" id="releaseMeta">-</p><ul id="notes" class="list"></ul></article>
  <article class="card"><small>운영 제어</small><div style="margin-top:14px;display:grid;gap:9px"><div><span class="muted">채널</span> <b id="channel">-</b></div><div><span class="muted">최소 버전</span> <b id="minimum">-</b></div><div><span class="muted">강제 업데이트</span> <b id="forced">-</b></div><div><span class="muted">점검 모드</span> <b id="maintenance">-</b></div></div></article>
</section>
<section class="card"><small>확인 기록</small><div id="log" class="log"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);const log=(m)=>{const d=document.createElement('div');d.textContent=`${new Date().toLocaleTimeString('ko-KR')}  ${m}`;$('#log').prepend(d)};const bust=u=>`${u}${u.includes('?')?'&':'?'}_=${Date.now()}`;
async function json(url){const r=await fetch(bust(url),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
function mark(id,ok){const el=$(id);el.classList.toggle('ok',ok);el.classList.toggle('bad',!ok)}
async function refresh(){log('전체 상태 확인 시작');$('#apiStatus').textContent='확인 중';$('#swStatus').textContent='확인 중';
 let version=null;try{version=await json('../version.json');$('#clientVersion').textContent=`v${version.version} · ${version.content_version}`;$('#releaseName').textContent=version.release_name||'흥양기 릴리스';$('#releaseMeta').textContent=`${version.published_at||'-'} · API ${version.api_version||'-'}`;$('#channel').textContent=version.channel||'-';$('#minimum').textContent=version.min_supported_version||'-';$('#forced').textContent=version.force_update?'사용':'해제';$('#maintenance').textContent=version.maintenance?'점검 중':'정상';$('#notes').innerHTML=(version.release_notes||[]).map(n=>`<li>${String(n).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</li>`).join('');mark('#clientCard',true);log(`버전 매니페스트 정상: ${version.version}`)}catch(e){$('#clientVersion').textContent='불러오기 실패';mark('#clientCard',false);log(`버전 확인 실패: ${e.message}`)}
 try{const b=await json('../build-info.json');$('#buildId').textContent=(b.commit||b.build||'-').slice(0,16);mark('#buildCard',true);log(`배포 빌드 정상: ${b.commit||b.build}`)}catch(e){$('#buildId').textContent='불러오기 실패';mark('#buildCard',false);log(`빌드 확인 실패: ${e.message}`)}
 try{const endpoint=version?.api_status_endpoint||version?.api_health_endpoint;if(!endpoint)throw new Error('엔드포인트 미설정');const t=performance.now();const r=await fetch(bust(endpoint),{cache:'no-store',headers:{'x-client-version':version?.version||'0.0.0'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const status=await r.json();$('#apiStatus').textContent=`정상 · ${Math.round(performance.now()-t)}ms · API ${status.api_version||version?.api_version||'-'}`;mark('#apiCard',true);if(status.client_latest){$('#clientVersion').textContent=`v${status.client_latest} · ${status.content_version||version?.content_version||'-'}`;$('#minimum').textContent=status.client_min||version?.min_supported_version||'-';$('#maintenance').textContent=status.maintenance?'점검 중':'정상'}log(`Supabase 상태 API 정상: ${status.server_time||'응답 완료'}`)}catch(e){$('#apiStatus').textContent='상태 API 실패 · 마스터 재확인';mark('#apiCard',false);log(`상태 API 확인 실패: ${e.message}`);try{const fallback=version?.api_health_endpoint;if(!fallback)throw e;const r=await fetch(bust(fallback),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);await r.json();$('#apiStatus').textContent='기존 API 정상 · 상태 패치 미배포';mark('#apiCard',true);log('기존 /master 응답 정상 — api/index.ts 업데이트 패치를 배포하세요.')}catch(f){$('#apiStatus').textContent='연결 실패';mark('#apiCard',false);log(`API 최종 확인 실패: ${f.message}`)}}
 try{if(!('serviceWorker'in navigator))throw new Error('미지원');const reg=await navigator.serviceWorker.register('../sw.js',{scope:'../',updateViaCache:'none'});await reg.update();$('#swStatus').textContent=reg.waiting?'업데이트 대기':navigator.serviceWorker.controller?'활성':'설치 중';mark('#swCard',true);log(`서비스워커 정상: ${$('#swStatus').textContent}`)}catch(e){$('#swStatus').textContent='등록 실패';mark('#swCard',false);log(`서비스워커 확인 실패: ${e.message}`)}
}
$('#refresh').onclick=refresh;$('#openGame').onclick=()=>location.href='../';$('#clearCache').onclick=async()=>{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('hy-')).map(k=>caches.delete(k)));log('흥양기 캐시 삭제 완료')}const reg=await navigator.serviceWorker?.getRegistration('../');if(reg)await reg.unregister();location.reload()};refresh();
</script>
</body>
</html>
