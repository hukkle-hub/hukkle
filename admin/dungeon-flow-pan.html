<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050709">
<title>흥양기 · 판 보스전 프로토타입 v81</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050709}
#boot{position:fixed;z-index:3;left:50%;top:50%;translate:-50% -50%;color:#ead8b4;font:700 14px system-ui,sans-serif;letter-spacing:.04em;pointer-events:none}
body.ready #boot{display:none}
</style>
</head>
<body>
<div id="boot">판을 여는 중…</div>
<iframe id="gameFrame" title="흥양기 판 보스전" allow="autoplay; fullscreen"></iframe>
<script>
(() => {
  const frame = document.getElementById('gameFrame');
  const src = './dungeon-flow.html' + location.search + location.hash;
  frame.src = src;
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument;
      const script = doc.createElement('script');
      script.src = './pan-system-v81.js?v=81.0.0';
      script.onload = () => document.body.classList.add('ready');
      script.onerror = () => { document.getElementById('boot').textContent = '판 시스템을 불러오지 못했습니다.'; };
      doc.body.appendChild(script);
    } catch (err) {
      document.getElementById('boot').textContent = '같은 출처에서만 판 시스템을 실행할 수 있습니다.';
      console.error(err);
    }
  }, { once: true });

  // 기존 index.html ↔ dungeon-flow.html postMessage 흐름을 그대로 통과시킨다.
  window.addEventListener('message', (event) => {
    if (event.source === frame.contentWindow) {
      if (window.parent && window.parent !== window) window.parent.postMessage(event.data, '*');
      return;
    }
    if (frame.contentWindow) frame.contentWindow.postMessage(event.data, '*');
  });
})();
</script>
</body>
</html>
