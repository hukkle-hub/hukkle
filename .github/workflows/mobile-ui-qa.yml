name: Mobile UI QA

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "admin/**"
      - "update-client.js"
      - "tools/qa_mobile_ui.mjs"
      - "tools/qa_yeojaman_flow.mjs"
      - "tools/qa_combat_v68.mjs"
      - "tools/qa_pan.mjs"
      - "tools/qa_cinematic_v82.mjs"
      - "package.json"
      - ".github/workflows/mobile-ui-qa.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:mobile
      - run: npm run qa:yeojaman
      - run: npm run qa:combat
      - run: npm run qa:cinematic
      - name: Upload cinematic pose and viewport QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-v82-qa
          path: qa-cinematic/
          if-no-files-found: error
          retention-days: 30
      - name: Upload nine-screen QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Yeojaman full-flow QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeojaman-full-flow-qa
          path: qa-yeojaman/
          if-no-files-found: error
          retention-days: 30
      - name: Upload five-region combat QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-region-combat-qa
          path: qa-combat/
          if-no-files-found: error
          retention-days: 30
