/* 신물 궤 — 창고에 뭐가 쌓였는지 보여준다. 여태 개수 조회만 하고 보여주지는 않았다.
   신표(SP_xxx)는 카드에 묶여 있으므로 그 카드의 그림으로 보여주고,
   유니크에 셋이 필요하니 몇/3 인지까지 같이 말한다. */
function sinmulHtml(){
  const rows = (ME?.materials ?? []).filter(x => (x.qty ?? 0) > 0);
  if(!rows.length)
    return `<div class="card"><h3>신물 궤 神物櫃</h3>
      <div style="font-size:11.5px;color:var(--dim);line-height:1.7">
        아직 아무것도 없다. 길에 나가 악귀를 물리치면 쌓인다.</div></div>`;

  const plain = rows.filter(x => !String(x.material_id).startsWith("SP_"));
  const sp    = rows.filter(x =>  String(x.material_id).startsWith("SP_"));

  const plainHtml = plain.length ? `<dl>${plain.map(x=>
    `<div class="row"><dt>${esc(x.material_id)}</dt><dd>${Number(x.qty).toLocaleString()}</dd></div>`
  ).join("")}</dl>` : "";

  const spHtml = sp.length ? `
    <div style="font-size:11px;color:var(--dim);margin:11px 0 7px">신표 神標 — 셋을 모으면 유니크가 열린다</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px">
      ${sp.map(x=>{
        const c = M.cards.find(k => k.sinpyo_id === x.material_id);
        const a = c ? artOf(c) : null;
        const n = Math.min(3, x.qty), full = x.qty >= 3;
        return `<div style="text-align:center">
          <div class="mini${full?" sel":""}" style="cursor:default">
            <span class="band f-${esc(c?.faction ?? "당")}"></span>
            ${a ? `<img src="${a}" alt="" loading="lazy">` : ""}
            <span class="blank" ${a?"hidden":""}></span>
          </div>
          <div style="font-size:10px;color:var(--dim);margin-top:4px;line-height:1.35">
            ${esc(c?.name ?? x.material_id)}<br>
            <b style="color:${full?"var(--hwang)":"var(--dim)"}">${n}</b>/3</div>
        </div>`;
      }).join("")}
    </div>` : "";

  return `<div class="card"><h3>신물 궤 神物櫃</h3>${plainHtml}${spHtml}</div>`;
}

/* ══ 기른다 — 진화 · 각성 · 유니크 ═══════════════
   여태 확률만 보여주고 정작 기를 수가 없었다. 서버엔 라우트가 다 있다.
   카드를 제물로 태우는 일이라 자동으로 고르지 않는다 — 반드시 손으로 고르게 한다. */
let GROW = null;   // {kind, id, need, pick:Set}

function growClose(){ GROW=null; $("#growOv").classList.remove("on"); }

/* 제물이 될 수 있는 카드만 추린다 */
function growFeeds(kind, me){
  return ME.cards.filter(pc => {
    if(pc.id === me.id) return false;              // 자기 자신은 못 먹는다
    if(pc.locked) return false;                    // 잠근 것은 건드리지 않는다
    if(kind === "evolve") return (pc.tier ?? 1) === (me.tier ?? 1);
    if(kind === "awaken") return pc.card_id === me.card_id;
    if(kind === "slot")   return true;             // 접신은 아무 카드나 먹는다
    return false;
  });
}

function growOpen(kind, pcId){
  const me = ME.cards.find(c => c.id === pcId);
  if(!me) return;
  const need = kind === "evolve" ? EVO_FEED[Math.min(5,(me.tier??1)+1)]
             : (kind === "awaken" || kind === "slot") ? 1 : 0;
  GROW = { kind, id: pcId, need, pick: new Set() };
  growPaint();
  $("#growOv").classList.add("on");
}

function growPick(id){
  if(!GROW) return;
  if(GROW.pick.has(id)) GROW.pick.delete(id);
  else if(GROW.pick.size < GROW.need) GROW.pick.add(id);
  growPaint();
}

function growPaint(res){
  if(!GROW) return;
  const me = ME.cards.find(c => c.id === GROW.id);
  const c  = mc(me.card_id) ?? GHOST(me.card_id);
  const k  = GROW.kind;
  const t  = me.tier ?? 1, awk = me.awaken ?? 0;
  const to = Math.min(5, t+1), an = Math.min(5, awk+1);

  const title = k==="evolve" ? `진화 — ${t}성 → ${to}성`
              : k==="awaken" ? `각성 — ${awk} → ${an}단계`
              : k==="slot"   ? `접신 — 넋을 이 카드에 옮긴다`
              : `유니크를 연다`;
  const rate  = k==="evolve" ? rateOf(EVO_RATE[to], EVO_JEONG[to], me.evo_jeongseong, EVO_CAP)
              : k==="awaken" ? rateOf(AWK_RATE[an], AWK_JEONG, me.awaken_jeongseong, AWK_CAP)
              : k==="slot"   ? 100                       // 접신은 판정이 없다. 반드시 붙는다
              : rateOf(UNQ_RATE, UNQ_JEONG, me.unique_jeongseong, UNQ_CAP);
  const cost  = k==="evolve" ? `엽전 ${EVO_YEOP[to].toLocaleString()}`
              : k==="awaken" ? `상급신물 ${AWK_SIN[an]}`
              : k==="slot"   ? `카드 1장 (영영 사라진다)`
              : `${esc(c.name)}의 신표 3`;

  /* 결과가 왔으면 결과만 보여준다 */
  if(res){
    $("#growIn").innerHTML = `
      <div class="ov-b" style="padding:20px 18px">
        <div style="font-family:var(--serif);font-size:22px;font-weight:800;
             color:${res.success?"var(--hwang-l)":"var(--jeok)"};text-align:center">
          ${GROW.kind==="slot" ? "넋이 옮겨 붙었다" : (res.success ? "이루었다" : "이루지 못했다")}</div>
        <div style="text-align:center;font-size:11px;color:var(--dim);margin-top:6px">
          ${title} · 확률 ${res.rate_used ?? rate}%</div>
        <dl style="margin-top:14px">
          ${res.jeongseong != null
            ? `<div class="row"><dt>정성</dt><dd>${res.jeongseong}${
                res.next_rate!=null?` — 다음엔 <b style="color:var(--hwang)">${res.next_rate}%</b>`:""}</dd></div>`:""}
          ${res.note ? `<div class="row"><dt>말</dt><dd>${esc(res.note)}</dd></div>`:""}
        </dl>
        <button class="btn" style="margin-top:14px" onclick="growDone()">물러난다</button>
      </div>`;
    return;
  }

  /* ── 정성(精誠) 게이지 ──
     제물을 태워 확률에 기대는 대신, 신물을 올려 확률을 미리 끌어올린다.
     값은 전부 서버에서 온 것이다. 여기서 계산해 보여주기만 하고 손대지 않는다. */
  const jBase = k==="evolve" ? EVO_RATE[to]  : k==="awaken" ? AWK_RATE[an] : UNQ_RATE;
  const jPer  = k==="evolve" ? EVO_JEONG[to] : k==="awaken" ? AWK_JEONG    : UNQ_JEONG;
  const jCap  = k==="evolve" ? EVO_CAP       : k==="awaken" ? AWK_CAP      : UNQ_CAP;
  const jNow  = Number(k==="evolve" ? me.evo_jeongseong
                     : k==="awaken" ? me.awaken_jeongseong
                                    : me.unique_jeongseong) || 0;
  const jNeed = jeongNeed(jBase, jPer, jCap);
  const jLeft = Math.max(0, jNeed - jNow);
  const jFull = jLeft === 0;
  const sinHave  = MAT(JEONG_MAT);
  const yeopHave = Number(ME.player?.yeopjeon ?? 0);
  const canOne = !jFull && sinHave >= 1 && yeopHave >= JEONG_YEOP;
  const jMax   = Math.min(jLeft, sinHave, Math.floor(yeopHave / JEONG_YEOP));

  const jeongHtml = k==="slot" ? "" : `
    <div class="jeong${jFull?" full":""}">
      <div class="jhd">
        <span>정성 精誠</span>
        <span>${jNow} / ${jNeed} · 성공 <b>${rate}%</b>${jFull?" <i>상한</i>":""}</span>
      </div>
      <div class="jbar">${Array.from({length:jNeed},(_,i)=>
        `<i class="${i<jNow?"on":""}"></i>`).join("")}</div>
      <div class="jnote">${ jFull
        ? `정성이 다 닿았다. 이제 올리면 된다.`
        : `${JEONG_MAT} 하나에 <b>+${jPer}%p</b> — 상한까지 <b>${jLeft}</b>번 남았다.` }</div>
      <div class="jhave">
        <span>${JEONG_MAT} <b class="${sinHave?"":"no"}">${sinHave}</b></span>
        <span>엽전 <b class="${yeopHave>=JEONG_YEOP?"":"no"}">${yeopHave.toLocaleString()}</b></span>
        <span>하나당 ${JEONG_MAT} 1 · 엽전 ${JEONG_YEOP.toLocaleString()}</span>
      </div>
      ${ jFull ? "" : `<div class="jbtn">
        <button class="btn sm ghost" style="flex:1" ${canOne?"":"disabled"}
          onclick="jeongRun(1)">하나 올린다</button>
        <button class="btn sm ghost" style="flex:1" ${jMax>1?"":"disabled"}
          onclick="jeongRun(${jMax})">${jMax>1?`${jMax}번 올린다`:"가득 채운다"}</button>
      </div>`}
    </div>`;

  const feeds = k==="unique" ? [] : growFeeds(k, me);
  const short = GROW.pick.size < GROW.need;

  $("#growIn").innerHTML = `
    <div class="ov-b" style="padding:16px 16px 18px">
      <div style="font-family:var(--serif);font-size:17px;font-weight:800">${title}</div>
      <div class="num" style="margin-top:8px">
        <span>드는 것 <b>${cost}</b></span>
        <span>성공 <b>${rate}%</b></span>
        ${k!=="unique"?`<span>제물 <b>${GROW.pick.size}/${GROW.need}</b></span>`:""}
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:9px;line-height:1.7">
        ${k==="evolve" ? `같은 <b>${t}성</b> 카드 ${GROW.need}장을 태운다. 실패해도 재료는 그대로다.`
        : k==="awaken" ? `같은 카드 1장을 태운다. 실패해도 재료 카드는 남고 신물만 든다.`
        : k==="slot"   ? `<b style="color:var(--jeok)">되돌릴 수 없다.</b> 바친 카드는 영영 사라지고,
                          붙은 넋은 다시 뗄 수 없다. 자리는 둘뿐이다.`
        : `실패해도 신표 하나만 나가고 정성이 쌓인다.`}
      </div>

      ${jeongHtml}

      ${k!=="unique" ? (feeds.length
        ? `<div class="grid" style="margin-top:12px;max-height:38vh;overflow:auto">
             ${feeds.map(f=>{
               const fc = mc(f.card_id) ?? GHOST(f.card_id);
               const a  = artOf(fc, f.tier), on = GROW.pick.has(f.id);
               return `<div class="mini${on?" sel":""}" onclick="growPick(${f.id})">
                 <span class="band f-${esc(fc.faction??"당")}"></span>
                 ${a?`<img src="${a}" alt="" loading="lazy">`:""}
                 <span class="blank" ${a?"hidden":""}></span>
                 <span class="tr">${"★".repeat(f.tier??1)}</span>
                 <div class="nm">${esc(fc.name??"")}</div></div>`;
             }).join("")}
           </div>`
        : `<div class="err" style="margin-top:12px"><b>제물이 없다</b>
             ${k==="evolve"?`${t}성 카드가 더 있어야 한다.`:`같은 카드가 한 장 더 있어야 한다.`}</div>`)
        : ""}

      <div id="growErr"></div>
      <div style="display:flex;gap:6px;margin-top:13px">
        <button class="btn ghost" style="flex:1" onclick="growClose()">그만둔다</button>
        <button class="btn" style="flex:1.4" id="growGo"
          ${k!=="unique" && short ? "disabled" : ""} onclick="growRun()">올린다</button>
      </div>
    </div>`;
}

/* ══ 무신도 회랑 — 노드를 연다 ══════════════
   서버(hy v17)의 /grow/node · /grow/node_reset 을 그대로 쓴다. */
let NODEV = null;   // {id}

function nodeClose(){ NODEV=null; $("#growOv").classList.remove("on"); }

function nodeOpen(pcId){
  NODEV = { id: pcId };
  nodePaint();
  $("#growOv").classList.add("on");
}

function nodePaint(res){
  if(!NODEV) return;
  const me = ME.cards.find(c => c.id === NODEV.id);
  if(!me) return nodeClose();
  const gm = gmOf(me), reach = nodeReach(gm.nodes);
  const yeop = Number(ME.player?.yeopjeon ?? 0);
  const hon  = MAT(HON);

  const lv = Number(me.level) || 1;

  const rows = NODES.map(n=>{
    const on = gm.nodes.includes(n.id);
    const needLv = NODE_LV_GATE[n.level] || 1;
    const seqLock = !on && n.level > reach;          // 앞 단계를 아직 안 열었다
    const lvLock  = !on && lv < needLv;              // 격이 모자라다
    const poor    = !on && !seqLock && !lvLock && (yeop < n.yeop || hon < n.hon);
    let state;
    if(on)           state = `<span style="color:var(--hwang)">열렸다</span>`;
    else if(lvLock)  state = `<span style="color:var(--jeok)">격 ${needLv} 필요</span>`;
    else if(seqLock) state = `<span style="color:#5C5347">앞 단계를 먼저</span>`;
    else             state = `엽전 ${n.yeop.toLocaleString()} · ${HON} ${n.hon}`;
    return `<div class="nrow${on?" on":""}${(seqLock||lvLock)?" lk":""}">
      <div class="nn">${esc(n.name)}<span class="nl">${esc(n.eff)}</span></div>
      <div class="nc">${state}</div>
      ${on || seqLock || lvLock ? "" :
        `<button class="btn sm" ${poor?"disabled":""} onclick="nodeRun('${n.id}')">${
          poor ? "모자라다" : "연다"}</button>`}
    </div>`;
  }).join("");

  $("#growIn").innerHTML = `
    <div class="ov-b" style="padding:16px 16px 18px">
      <div style="font-family:var(--serif);font-size:17px;font-weight:800">무신도 회랑 巫神圖</div>
      <div class="num" style="margin-top:8px">
        <span>격 <b>${lv}</b>/${CARD_LV_CAP(me.tier)}</span>
        <span>엽전 <b>${yeop.toLocaleString()}</b></span>
        <span>${HON} <b>${hon}</b></span>
        <span>노드 <b>${gm.nodes.length}</b>/${NODES.length}</span>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:9px;line-height:1.7">
        앞 단계를 하나라도 열면 다음 단계가 열린다. 같은 단계는 몇이든 열 수 있다.<br>
        회랑마다 격이 필요하다 — <b style="color:var(--hwang-l)">1단 격 10 · 2단 격 25 · 3단 격 40</b>.
        격의 상한은 성급×8이라, 3단은 5성이라야 닿는다.
      </div>
      <div class="nodes">${rows}</div>
      <div id="nodeErr">${res ? `<div class="err" style="margin-top:11px">${esc(res)}</div>` : ""}</div>
      <div style="display:flex;gap:6px;margin-top:13px">
        <button class="btn ghost" style="flex:1" onclick="nodeClose()">물러난다</button>
        <button class="btn ghost" style="flex:1" ${gm.nodes.length?"":"disabled"}
          onclick="nodeReset()">정화 (${NODE_RESET_FEE.toLocaleString()})</button>
      </div>

/* 신물을 올려 정성을 쌓는다. 서버가 정본이라, 화면 값을 손으로 고치지 않고
   /player 를 다시 받아 그린다. 초과분은 서버가 알아서 필요한 만큼만 먹는다. */
async function jeongRun(qty){
  if(!GROW || GROW.kind === "slot") return;
  const el = $("#growErr"); if(el) el.innerHTML = "";
  document.querySelectorAll("#growIn .jbtn button").forEach(b => b.disabled = true);
  try{
    const r = await api("/grow/jeong", {
      card_id: GROW.id, kind: GROW.kind, qty: Math.max(1, Number(qty) || 1) });
    await refresh();
    growPaint();
    const g = $("#growIn .jeong");
    if(g){ g.classList.remove("lit"); void g.offsetWidth; g.classList.add("lit"); }

/* ══ 진화 연출 ═══════════════════════════════
   연출의 실체는 그림 두 장이다 — 지금 성급의 그림에서 다음 성급의 그림으로 넘어간다.
   단계 그림이 없으면 연출을 하지 않는다. CSS로 그린 가짜 빛으로 때우지 않는다(#34).
   빛줄기는 두 그림 사이를 건너가는 동안만 스치는 보조다. */
function evoScene(cardId, fromTier, toTier){
  const a = tierArt(cardId, fromTier), b = tierArt(cardId, toTier);
  if(!a || !b || a === b) return false;
  let v = $("#evoOv");
  if(!v){ v = document.createElement("div"); v.id = "evoOv"; v.className = "evo-ov";
          v.addEventListener("click", ()=>v.classList.remove("on"));
          document.body.appendChild(v); }
  v.innerHTML = `
    <div class="evo-st">
      <img class="a" src="${a}" alt="">
      <img class="b" src="${b}" alt="">
      <span class="ray"></span>
      <span class="tr">${"★".repeat(Math.max(1,Math.min(5,toTier)))}</span>
    </div>`;
  v.classList.remove("on"); void v.offsetWidth; v.classList.add("on");
  setTimeout(()=>{ if(v) v.classList.remove("on"); }, 3000);
  return true;
}

async function growRun(){
  if(!GROW) return;
  const b = $("#growGo"); if(b){ b.disabled = true; b.textContent = "…"; }
  const { kind, id } = GROW;
  const before = ME.cards.find(c => c.id === id);
  const beforeTier = before?.tier ?? 1, beforeCard = before?.card_id;
  const body = kind === "evolve" ? { player_card_id:id, feed_ids:[...GROW.pick] }
             : kind === "awaken" ? { player_card_id:id, feed_id:[...GROW.pick][0] }
             : kind === "slot"   ? { main_card_id:id, feed_card_id:[...GROW.pick][0] }
             : { player_card_id:id };
  try{
    const r = await api(`/grow/${kind}`, body);
    if(r.success){
      /* 진화는 그림이 바뀐다. 바뀌는 걸 보여주는 게 연출이다.
         단계 그림이 있는 카드만 장면이 뜨고, 없으면 천만 한 번 쓴다. */
      const shown = kind === "evolve" && evoScene(beforeCard, beforeTier, beforeTier + 1);
      if(!shown) salpuriSweep();
    }
    growPaint(r);
  }catch(e){
    const el = $("#growErr");
    if(el) el.innerHTML = fail(e);
    if(b){ b.disabled = false; b.textContent = "올린다"; }
  }
}

let PICK = [];
function dang(){
  const cap = SINRYEOK();
  const costOf = id => {
    const pc = ME.cards.find(c=>c.id===id);
    return M.tiers.find(t=>t.tier===pc?.tier)?.cost ?? 0;
  };
  const cost = PICK.reduce((s,id)=>s+costOf(id), 0);
  const over = cost > cap;

  /* 슬롯 — 예전엔 그리드에 선택 표시만 있었다. 그러면 누가 앞장서는지가 화면에 없다.
     리더 보너스가 걸리는데 리더가 안 보이면 그건 없는 기능이다. */
  const lead = PICK[0] ? mc(ME.cards.find(c=>c.id===PICK[0])?.card_id) : null;
  const slots = [0,1,2,3,4].map(i=>{
    const id = PICK[i];
    if (!id) return `<div class="sl"><span class="no">${i+1}</span><span class="e">비었다</span></div>`;
    const pc = ME.cards.find(c=>c.id===id);
    const c  = mc(pc.card_id) ?? GHOST(pc.card_id);
    const src = artOf(c, pc.tier);
    return `<div class="sl has ${i===0?"lead":""}" onclick="drop(${id})">
      <span class="no">${i+1}</span>
      ${src?`<img src="${src}" alt="">`:`<span class="e">${esc(c.name[0])}</span>`}
      ${i===0?`<span class="ld">앞장선다</span>`:""}</div>`;
  }).join("");

  $("#p-dang").innerHTML = `
    <h2>당 堂</h2>
    <p class="sub">다섯 위(位)까지 모신다. <b style="color:var(--hwang)">1번 칸이 앞장선다</b> — 리더 보너스가 붙는다.<br>
      슬롯을 누르면 내린다. 순서를 바꾸려면 내렸다가 다시 모신다.</p>

    <div class="slots">${slots}</div>

    <div class="card">
      <div class="lbl">
        <span>신력 神力</span>
        <span style="color:${over?"var(--jeok)":"var(--hwang)"}"><b>${cost}</b> / ${cap}</span>
      </div>
      <div class="bar pg"><i style="width:${Math.min(100,cost/cap*100)}%;background:${over?"var(--jeok)":"var(--hwang)"}"></i></div>
      <div style="font-size:11px;color:var(--dim);margin-top:7px;line-height:1.6">
        ${PICK.length}위 · ${lead ? `<b style="color:var(--hwang)">${esc(lead.name)}</b>이 앞장선다 — ${esc(lead.leader_effect?.text ?? lead.leader_bonus ?? "리더 효과 없음")}` : "아직 아무도 없다"}
        ${over?'<br><span style="color:var(--jeok)">상한을 넘었다. 한 위를 내려야 한다.</span>':""}
      </div>
      <button class="btn" style="margin-top:11px" ${(!PICK.length||over)?"disabled":""} onclick="saveParty()">
        이 사람들로 간다
      </button>
    </div>

    <div id="dangErr"></div>
    <div class="grid">${ME.cards.map(pc=>mini(pc,{sel:PICK.includes(pc.id)})).join("")}</div>`;

  $("#p-dang").querySelectorAll(".grid .mini").forEach(el=>{
    el.onclick = ()=>{
      const id = +el.dataset.id;
      const i = PICK.indexOf(id);
      if (i>=0) PICK.splice(i,1);
      else if (PICK.length < 5) PICK.push(id);
      dang();
    };
  });
}
function drop(id){ const i = PICK.indexOf(id); if(i>=0) PICK.splice(i,1); dang(); }

  try{

  }catch(e){ $("#dangErr").innerHTML = fail(e); }
}

        ${d.kind==="특별" ? `입장권 ${tk[d.id]??0}` : `향 ${d.hyang_cost}`} · 10걸음</div>
      <div class="desc">${esc(LOOK[d.id] ?? "")}</div>
      <div id="gateErr" class="err"></div>
      <div class="ways">
        <button onclick="gatePrev()" ${i<=0?"disabled":""} style="flex:.8">‹ 이전</button>
        <button class="go" ${lock?"disabled":""} onclick="gateEnter()">
          ${lock?`격 ${d.level_req}가 되어야 든다`:"든 다"}</button>
        <button class="nx" onclick="gateNext()" ${i>=M.dungeons.length-1?"disabled":""}
          style="flex:.8">다음 ›</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;align-items:center">
        <button onclick="gateClose()" style="flex:1;padding:10px 0;font-family:var(--serif);
          font-size:12px;letter-spacing:.14em;border:1px solid var(--line);
          background:rgba(16,13,9,.9);color:var(--dim)">지 도 로</button>
        <span style="font-family:var(--serif);font-size:10.5px;color:var(--dim);
          letter-spacing:.12em;padding:0 8px">${i+1} / ${M.dungeons.length}</span>
      </div>
    </div>`;
  setTimeout(()=>$("#gate").classList.add("on"), 380);
  const g = $("#gate");
  if(!g.dataset.sw){ g.dataset.sw="1"; swipe(g, gatePrev, gateNext); }
}
function gateNext(){ if(GATE_I < M.dungeons.length-1) gateSlide(GATE_I+1,  1); }
function gatePrev(){ if(GATE_I > 0)                        gateSlide(GATE_I-1, -1); }
function gateSlide(i, dir){
  openGate(i);
  slide($("#gate .bd"), dir);
  const a = $("#gate .art");
  if(a){ a.style.transition="none"; a.style.opacity="0";
    requestAnimationFrame(()=>{ a.style.transition="opacity .45s"; a.style.opacity="1"; }); }
}
function gateClose(){
  $("#gate").classList.remove("on");
  setTimeout(()=>{
    $("#gilMap").classList.remove("on");
    $("#mapg").style.transform = "";
  }, 320);
}
async function gateEnter(){
  const d = M.dungeons[GATE_I];
  const b = $("#gate").querySelector(".go");
  b.disabled = true; b.textContent = "…";
  try{
    const r = await api("/explore/start", { dungeon_id:d.id, slot_no:1 });
    $("#gate").classList.remove("on");
    $("#gilMap").classList.remove("on");
    $("#mapg").style.transform = "";
    await refresh();                       // 먼저 동기화하고
    SESS = { id:r.session.id, dungeon:r.dungeon.name, dun:r.dungeon,
             step:0, of:r.steps, bujeong:0, hp:r.session.hp_state,
             ritual:!r.dungeon.combat, knots:[] };   // 그 다음에 세션을 세운다
    dungeonRun();
  }catch(e){
    b.disabled = false; b.textContent = "든 다";
    // 켜둔 채 껐다 오면 서버에 안 끝난 탐험이 남아 입장이 거부된다.
    // 막다른 에러 대신 반드시 "이어하기/포기" 선택지를 준다.
    if (isInProgress(e)) return recoverStuck("gateErr");
    $("#gateErr").innerHTML = fail(e);
  }
}
async function enter(id){
  try{
    const d = await api("/explore/start", { dungeon_id:id, slot_no:1 });
    await refresh();                       // 먼저 동기화하고
    SESS = { id:d.session.id, dungeon:d.dungeon.name, dun:d.dungeon,
             step:0, of:d.steps, bujeong:0, hp:d.session.hp_state,
             ritual:!d.dungeon.combat, knots:[] };   // 그 다음에 세션을 세운다
    dungeonRun();
  }catch(e){
    // 게임을 켜둔 채 껐다가 오면 서버에 안 끝난 탐험이 남아 /explore/start 가 거부된다.
    // 막다른 빨간 에러로 두면 빠져나갈 길이 없다 → 반드시 "이어하기/포기" 선택지를 준다.
    if (isInProgress(e)) return recoverStuck();
    const el=$("#gilErr"); if(el) el.innerHTML = fail(e);
  }
}

/* 서버가 "진행 중인 탐험이 있다"고 거부하는 모든 형태를 폭넓게 잡는다.
   (error 코드 / message / why / 한국어 문구 어느 쪽으로 와도 걸린다) */
function isInProgress(e){
  const s = `${e?.error??""} ${e?.message??""} ${e?.why??""} ${e?.detail??""}`;
  return /IN[_\s-]?PROGRESS|진행\s*중|끝내지\s*않은|이미.*탐험|active.*session/i.test(s);
}

/* 안 끝난 탐험 복구 — 어떤 경우든 갇히지 않게 한다.
   ① 서버 세션을 SESS 로 당겨와 이어하거나 포기하게 하고
   ② /player 엔 안 잡히는 유령 세션이면 강제로 정리한다.
   errId: 어느 에러 칸에 안내를 넣을지 (던전 지도=gateErr, 목록=gilErr). */
async function recoverStuck(errId){
  await refresh();                         // 서버의 active 탐험을 SESS 로 당겨온다
  const el = $("#"+(errId||"gilErr"));
  if (SESS){
    if (el) el.innerHTML =
      `<div class="err" style="border-color:var(--hwang)">
         <b>안 끝난 탐험이 있다</b>${esc(SESS.dungeon)} · ${SESS.step}/${SESS.of} 걸음이 남았다.
         <div style="display:flex;gap:8px;margin-top:10px">
           <button class="btn" style="flex:1" onclick="resumeRun()">이어한다</button>
           <button class="btn ghost" style="flex:1" onclick="abandonRun()">포기하고 나간다</button>
         </div></div>`;
    return;
  }
  // 서버는 "진행 중"이라는데 정작 세션이 안 잡히는 유령 상태 → 강제 정리 후 재시도 가능
  try{ await api("/explore/leave", {}); }catch(_){}
  SESS = null; await refresh();
  if (el) el.innerHTML =
    `<div class="err" style="border-color:var(--hwang)"><b>남아 있던 탐험을 정리했다</b>이제 다시 들어갈 수 있다.</div>`;
}

/* 던전 지도/입구 오버레이를 닫는다 (복구 후 실제 탐험 화면이 보이게) */

/* 탐험 포기 — DOM 에 의존하지 않고 확실히 세션을 비우고 목록으로 돌려보낸다 */
async function abandonRun(){
  try{ await api("/explore/leave", {}); }catch(_){}
  SESS = null; closeGateOverlay(); await refresh(); go("gil");
}

/* ══ 던전 — 전투 연출 ═════════════════════════════
   서버가 로그를 통째로 내려준다. 클라이언트는 계산하지 않는다.
   연출은 순수한 재생 문제다. 그래서 빨리감기·스킵이 공짜다. */
const BROLE = { "탱커":{hp:1.05}, "밸런스":{hp:0.82}, "암살자":{hp:0.74} };
let BS = null;    // 전투 상태

/* 적의 체력을 서버가 안 보낸다. 엔진과 같은 공식으로 여기서 낸다.
   tier·역할·던전 격·보스 배율이 다 있으므로 정확히 나온다. */
function foeMax(e, dun, step){
  const t = M.tiers.find(x=>x.tier===e.tier);
  const c = mc(e.card_id) ?? mcName(e.name);
  if(!t || !c) return 1;
  const r = BROLE[c.role] ?? BROLE["밸런스"];
  const seq = dun.boss_seq ?? null;
  const k = seq ? (seq[Math.min(step, seq.length)-1]?.mult ?? 1)
                : (e.boss ? 1.45 : 1);
  return Math.max(1, Math.round(t.hp * r.hp * (1 + (dun.level_req ?? 1) * 0.008) * k * 0.78));
}

/* ══ 2.5D 시차 ═══════════════════════════════════
   진짜 3D 메시는 이 그림들로 안 나온다. 우리 신들은 연기와 재로 되어 있어
   윤곽이 흩어진다. 넣으면 연기로 된 신이 플라스틱 인형이 된다.
   대신 밝기에서 깊이를 뽑아 시차를 준다. 형체가 살짝 떠오른다.
   WebGL 이 없으면 조용히 원래 그림으로 돌아간다 — 옛 폰에서 안 깨진다. */
const PX = (()=>{
  const VS = `attribute vec2 a;varying vec2 v;
    void main(){v=a*0.5+0.5;v.y=1.0-v.y;gl_Position=vec4(a,0.,1.);}`;
  const FS = `precision mediump float;varying vec2 v;
    uniform sampler2D t,d;uniform vec2 off,cover,focus;uniform float amp,fal;
    void main(){
      /* 비율 유지(cover) + 기준점(focus). 카드 그림은 얼굴이 위에 있으므로
         가운데가 아니라 위쪽을 잡는다 — CSS object-position 과 같은 규칙. */
      vec2 vc = v*cover + focus*(1.0-cover);
      float z = texture2D(d, vc).r;
      vec2 e = abs(v-0.5)*2.0;
      float edge = 1.0 - smoothstep(1.0-fal, 1.0, max(e.x,e.y));   // 가장자리는 안 찢는다
      vec2 uv = vc + off * (z - 0.35) * amp * edge;
      vec4 c = texture2D(t, uv);
      c.rgb *= 0.92 + z*0.16;                                       // 앞이 조금 더 밝다
      gl_FragColor = c;
    }`;

  /* 캔버스 비율과 그림 비율이 다르면 늘어난다. object-fit:cover 처럼
     짧은 쪽을 채우고 넘치는 쪽만 잘라내는 배율을 낸다. */
  function coverVec(cw, ch, iw, ih){
    if(!iw || !ih || !cw || !ch) return [1,1];
    const r = (iw/ih) / (cw/ch);
    return r > 1 ? [1/r, 1] : [1, r];
  }

  let live = [];            // 살아 있는 컨텍스트. 둘 넘게 안 연다.

  function depthOf(img){
    const W=160, H=214;
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    const x=c.getContext("2d",{willReadFrequently:true});
    x.drawImage(img,0,0,W,H);
    const p=x.getImageData(0,0,W,H).data;
    const L=new Float32Array(W*H), M=new Float32Array(W*H);
    for(let i=0;i<W*H;i++){
      const l=(p[i*4]*0.2126 + p[i*4+1]*0.7152 + p[i*4+2]*0.0722)/255;
      L[i]=l; M[i]=Math.min(1,Math.max(0,(l-0.012)/0.06));
    }
    const blur=(src,r)=>{
      const a=new Float32Array(W*H), b=new Float32Array(W*H);
      for(let y=0;y<H;y++) for(let X=0;X<W;X++){ let s=0,n=0;
        for(let k=-r;k<=r;k++){ const xx=X+k; if(xx<0||xx>=W) continue; s+=src[y*W+xx]; n++; }
        a[y*W+X]=s/n; }
      for(let y=0;y<H;y++) for(let X=0;X<W;X++){ let s=0,n=0;
        for(let k=-r;k<=r;k++){ const yy=y+k; if(yy<0||yy>=H) continue; s+=a[yy*W+X]; n++; }
        b[y*W+X]=s/n; }
      return b;
    };
    const Lb=blur(L,6), Mb=blur(M,3);
    const out=x.createImageData(W,H), q=out.data;
    for(let y=0;y<H;y++) for(let X=0;X<W;X++){
      const i=y*W+X;
      const nx=(X/W-0.50)/0.62, ny=(y/H-0.42)/0.70;
      const r=Math.sqrt(nx*nx+ny*ny);
      const center=Math.min(1,Math.max(0,1-r*0.55));
      let z=(Math.pow(Lb[i],0.6)*0.72 + center*0.28) * Mb[i];
      const val=Math.min(1,Math.max(0,z))*255;
      q[i*4]=q[i*4+1]=q[i*4+2]=val; q[i*4+3]=255;
    }
    x.putImageData(out,0,0);
    return c;
  }

  function mount(host, url, opt={}){
    if(!host || !url) return false;
    let gl;
    const cv = document.createElement("canvas");
    cv.className = "px";
    try{ gl = cv.getContext("webgl",{alpha:false,antialias:false,depth:false}); }catch(_){}
    if(!gl) return false;                      // WebGL 이 없으면 원래 그림 그대로

    const img = new Image(); img.crossOrigin = "anonymous";
    const st = { gl, cv, host, raf:0, dead:false, ox:0, oy:0, tx:0, ty:0,
                 amp:(opt.amp ?? 14)/1000, fal:(opt.fal ?? 0.55),
                 mode:opt.mode ?? "auto", focus:opt.focus ?? [0.5,0.18],
                 t0:performance.now() };

    img.onerror = ()=> unmount(st);
    img.onload = ()=>{
      if(st.dead) return;
      const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o;};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
      gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ unmount(st); return; }
      gl.useProgram(pr);
      const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const a=gl.getAttribLocation(pr,"a");
      gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
      const uT=gl.getUniformLocation(pr,"t"), uD=gl.getUniformLocation(pr,"d"),
            uOff=gl.getUniformLocation(pr,"off"), uAmp=gl.getUniformLocation(pr,"amp"),
            uFal=gl.getUniformLocation(pr,"fal"), uCover=gl.getUniformLocation(pr,"cover"),
            uFocus=gl.getUniformLocation(pr,"focus");
      const mk=(src)=>{ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); return t; };
      const tex = mk(img), dep = mk(depthOf(img));

      host.appendChild(cv);
      host.querySelectorAll("img").forEach(e=>e.classList.add("px-off"));

      const size=()=>{ const r=cv.getBoundingClientRect();
        const dpr=Math.min(1.75, window.devicePixelRatio||1);
        cv.width=Math.max(2,r.width*dpr); cv.height=Math.max(2,r.height*dpr);
        st.cover = coverVec(cv.width, cv.height, img.naturalWidth, img.naturalHeight);
        gl.viewport(0,0,cv.width,cv.height); };
      size();
      st.size = size;
      window.addEventListener("resize", size);

      const tick=()=>{
        if(st.dead) return;
        const t=(performance.now()-st.t0)/1000;
        if(st.mode==="auto"){
          st.tx = Math.sin(t*0.38)*0.55 + Math.sin(t*0.16)*0.18;
          st.ty = Math.sin(t*0.28)*0.28;
        }
        st.ox += (st.tx-st.ox)*0.07;
        st.oy += (st.ty-st.oy)*0.07;
        gl.useProgram(pr);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(uT,0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,dep); gl.uniform1i(uD,1);
        gl.uniform2f(uOff, st.ox, st.oy);
        gl.uniform2f(uCover, (st.cover||[1,1])[0], (st.cover||[1,1])[1]);
        gl.uniform2f(uFocus, (st.focus||[.5,.18])[0], (st.focus||[.5,.18])[1]);
        gl.uniform1f(uAmp, st.amp);
        gl.uniform1f(uFal, st.fal);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
        st.raf = requestAnimationFrame(tick);
      };
      tick();

      // 손가락으로 기울인다
      if(st.mode==="tilt"){
        const pt=e=>{
          const p=e.touches?e.touches[0]:e;
          const r=host.getBoundingClientRect();
          st.tx = ((p.clientX-r.left)/r.width - 0.5)*2;
          st.ty = ((p.clientY-r.top)/r.height - 0.5)*2;
        };
        st.pt = pt;
        host.addEventListener("touchmove", pt, {passive:true});
        host.addEventListener("mousemove", pt);
        st.leave = ()=>{ st.tx=0; st.ty=0; };
        host.addEventListener("touchend", st.leave, {passive:true});
        host.addEventListener("mouseleave", st.leave);
      }
    };
    img.src = url;

    live.push(st);
    while(live.length > 2) unmount(live[0]);    // 둘 넘게 안 연다
    return true;
  }

  function unmount(st){
    if(!st || st.dead) return;
    st.dead = true;
    cancelAnimationFrame(st.raf);
    if(st.size) window.removeEventListener("resize", st.size);
    if(st.pt && st.host){ st.host.removeEventListener("touchmove", st.pt);
      st.host.removeEventListener("mousemove", st.pt);
      st.host.removeEventListener("touchend", st.leave);
      st.host.removeEventListener("mouseleave", st.leave); }
    try{ st.gl.getExtension("WEBGL_lose_context")?.loseContext(); }catch(_){}
    st.cv.remove();
    st.host?.querySelectorAll("img").forEach(e=>e.classList.remove("px-off"));
    live = live.filter(x=>x!==st);
  }
  function clear(){ [...live].forEach(unmount); }
  return { mount, clear };
})();

let ENT_R = null;   // 등장씬이 끝나면 이 판을 재생한다

function haloSvg(g, col){
  if(!g.rings) return "";
  const R=[46,37,28], out=[];
  for(let i=0;i<g.rings;i++){
    const r=R[i], L=2*Math.PI*r;
    out.push(`<circle class="${i===0?"gw":""}" cx="50" cy="50" r="${r}"
      style="--L:${L.toFixed(1)};--d:${(g.d*0.55+i*0.35).toFixed(2)}s;stroke-width:${i===0?.9:.6}"/>`);
  }
  if(g.spokes) for(let k=0;k<12;k++){
    const a=k*30*Math.PI/180;
    const x1=(50+Math.cos(a)*47).toFixed(1), y1=(50+Math.sin(a)*47).toFixed(1);
    const x2=(50+Math.cos(a)*52).toFixed(1), y2=(50+Math.sin(a)*52).toFixed(1);
    out.push(`<path d="M${x1} ${y1} L${x2} ${y2}"
      style="--L:6;--d:${(g.d*0.8+k*0.03).toFixed(2)}s;stroke-width:.8"/>`);
  }
  if(g.sanskrit) for(let k=0;k<8;k++){   // 범자(梵字) 자리 — 대신에게만
    const a=k*45*Math.PI/180;
    const x=(50+Math.cos(a)*46).toFixed(1), y=(50+Math.sin(a)*46).toFixed(1);
    out.push(`<circle class="gw" cx="${x}" cy="${y}" r="1.6"
      style="--L:10;--d:${(g.d*0.9+k*0.05).toFixed(2)}s;stroke-width:1.2"/>`);
  }
  return `<svg class="halo" viewBox="0 0 100 100" style="color:${col}">${out.join("")}</svg>`;
}

/* ── 재생 ── */
function playBattle(r){
  const dun = SESS.dun, step = r.step;
  // 유닛 상태를 세운다. 로그는 이름으로 말하므로 이름 → 유닛.
  BS = { by:{}, log:r.battle.log, i:0, ff:null, sp:1, res:r };
  BS.beat = beatMs(BS.log);          // 이번 판 로그 길이에 맞춰 평타 박자를 정한다

  // 적
  $("#foes").innerHTML = r.enemies.map((e,i)=>{
    /* 서버가 card_id 를 실어주면 그걸 쓰고, 아직 아니면 이름으로 찾는다. 배포 전후 둘 다 돈다. */
    const c = mc(e.card_id) ?? mcName(e.name) ?? GHOST(e.name);
    const max = foeMax(e, dun, step);
    const src = artOf(c);
    BS.by[e.name] = { hp:max, max, sh:0, st:[], fac:e.faction, sel:`[data-e="${i}"]` };
    return `<div class="bu ${e.boss?"":""}" data-e="${i}" data-n="${esc(e.name)}">
      <span class="bd2 f-${e.faction}"></span>
      ${src?`<img src="${src}" loading="lazy" alt="">`:""}
      <div class="lit"></div><div class="stg"></div>
      <div class="bn2">${esc(e.name)}</div>
      <div class="hb"><i style="width:100%"></i></div>
      <div class="sb"></div></div>`;
  }).join("");

  // 우리 편 — 전투 시작 시점의 체력으로 되돌린다 (로그가 다시 깎는다)
  const before = new Map((SESS.hpBefore ?? SESS.hp).map(h=>[String(h.uid), h]));
  $("#usr").querySelectorAll(".bu").forEach(el=>{
    const n = el.dataset.n, uid = el.dataset.u;
    const h = before.get(String(uid));
    const pc = ME.cards.find(c=>String(c.id)===String(uid));
    const mx = h?.maxhp ?? 1;
    BS.by[n] = { hp:h?.hp ?? mx, max:mx, sh:0, st:[],
                 fac:(pc ? mc(pc.card_id) : null)?.faction ?? mcName(n)?.faction,
                 sel:`[data-u="${uid}"]` };
    el.classList.toggle("gone", !(h?.alive ?? true));
  });

  $("#blog").innerHTML = "";
  $("#battle").innerHTML = "";
  bbell(false); btide();            // 저울은 수평에서, 무령은 조용히 시작한다
  $("#ffBtn").disabled = false; $("#skBtn").disabled = false;
  const b=$("#stepBtn"); b.disabled = true; b.textContent = "…";
  BS.timer = setTimeout(tick, 260);
}

/* 연출이 있는 박자는 제 시간을 지킨다. 나머지 평타는 로그 길이에 맞춰 줄인다.
   서버 전투는 로그가 100줄을 훌쩍 넘길 때가 있는데(실측 134줄),
   한 줄에 520ms 를 쓰면 한 걸음에 70초가 걸린다. 그건 전투가 아니라 기다림이다. */
const BDUR = { unique:1500, rage:900, execute:800, down:600, summon:750, end:420 };
const BEAT_BUDGET = 16000;   // 평타에 쓰는 총 시간 목표(ms)
const BEAT_MAX = 520, BEAT_MIN = 110;
function beatMs(log){
  const plain = log.reduce((n,l)=> n + (BDUR[l.op] ? 0 : 1), 0);
  if(plain <= 0) return BEAT_MAX;
  return Math.max(BEAT_MIN, Math.min(BEAT_MAX, Math.round(BEAT_BUDGET / plain)));
}
function tick(){
  if(!BS) return;
  if(BS.i >= BS.log.length) return endBattle();
  const l = BS.log[BS.i++];
  beat(l);
  if(l.op === "end") return;   // endBattle 은 beat 안에서 잡는다
  const d = (BDUR[l.op] ?? BS.beat ?? BEAT_MAX) / BS.sp;
  BS.timer = setTimeout(tick, d);
}
function toggleFF(){
  if(!BS) return;
  const b=$("#ffBtn");
  if(BS.sp > 1){ BS.sp = 1; b.classList.remove("on"); b.textContent="빨 리"; }
  else { BS.sp = 4; b.classList.add("on"); b.textContent="× 4"; }
}
function skipLog(){
  if(!BS) return;
  clearTimeout(BS.timer);
  while(BS.i < BS.log.length){
    const l = BS.log[BS.i++];
    if(l.op === "end"){ beat(l); return; }
    quiet(l);
  }
  endBattle();
}
/* 연출 없이 상태만 반영 */
function quiet(l){
  const t = l.target ? BS.by[l.target] : null;
  if(!t) return;
  if(l.op==="dmg"||l.op==="counter"||l.op==="dot_tick"){ t.hp=Math.max(0,t.hp-(l.val??0)); }
  if(l.op==="heal"||l.op==="regen_tick"){ t.hp=Math.min(t.max,t.hp+(l.val??0)); }
  if(l.op==="shield"){ t.sh=(t.sh??0)+(l.val??0); }
  if(l.op==="down"||l.op==="execute"){ t.hp=0; }
  if(l.op==="revive"){ t.hp=Math.max(1,Math.round(t.max*0.35)); }
  paint(l.target);
}

const bel = n => { const u=BS?.by[n]; return u ? $("#stage").querySelector(u.sel) : null; };
function paint(n){
  const u = BS.by[n], e = bel(n); if(!u||!e) return;
  e.querySelector(".hb i").style.width = Math.max(0, u.hp/u.max*100) + "%";
  e.querySelector(".sb").style.width = Math.min(100, (u.sh??0)/u.max*100) + "%";
  e.classList.toggle("gone", u.hp <= 0);
  e.querySelector(".stg").innerHTML = (u.st??[]).map(x=>{
    const cls = {"봉":"#9C8FB5","굳":"#8FC0E3","반":"#C8A24B","표":"#E08A80","벽":"#B5A88F"}[x] ?? "#8B8275";
    return `<span style="border-color:${cls};color:${cls}">${x}</span>`;
  }).join("");
  btide();          // 체력이 움직였으니 저울도 기운다
}
function bfly(e, txt, color, big){
  const st=$("#stage"), r=e.getBoundingClientRect(), p=st.getBoundingClientRect();
  const d=document.createElement("div"); d.className="fly"+(big?" hv":"");
  d.style.cssText=`left:${r.left-p.left+r.width*.1}px;top:${r.top-p.top+8}px;
    font-size:${big?22:15}px;color:${color};text-shadow:0 0 12px rgba(0,0,0,.9)`;
  d.textContent=txt; st.appendChild(d);
  setTimeout(()=>d.remove(), 1000/(BS?.sp??1));
}

/* 역경직 — 급소가 들어간 순간 판을 굳혔다가 놓는다. 굳는 시간이 곧 무게다.
   빨리감기 중에는 걸지 않는다(재생이 끈적해진다). */
function bfreeze(ms=150){
  if((BS?.sp ?? 1) > 1) return;
  const st=$("#stage"); if(!st) return;
  clearTimeout(bfreeze._t);
  st.classList.add("frz");
  bfreeze._t = setTimeout(()=>{ st.classList.remove("frz"); bshake(); }, ms);
}

/* 검풍 — 치는 쪽 카드에서 맞는 쪽 카드로 한 획을 긋는다.
   두 카드의 중심을 이어 각도·길이를 낸다. 한쪽이 없으면 긋지 않는다. */
function bsword(A, B, crit){
  if(!A || !B) return;
  const st=$("#stage"); if(!st) return;
  const p=st.getBoundingClientRect(), a=A.getBoundingClientRect(), b=B.getBoundingClientRect();
  const x1=a.left-p.left+a.width/2, y1=a.top-p.top+a.height/2;
  const x2=b.left-p.left+b.width/2, y2=b.top-p.top+b.height/2;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(!isFinite(len) || len < 8) return;
  const d=document.createElement("div");
  d.className="swd"+(crit?" c":"");
  d.style.cssText=`left:${x1}px;top:${y1}px;width:${len}px;
    transform:rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
  st.appendChild(d);
  setTimeout(()=>d.remove(), 300/(BS?.sp??1));
}
/* 예보 한 마디 — 빨리감기 중에는 띄우지 않는다(글자가 겹쳐 방해된다) */
function bomen(cls, big, sub){
  if((BS?.sp ?? 1) > 1) return;
  const el=$("#clash"); if(!el) return;
  el.className = cls; el.innerHTML = `${big}<span class="h">${sub}</span>`;
  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
}
/* 합(合) — 치는 쪽과 맞는 쪽의 세력이 맞물리는지 본다.
   서버가 주는 값이 아니라 이 게임의 상성 규칙에서 낸다(BEATS). 맞물리지 않으면 말하지 않는다.
   ★ 기준은 '치는 쪽'이 아니라 '우리'다 — 적이 유리하게 치는 판은 흉망이어야 읽힌다. */
function bclash(actor, target){
  const a = BS?.by[actor], t = BS?.by[target];
  if(!a || !t || !a.fac || !t.fac) return;
  const adv = BEATS[a.fac] === t.fac ? 1 : (BEATS[t.fac] === a.fac ? -1 : 0);
  if(!adv) return;                                   // 맞물리지 않으면 침묵
  const ours = String(a.sel ?? "").startsWith("[data-u");   // 치는 쪽이 우리 편인가
  const good = ours ? adv > 0 : adv < 0;
  bomen(good ? "y" : "j", good ? "영 험" : "흉 망", good ? "靈 驗" : "凶 亡");
}
/* 부적이 찢겨 날린다 — 급소가 들어간 자리에서 사방으로 */
function bbujeok(e, n){
  const st=$("#stage"); if(!st || !e) return;
  if((BS?.sp ?? 1) > 1) return;
  const r=e.getBoundingClientRect(), p=st.getBoundingClientRect();
  const cx=r.left-p.left+r.width/2, cy=r.top-p.top+r.height/2;
  for(let i=0;i<n;i++){
    const a=(-90 + (Math.random()-.5)*130) * Math.PI/180, d=38 + Math.random()*48;
    const x=document.createElement("div"); x.className="bjk"; x.textContent="急急";
    x.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;
      --rot:${Math.round((Math.random()-.5)*80)}deg`;
    st.appendChild(x);
    setTimeout(()=>x.remove(), 660);
  }
}

/* 놋저울 — 양쪽이 성한 정도를 견준다. 서버가 주는 값이 아니라 지금 판의 체력에서 낸다.
   우리가 성하면 우리 쪽으로 기운다. */
function btide(){
  const s=$("#nsc"); if(!s || !BS?.by) return;
  let us=0, um=0, fo=0, fm=0;
  for(const k in BS.by){
    const u=BS.by[k]; if(!u || !u.max) continue;
    if(String(u.sel ?? "").startsWith("[data-u")){ us+=Math.max(0,u.hp); um+=u.max; }
    else { fo+=Math.max(0,u.hp); fm+=u.max; }
  }
  const a=(um?us/um:0)-(fm?fo/fm:0);
  s.style.transform=`rotate(${(a*13).toFixed(2)}deg)`;
}
/* 무령 — 신벌이 오면 저 혼자 운다 */
function bbell(on){
  const b=$("#mury"); if(!b) return;
  b.classList.toggle("on", !!on);
  if(on){ clearTimeout(bbell._t); bbell._t=setTimeout(()=>b.classList.remove("on"), 1600); }
}

function bflash(bg){ const f=$("#flash"); f.style.background=bg;
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
function bshake(){ const p=$("#stage"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); }
function bline(html){ const L=$("#blog"); const d=document.createElement("div"); d.innerHTML=html;
  L.appendChild(d); while(L.children.length>3) L.removeChild(L.firstChild); }
function addSt(n, tag){ const u=BS.by[n]; if(!u) return; u.st=[...new Set([...(u.st??[]),tag])]; paint(n); }

function beat(l){
  const T = 1/(BS?.sp ?? 1);
  const A = l.actor ? bel(l.actor) : null;
  const B = l.target ? bel(l.target) : null;

  if(A && ["dmg","heal","unique","seal","stun","execute","summon","mark","shield","counter","drain","dispel","barrier"].includes(l.op)){
    $("#stage").querySelectorAll(".bu.act").forEach(e=>e.classList.remove("act"));
    A.classList.add("act");
    setTimeout(()=>A.classList.remove("act"), 620*T);
  }

  switch(l.op){
    case "unique": {
      const m = /【(.+?)】\s*(.*)/.exec(l.text ?? "");
      const u=$("#uniq");
      u.innerHTML = `<div><div class="who">${esc(l.actor??"").split("").join(" ")}</div>
        <div class="un">【${esc(m?.[1] ?? "")}】</div><div class="ur"></div>
        <div class="ut">${esc(m?.[2] ?? "")}</div></div>`;
      u.classList.remove("on"); void u.offsetWidth; u.classList.add("on");
      bline(`<span class="u2">【${esc(m?.[1]??"")}】</span> <span class="a">${esc(l.actor??"")}</span>`);
      break;
    }
    case "dmg": case "drain": {
      if(!B){ bline(esc(l.text)); break; }
      const t=BS.by[l.target]; let v=l.val ?? 0;
      if(t.sh>0){ const a=Math.min(t.sh,v); t.sh-=a; v-=a; if(a>0) bfly(B,`−${a.toLocaleString()}`,"#8FC0E3",false); }
      t.hp=Math.max(0,t.hp-v);
      bclash(l.actor, l.target);   // 상성이 맞물리면 한 마디 예보한다
      bsword(A, B, !!l.crit);          // 치는 쪽 → 맞는 쪽으로 한 획
      B.classList.remove("hit"); void B.offsetWidth; B.classList.add("hit");
      const lt=B.querySelector(".lit"); lt.classList.remove("on"); void lt.offsetWidth; lt.classList.add("on");
      if(v>0) bfly(B, v.toLocaleString()+(l.crit?" 치명!":""), l.crit?"#F4C9C4":"#EDE7DA", !!l.crit);
      if(l.crit){ bflash("radial-gradient(circle at 50% 45%, rgba(255,255,255,.9), transparent 60%)"); bfreeze(150); bbujeok(B,4); }
      paint(l.target);
      bline(`<span class="a">${esc(l.actor??"")}</span> → ${esc(l.target)}
        <span class="${l.crit?"c":""}">${(l.val??0).toLocaleString()}${l.crit?" 치명!":""}</span>`);
      break;
    }
    case "counter": {
      if(!B) break;
      const t=BS.by[l.target]; t.hp=Math.max(0,t.hp-(l.val??0)); paint(l.target);
      bsword(A, B, false);
      B.classList.remove("hit"); void B.offsetWidth; B.classList.add("hit");
      bfly(B,(l.val??0).toLocaleString(),"#E3C888",false);
      bline(`<span class="u2">${esc(l.actor??"")}</span>이 되돌린다 → ${esc(l.target)}
        <span class="c">${(l.val??0).toLocaleString()}</span>`); break;
    }
    case "reflect": case "counter_on":
      if(l.target) addSt(l.target,"반");
      bline(`<span class="u2">${esc(l.text)}</span>`); break;

    case "heal": case "regen_tick": {
      if(!B){ bline(`<span class="h">${esc(l.text)}</span>`); break; }
      const t=BS.by[l.target]; t.hp=Math.min(t.max,t.hp+(l.val??0)); paint(l.target);
      bfly(B,"+"+(l.val??0).toLocaleString(),"#8FC0E3",false);
      B.style.filter="brightness(1.35) saturate(1.2)";
      setTimeout(()=>B.style.filter="", 340*T);
      bline(`<span class="h">${esc(l.text)}</span>`); break;
    }
    case "shield": {
      if(!B) break;
      const t=BS.by[l.target]; t.sh=(t.sh??0)+(l.val??0); paint(l.target);
      bfly(B,"◈ "+(l.val??0).toLocaleString(),"#8FC0E3",false);
      bline(`<span class="h">${esc(l.text)}</span>`); break;
    }
    case "rage": {
      if(A) A.classList.add("rage");
      bomen("j", "신 벌", "神 罰"); bbell(true);
      bflash("radial-gradient(circle at 50% 38%, rgba(184,53,46,.85), transparent 68%)"); bshake();
      // 격노한 보스는 두 번째 말을 한다. 그 말도 고증에서 나왔다.
      const say = (SAY[l.actor] ?? [])[1];
      if(say){
        let n = $("#ragel");
        if(!n){ n=document.createElement("div"); n.id="ragel"; $("#stage").appendChild(n); }
        n.innerHTML = `「${say}」`;
        n.classList.remove("on"); void n.offsetWidth; n.classList.add("on");
      }
      bline(`<span class="r">${esc(l.text)}</span>`); break;
    }
    case "seal": case "stun": case "mark": case "barrier": {
      if(!B) break;
      const tag={seal:"봉",stun:"굳",mark:"표",barrier:"벽"}[l.op];
      addSt(l.target, tag);
      bfly(B, tag, {seal:"#9C8FB5",stun:"#8FC0E3",mark:"#E08A80",barrier:"#B5A88F"}[l.op], false);
      bline(`<span class="a">${esc(l.text)}</span>`); break;
    }
    case "execute": {
      if(!B) break;
      const t=BS.by[l.target]; t.hp=0; paint(l.target);
      bsword(A, B, true);
      bflash("linear-gradient(transparent 44%, rgba(184,53,46,.9) 48%, transparent 52%)");
      bfreeze(230);                    // 명줄이 끊기는 순간이 가장 무겁다
      bbujeok(B,7);
      bfly(B,"명줄","#E08A80",true);
      bline(`<span class="c">${esc(l.text)}</span>`); break;
    }
    case "revive": {
      if(!B) break;
      const t=BS.by[l.target]; t.hp=Math.max(1,Math.round(t.max*0.35)); t.st=[]; paint(l.target);
      B.classList.remove("gone");
      bfly(B,"넋","#8FC0E3",true);
      bflash("radial-gradient(circle at 50% 72%, rgba(143,192,227,.5), transparent 70%)");
      bline(`<span class="h">${esc(l.text)}</span>`); break;
    }
    case "summon": {
      const nm = l.target ?? "시자";
      const src = mc(BS.res.enemies[0]?.card_id);
      BS.by[nm] = { hp:1, max:1, sh:0, st:[], sel:`[data-n="${nm}"]` };
      const d=document.createElement("div");
      d.className="bu tmp"; d.dataset.n=nm;
      d.innerHTML = `<span class="bd2 f-저승"></span>
        ${src&&artOf(src)?`<img src="${artOf(src)}" alt="">`:""}
        <div class="lit"></div><div class="stg"></div>
        <div class="bn2">${esc(nm)}</div>
        <div class="hb"><i style="width:100%"></i></div><div class="sb"></div>`;
      d.style.opacity="0"; d.style.transform="translateY(14px) scale(.85)";
      $("#foes").appendChild(d);
      requestAnimationFrame(()=>{ d.style.transition="all .45s cubic-bezier(.2,1.3,.4,1)";
        d.style.opacity=".85"; d.style.transform="none"; });
      bline(`<span class="a">${esc(l.text)}</span>`); break;
    }
    case "stat": case "stack":
      if((l.val??0) > 0) bflash("radial-gradient(circle at 50% 78%, rgba(200,162,75,.45), transparent 70%)");
      bline(`<span class="u2">${esc(l.text)}</span>`); break;

    case "down": {
      if(!B) break;
      const t=BS.by[l.target]; t.hp=0; t.st=[]; paint(l.target);
      B.classList.add("gone");
      bline(`<span style="color:#6E6455">${esc(l.text)}</span>`); break;
    }
    case "dot_tick": {
      if(!B) break;
      const t=BS.by[l.target]; t.hp=Math.max(0,t.hp-(l.val??0)); paint(l.target);
      bfly(B, (l.val??0).toLocaleString(), "#C88A5A", false);
      bline(`<span style="color:#C88A5A">${esc(l.text)}</span>`); break;
    }
    case "end":
      bline(`<span class="u2">${esc(l.text)}</span>`);
      setTimeout(endBattle, 500*T); break;

    default: bline(esc(l.text ?? ""));
  }
}

function endBattle(){
  if(!BS) return;
  clearTimeout(BS.timer);
  const r = BS.res;
  $("#ffBtn").disabled = true; $("#ffBtn").classList.remove("on"); $("#ffBtn").textContent="빨 리";
  $("#skBtn").disabled = true;
  BS = null;

  // 전투 후 체력을 확정한다. 다음 걸음의 시작점이다.
  SESS.hpBefore = r.hp_state;
  drawParty();

  // 부정·걸음 갱신
  const bar = $("#p-gil").querySelectorAll(".bar i");
  if(bar[0]) bar[0].style.width = SESS.step/SESS.of*100 + "%";
  if(bar[1]) bar[1].style.width = SESS.bujeong + "%";
  const lbl = $("#p-gil").querySelectorAll(".lbl span");
  if(lbl[1]) lbl[1].textContent = `${SESS.step} / ${SESS.of}`;
  if(lbl[3]) lbl[3].textContent = `${SESS.bujeong} / 100`;

  // 신표
  const notes = (r.sinpyo_note ?? []).map(n=>`<div style="color:var(--hwang);font-family:var(--serif);
    font-size:12px;margin-top:4px">${esc(n)}</div>`).join("");
  const drops = Object.entries(r.drops?.mats ?? {}).map(([k,v])=>`${esc(k)} ×${v}`).join(" · ");
  if(drops || notes) $("#battle").innerHTML =
    `<div class="card"><h3>얻은 것</h3><div style="font-size:12px;color:var(--dim)">${drops||"—"}</div>${notes}</div>`;

  if(r.status !== "active"){
    $("#battle").innerHTML = (r.reason?`<div class="card" style="border-color:var(--jeok)">
      <div style="font-family:var(--serif);color:#E08A80">${esc(r.reason)}</div></div>`:"")
      + rewardHtml(r.reward);
    $("#stepBtn").disabled = true; $("#stepBtn").textContent = "끝났다";
    // 클리어했으면 그 거리가 열린다. 이미 봤으면 안 뜬다.
    if(r.status === "cleared" && SESS?.dun?.id){
      const did = SESS.dun.id;
      setTimeout(()=>{ SESS = null; geori(`clear:${did}`); }, 1600);
    }
  }else{
    const b=$("#stepBtn"); b.disabled=false;
    b.textContent = SESS.step+1 >= SESS.of ? "마지막 — 보스가 기다린다" : "한 걸음 더";
  }
}

function rewardHtml(w){
  const mats = Object.entries(w.materials??{}).map(([k,v])=>`${esc(k)} ×${v}`).join(" · ");
  const cards = (w.cards??[]).map(c=>`<b style="color:var(--hwang)">${esc(c.name)}</b> ★${c.tier}`).join(" · ");
  return `<div class="card" style="margin-top:9px;border-color:var(--hwang)">
    <h3>${w.cleared?"길을 다 걸었다":"챙긴 것만 들고 나왔다"}</h3>
    <dl>
      ${mats?`<div class="row"><dt>재료</dt><dd>${mats}</dd></div>`:""}
      ${cards?`<div class="row"><dt>신</dt><dd>${cards}</dd></div>`:""}
      <div class="row"><dt>경험</dt><dd>+${w.exp}</dd></div>
      <div class="row"><dt>엽전</dt><dd>+${w.yeopjeon.toLocaleString()}</dd></div>
      ${w.level_up?`<div class="row"><dt>격</dt><dd style="color:var(--hwang)">

    </dl>
    <button class="btn ghost" style="margin-top:11px" onclick="SESS=null;go('gil')">돌아간다</button>
  </div>`;
}
async function leave(){

/* ══ 씻김 — D15 ════════════════════════════ */
const STEPN = ["초가망석","넋올림","고풀이","씻김","길닦음"];
let KNOT_T = 0;
function ssitgimUI(){
  const s = SESS;
  $("#p-gil").innerHTML = `
    <h2>${esc(s.dungeon)}</h2>
    <p class="sub">이곳에선 싸우지 않는다.<br>매듭을 하나씩 푼다. 서두르면 넋이 안 풀린다.</p>

    <div class="card">
      <div class="lbl"><span>${esc(STEPN[s.step] ?? "길닦음")}</span><span>${s.step} / 5</span></div>
      <div class="bar pg"><i style="width:${s.step/5*100}%"></i></div>
    </div>

    <div class="card">
      <h3>고풀이</h3>
      <div style="font-size:11.5px;color:var(--dim);line-height:1.7;margin-bottom:2px">
        일곱 매듭을 하나씩 푼다.
        <span style="color:var(--jeok)">서두르면 넋이 달아난다 — 매듭마다 숨을 고른다.</span>
      </div>
      <div class="gopan" style="--rel:${(s.knots.length/7).toFixed(3)}">
        <div class="salpuri" id="salpuri"></div>
        <div class="cord"></div>
        <div class="knots" id="knots">
          ${[...Array(7)].map((_,i)=>{
            const st = i<s.knots.length?"done":i===s.knots.length?"now":"";
            return `<div class="knot ${st}">${i<s.knots.length?"解":"結"}</div>`;
          }).join("")}
        </div>
      </div>
      <button class="pull" id="pullBtn" onclick="pullKnot()" ${s.knots.length>=7?"disabled":""}>
        ${s.knots.length>=7 ? "매듭을 다 풀었다" : (s.knots.length ? "다음 매듭" : "첫 매듭을 잡는다")}
      </button>
      ${s.knots.length ? `<div class="gp-avg">푼 매듭 ${s.knots.length} · 평균 ${Math.round(s.knots.reduce((a,b)=>a+b,0)/s.knots.length)}ms</div>` : ""}
      ${s.knots.length>=7 ? `<button class="btn" style="margin-top:12px" onclick="doSsitgim()">넋을 씻는다</button>` : ""}
    </div>

    <div id="ssErr"></div>
    <button class="btn ghost" onclick="leave()">물러난다</button>`;
  if (s.knots.length === 0) KNOT_T = performance.now();   // 첫 매듭 전 무장: 개시~첫 매듭이 첫 값
}
function pullKnot(){
  const s = SESS;
  if (s.knots.length >= 7) return;
  const now = performance.now();
  s.knots.push(Math.max(1, Math.round(now - KNOT_T)));    // 매 탭마다 기록 → 7탭 = 7값
  KNOT_T = now;
  ssitgimUI();
}
async function doSsitgim(){
  try{
    const r = await api("/ssitgim", { knots: SESS.knots });
    SESS.step = r.step; SESS.knots = []; SESS.bujeong = r.bujeong;
    $("#ssErr").innerHTML = `<div class="card" style="border-color:${r.success?"var(--hwang)":"var(--line)"}">
      <h3>${esc(r.name)}</h3>
      <div style="font-family:var(--serif);font-size:13px;line-height:1.8">${esc(r.text)}</div>
      <dl style="margin-top:9px">
        <div class="row"><dt>정성</dt><dd>${r.gopuli.jeongseong} (평균 ${r.gopuli.avg_ms}ms)</dd></div>
        <div class="row"><dt>성공률</dt><dd>${r.rate_used}%</dd></div>
      </dl>
    </div>`;
    if (r.cleared){
      const did = SESS?.dun?.id;
      SESS = null; await refresh();
      // 씻김을 마쳤으면 그 거리가 열린다 (D15 지전거리)
      setTimeout(()=>{ if(!geori(`clear:${did}`)) home(); }, 1400);
    }
    else { const e = $("#ssErr").innerHTML; ssitgimUI(); $("#ssErr").innerHTML = e; }
    if (r.success){ const sp = $("#salpuri"); if (sp){ void sp.offsetWidth; sp.classList.add("on"); } }
  }catch(e){ $("#ssErr").innerHTML = fail(e); }
}

function dogam(){

  NAV = list.map(c=>c.id);

      const img = src

/* ══ 넘기기 ═══════════════════════════════════════
   손가락으로 넘기는 게 버튼보다 빠르다. 둘 다 둔다. */
let NAV = [];                       // 지금 보고 있는 목록의 순서

function swipe(el, onPrev, onNext){
  let x0=null, y0=null, t0=0;
  el.addEventListener("touchstart", e=>{
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now();
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
    x0=null;
    if(dt>600) return;                       // 느리면 스크롤로 본다
    if(Math.abs(dx) < 48) return;            // 너무 짧으면 무시
    if(Math.abs(dy) > Math.abs(dx)*0.8) return;  // 세로가 크면 스크롤이다
    (dx > 0 ? onPrev : onNext)();
  }, {passive:true});
}
/* 넘길 때 살짝 밀려 들어온다 */
function slide(el, dir){
  if(!el) return;
  el.style.transition = "none";
  el.style.transform = `translateX(${dir>0 ? 26 : -26}px)`;
  el.style.opacity = ".4";
  requestAnimationFrame(()=>{
    el.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1), opacity .26s";
    el.style.transform = "none";
    el.style.opacity = "1";
  });
}

/* ══ 카드 상세 — 아코디언 ═══════════════════

   이름을 지우고 정보까지 지우면 그건 그냥 정보를 없앤 것이다. */
const ROLE_TAGS = role => {

const LOSES = f => Object.keys(BEATS).find(k=>BEATS[k]===f);
/* 무신도 노드 — 라이브 hy v17 의 NODE_COST_MAP 그대로다.
   앞 단계를 하나라도 열면 다음 단계가 열린다(같은 단계는 몇 개든 열 수 있다).
   ★ 노드가 전투에서 무엇을 하는지는 아직 서버에 정의되어 있지 않다.
     비용만 있고 효과가 없으므로 화면에도 그렇게 적는다. 없는 효과를 지어내지 않는다. */

/* 회랑은 격(레벨)이 닿아야 열린다 — 서버 NODE_LV_GATE 와 같다 */

const CARD_LV_CAP  = t => Math.max(1, Math.min(5, Number(t)||1)) * 8;   // 성급×8

const nodeReach = nodes => {

const gmOf = pc => {
  const g = pc && pc.growth_meta;
  const m = (g && typeof g==="object" && !Array.isArray(g)) ? g : {};
  return { slots: Array.isArray(m.slots)?m.slots:[], nodes: Array.isArray(m.nodes)?m.nodes:[],
           split_count: Number(m.split_count)||0 };

const EVO_FEED={2:1,3:2,4:3,5:4}, EVO_YEOP={2:2000,3:8000,4:30000,5:120000},
      EVO_RATE={2:90,3:65,4:35,5:12}, AWK_SIN=[0,20,40,80,160,320], AWK_RATE=[0,80,65,50,35,20];
/* 정성은 카드마다 쌓인다. 서버는 최종확률 = min(상한, 기본 + 회당 × 정성) 으로 굴린다.
   여태 화면엔 기본 확률만 떠서, 열 번 실패해도 12%라고 적혀 있었다. 실제와 다르다.
   아래 값은 라이브 hy 의 규칙 그대로다(EVOLVE/AWAKEN/UNIQUE). */
const EVO_JEONG={2:3,3:5,4:6,5:5}, EVO_CAP=95,
      AWK_JEONG=5, AWK_CAP=95, UNQ_RATE=25, UNQ_JEONG=8, UNQ_CAP=90;
const rateOf = (base, per, jeong, cap) =>
  Math.min(cap, base + per * (Number(jeong) || 0));

/* 정성을 미리 들인다 — 신물을 제단에 올려 게이지를 채운다 (hy v23 · POST /grow/jeong).
   여태 정성은 "실패해야만" 쌓였다. 그래서 성장이 도박이었다.
   확률 공식은 그대로다. 정성이 오르는 길이 하나 더 난 것뿐이다.
   상한에 닿는 데 필요한 횟수를 넘겨서는 서버가 받지 않는다 — 엽전만 버리게 두지 않는다. */
const JEONG_MAT = "하급신물", JEONG_YEOP = 1500;
const jeongNeed = (base, per, cap) => per > 0 ? Math.ceil((cap - base) / per) : 0;
/* 정성이 쌓였을 때만 내역을 덧붙인다 — 0이면 군더더기다. */
const jeongNote = (base, per, jeong, cap) => {
  const j = Number(jeong) || 0;

  const f = rateOf(base, per, j, cap);
  return `<span style="color:var(--hwang)">정성 <b>${j}</b>회 · 지금 <b>${f}%</b>${
    f >= cap ? " (상한)" : ""}</span>`;
};

              : `${gExp} / ${gNeed} — 탐험을 마치면 파티 다섯이 각자 전액을 받는다.`}
    </div>`;

  /* 접신·무신도 — 서버의 growth_meta 를 그대로 읽는다 */
  const gm = mine ? gmOf(mine) : { slots:[], nodes:[], split_count:0 };
  /* 넋의 종류를 사람 말로 — 서버 growSlot 이 정하는 op 그대로다 */
  const slotSign = sl => {
    const v = Number(sl.val) || 0;
    switch(sl.op){
      case "start_gauge_flat":    return [`개막 기세 +${v}`, "느려도 먼저 움직인다"];
      case "skill_rate_add":      return [`술법 +${v}%p`,    "술법이 더 자주 터진다"];
      case "dot_mitigation_flat": return [`불씨 −${v}`,       "지속 피해를 덜 받는다"];
      case "faction_pierce_flat": return [`관통 +${v}`,       "상성에 눌려도 뚫는다"];
      default: {
        const nm = { ap:"공격", dp:"방어", hp:"생기" }[sl.stat] ?? sl.stat;
        return [`${nm} +${v}`, ""];
      }
    }
  };
  const slotBox = i => {
    const sl = gm.slots[i];
    if(!sl) return `<div class="slotbox"><div class="empty">빈 자리</div></div>`;
    const [head, note] = slotSign(sl);
    return `<div class="slotbox on">
      <div class="sv">${esc(head)}</div>
      <div class="ss">${esc(sl.source ?? "")}의 넋${note ? ` · ${esc(note)}` : ""}</div></div>`;
  };
  const napBody = !mine ? `<div style="color:#5C5347">아직 안 모셨다</div>` : `
    <div style="font-size:11.5px;color:var(--dim);line-height:1.7">
      다른 카드를 태워 그 넋을 이 카드에 옮긴다. 자리는 둘뿐이고 <b style="color:var(--jeok)">되돌릴 수 없다.</b></div>
    <div class="slots">${slotBox(0)}${slotBox(1)}</div>
    <div style="display:flex;gap:6px;margin-top:11px">
      ${gm.slots.length < 2
        ? `<button class="btn sm" style="flex:1" onclick="growOpen('slot',${mine.id})">접신한다</button>`
        : `<div style="flex:1;font-size:11px;color:#5C5347;align-self:center">자리가 다 찼다</div>`}
      <button class="btn sm ghost" style="flex:1" onclick="nodeOpen(${mine.id})">
        무신도 ${gm.nodes.length?`(${gm.nodes.length})`:""}</button>
    </div>`;

  /* 출전 — 고증률 88%가 이 게임의 정체성이다. 카드에 안 적히면 아무도 모른다. */
  const srcBody = `<div class="src">
    <b>${esc(c.name)}</b> — ${esc(c.source ?? "—")}
    ${c.unique_source?`<br><b>【${esc(c.unique_skill)}】</b> — ${esc(c.unique_source)}`:""}</div>`;

  const ov = $("#ovIn");
  const ni = NAV.indexOf(id);          // 지금 보고 있는 목록에서 몇 번째인가
  const hasNav = ni >= 0 && NAV.length > 1;
  ov.className = "cd";
  ov.innerHTML = `
    <button class="x" onclick="PX.clear();$('#ov').classList.remove('on')">✕</button>
    ${hasNav?`
      <button class="arw l" onclick="navCard(-1)" ${ni<=0?"disabled":""}><span>‹</span></button>
      <button class="arw r" onclick="navCard(1)"  ${ni>=NAV.length-1?"disabled":""}><span>›</span></button>
      <div class="nvi">${ni+1} / ${NAV.length}</div>`:""}
    <div class="art" id="cdArt">
      ${src?`<img src="${src}" alt="">`:`<div class="blank" style="position:absolute;inset:0"></div>`}
      ${t>=4?`<svg class="hl" viewBox="0 0 100 100" style="color:${colL}">
        <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="37"/></svg>`:""}
      <div class="g"></div>
      <span class="band f-${c.faction}" style="position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2"></span>
    </div>
    <div class="plate">
      ${t?`<span class="st">${"★".repeat(t)}</span>`:""}
      ${c.hidden?`<span class="sil">숨은 신</span>`:""}
      <div class="nm">${esc(c.name)}</div>
      <div class="rule" style="background:${colL}"></div>
      <div class="sub" style="color:${colL}">${c.faction} · ${c.godhood}${awk?` · 각성 ${awk}`:""}</div>
    </div>
    ${sec("스킬", esc(c.skill ?? "—"), skillBody, false, true)}
    ${sec("리더", esc((c.leader_effect?.text ?? c.leader_bonus ?? "—").split(" — ")[0]),
          `<div class="t hw">${esc(c.leader_effect?.text ?? c.leader_bonus ?? "—")}</div>
           <div style="margin-top:5px;color:#6E6455">가운데 자리(주신)에 세울 때만 걸린다.</div>`)}
    ${sec(unlocked?"유니크":"잠김", `【${esc(c.unique_skill)}】`, uniqBody, !unlocked)}
    ${mine ? sec("격", gFull ? `${gLv} · 상한` : `${gLv} / ${gCap}`, gakBody) : ""}
    ${sec("기른다", t?`${t}성 · 각성 ${awk}`:"아직 안 모셨다", growBody)}
    ${sec("접신", mine ? `넋 ${gm.slots.length}/2 · 노드 ${gm.nodes.length}/${NODES.length}` : "—", napBody)}
    ${c.hidden && c.unlock_text ? sec("해금", "봉인이 풀린 까닭",
        `<div class="t hw">${esc(c.unlock_text)}</div>
         <div style="margin-top:6px;color:#6E6455">숨은 신은 뽑아서 얻는 것이 아니다. 해야 얻는다.</div>`) : ""}
    ${sec("출전", "出典 · 고증", srcBody)}
    <div style="padding:14px 16px 18px">
      <button class="btn" onclick="go('dang');$('#ov').classList.remove('on')">당(堂)에 모신다</button>
    </div>`;

  // 하나라도 열리면 그림이 물러난다. 다 닫으면 다시 커진다.
  ov.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{
    ov.classList.toggle("open", !!ov.querySelector("details[open]"));
  }));
  ov.classList.toggle("open", !!ov.querySelector("details[open]"));
  $("#ov").classList.add("on");

  // 손가락으로도 넘긴다
  if(hasNav && !ov.dataset.sw){ ov.dataset.sw="1";
    swipe(ov, ()=>navCard(-1), ()=>navCard(1)); }
  CUR_CARD = id;

  // 기울이면 형체가 따라 움직인다
  PX.clear();
  if(src) setTimeout(()=>PX.mount($("#cdArt"), src, { mode:"tilt", amp:13, fal:0.6 }), 120);
}
let CUR_CARD = null;
function navCard(dir){
  const i = NAV.indexOf(CUR_CARD);
  if(i < 0) return;
  const j = i + dir;
  if(j < 0 || j >= NAV.length) return;
  detail(NAV[j]);
  slide($("#ovIn"), dir);
}
$("#ov").onclick = e => { if(e.target.id==="ov") $("#ov").classList.remove("on"); };

/* ══ 갈피 ═════════════════════════════════ */
function devilHome(){
  const p=ME.player, cards=ME.cards||[], seen=new Set(cards.map(c=>c.card_id)).size;
  const featured=cards.slice().sort((a,b)=>(b.tier||1)-(a.tier||1)).slice(0,4);
  const cardHtml=featured.length?featured.map((pc,i)=>{const c=mc(pc.card_id)||GHOST(pc.card_id);return `<div class="mini" onclick="detail('${esc(pc.card_id)}')">${i===0?'<span class="dm-badge">LEADER</span>':''}<span class="band f-${esc(c.faction||'당')}"></span>${artOf(c)?`<img src="${artOf(c)}" alt="" loading="lazy">`:'<span class="blank"></span>'}<span class="st">${'★'.repeat(pc.tier||1)}</span><div class="nm">${esc(c.name)}</div></div>`}).join(''):'<div class="card" style="grid-column:1/-1;color:var(--dim);font-size:11px">아직 모신 신이 없다. 당에서 첫 소환을 시작한다.</div>';
  $('#p-home').innerHTML=`<div class="dm-home"><section class="dm-hero"><div class="dm-kicker">TWILIGHT · CARD CHRONICLE</div><h2>오늘 밤, 누구를 모실까</h2><p>신과 귀를 모아 덱을 만들고<br>관찰과 파괴의 순서로 원을 푼다.</p><div class="dm-actions"><button class="btn" onclick="go('gil')">출격하기　›</button><button class="btn ghost" onclick="go('dang')">소환 / 편성</button></div></section><div class="dm-stats"><div class="dm-stat"><b>${cards.length}</b><small>보유 카드</small></div><div class="dm-stat"><b>${seen}/${M.total_count??120}</b><small>도감 수집</small></div><div class="dm-stat"><b>${p.level}</b><small>현재 격</small></div></div><div class="dm-section"><h3>오늘의 의뢰</h3><span>0 / 3 완료</span></div><div class="dm-quest"><span class="qicon">⚔</span><div><strong>길에 나가 보스의 예비동작을 읽어라</strong><small>출격 1회 · 보상 향 12, 엽전 300</small></div><button onclick="go('gil')">이동 ›</button></div><div class="dm-quest"><span class="qicon">✦</span><div><strong>새로운 신을 한 위 모셔라</strong><small>소환 1회 · 보상 복채 10</small></div><button onclick="go('dang')">이동 ›</button></div><div class="dm-section"><h3>주력 덱</h3><span>탭하여 상세 보기</span></div><div class="dm-featured">${cardHtml}</div><div class="card" style="margin-top:13px;border-color:#493c60;background:linear-gradient(110deg,rgba(128,102,184,.13),var(--heuk2))"><h3>황혼 기록</h3><div style="font-size:11px;color:var(--dim);line-height:1.7">관찰 → 고정 → 동시 → 봉쇄 → 파괴<br><b style="color:var(--hwang-l)">HP를 깎는 게임이 아니라, 빈틈을 증명하는 게임.</b></div></div></div>`;
}
const PANES = { home:devilHome, dang, gil, gut, dogam };
let TAB = "home";
function go(p){
  PX.clear();          // 탭을 옮기면 WebGL 컨텍스트를 놓는다
  TAB = p;
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.p===p));
  $("#p-"+p).classList.add("on");
  PANES[p]();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>go(b.dataset.p));

/* ══ 시동 ═════════════════════════════════ */
function head(){
  const p = ME.player;
  $("#who").textContent = p.nickname;
  $("#lv").textContent = `격 ${p.level} · 신력 ${SINRYEOK()}`;
  $("#hyang").textContent = p.hyang;
  $("#bok").textContent = p.bokchae;
  $("#yeop").textContent = Number(p.yeopjeon).toLocaleString();
}
async function refresh(){
  ME = await api("/player");
  head();
  /* 서버는 /master 에서 히든 카드를 잘라낸다. 그런데 플레이어가 히든 카드를
     가질 수 있다(던전 드랍, 씻김 100회의 C112 등). 그러면 mc()가 못 찾아
     그 카드가 파티·전투·가챠 화면에서 통째로 사라진다.
     /player 가 "가진 히든 카드"만 따로 실어 보내므로, 여기서 마스터에 합류시킨다. */
  if (Array.isArray(ME.extra_cards) && ME.extra_cards.length && M){
    const have = new Set(M.cards.map(c=>c.id));
    for (const c of ME.extra_cards) if (!have.has(c.id)) M.cards.push(c);
  }
  // 서버가 진행 중인 탐험을 알려준다. 새로고침해도 안 갇힌다.
  if (ME.active){
    const a = ME.active;
    SESS = { id:a.id, dungeon:a.dungeon_name, dun:a.dungeon,
             step:a.step ?? 0, of:a.ritual ? (a.ssitgim_steps ?? 5) : (a.of ?? a.steps ?? a.dungeon?.steps ?? 10),
             bujeong:a.bujeong ?? 0, hp:a.hp_state, ritual:a.ritual,
             knots: SESS?.knots ?? [] };
  } else SESS = null;
}

/* ══ 오프닝 ═══════════════════════════════════════
   향이 타는 동안 신을 부른다. 로딩이 연출 뒤에 숨는다.
   처음이면 「신을 받는다」(내림굿), 이어서면 「당(堂)으로 돌아간다」. */
async function boot(){
  $("#p-home").innerHTML = `<div class="mid"><span class="spin"></span><br><br>신을 부른다…</div>`;
  PID = store.get();

  // 오프닝은 먼저 뜬다. 마스터는 그 뒤에서 온다.
  const loading = api("/master").then(m=>{ M = m; }).catch(e=>{ M = null; BOOT_ERR = e; });

  await loading;
  const total = M?.total_count ?? 124;

  if (BOOT_ERR){
    $("#openB").innerHTML = `<div class="err">${fail(BOOT_ERR)}</div>
      <button class="p" onclick="location.reload()">다 시</button>`;
    return;
  }

  if (!PID){
    $("#openB").innerHTML = `
      <div id="initErr" class="err"></div>
      <input class="nick" id="nick" maxlength="12" placeholder="이름을 남긴다 (1~12자)">
      <button class="p" onclick="init()">신 을 &nbsp;받 는 다</button>
      <div class="v">고흥의 신과 귀 ${krNum(total)} 위</div>`;
    return;
  }

  $("#openB").innerHTML = `
    <button class="p" onclick="enterGame()">당(堂)으로 &nbsp;돌 아 간 다</button>
    <div class="v">고흥의 신과 귀 ${krNum(total)} 위</div>`;
}
let BOOT_ERR = null;

/* 백스물넉 — 숫자를 우리말로. 「124위」보다 이게 맞다. */
function krNum(n){
  const H=["","백","이백","삼백"], T=["","열","스물","서른","마흔","쉰","예순","일흔","여든","아흔"];
  const U=["","한","두","석","넉","다섯","여섯","일곱","여덟","아홉"];
  const h=Math.floor(n/100), t=Math.floor(n%100/10), u=n%10;
  return (H[h]??"") + (T[t]??"") + (U[u]??"") || String(n);
}

async function enterGame(){
  try{
    await refresh();
    loadTask();
    home();
    $("#open").classList.add("gone");
    setTimeout(()=>{ const o=$("#open"); if(o) o.remove(); }, 950);
    // 첫 실행이면 부정거리부터. 이미 봤으면 그냥 지나간다.
    setTimeout(()=>geori("부정"), 1000);
  }catch(e){
    $("#openB").innerHTML = `<div class="err">${fail(e)}</div>
      <button class="p" onclick="location.reload()">다 시</button>`;
  }
}
async function init(){
  const nick = $("#nick").value.trim();
  const b = $("#openB .p");
  if(b){ b.disabled = true; b.textContent = "…"; }
  try{
    const d = await api("/player/init", { nickname: nick });
    PID = d.player.id;
    store.set(PID);
    await enterGame();
  }catch(e){
    $("#initErr").innerHTML = fail(e);
    if(b){ b.disabled = false; b.textContent = "신 을  받 는 다"; }
  }
}
boot();
</script>
</body>
