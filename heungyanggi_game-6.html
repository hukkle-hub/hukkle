<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17140F">
<title>흥양기 興陽記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   흥양기 — 오방색(五方色). 무신도 단청에서 뽑았다.
   흑(玄)북 · 청(靑)동 · 적(赤)남 · 백(白)서 · 황(黃)중앙
   ═══════════════════════════════════════════════════ */
:root{
  /* 혼합(C) — 순흑 화폭 위 금(金)+진사(辰砂). 무신도 색이 사는 어둠. */
  --heuk:#0B0A08; --heuk2:#15120D; --heuk3:#1F1B13;
  --hwang:#C8A24B; --hwang-l:#E4C778; --cheong:#1E4C73; --cheong-l:#4E8FC0; --jeok:#CE3A2A;
  --baek:#EDE7DA; --dim:#8B8275; --line:#2A2418;
  /* 깊이 — 금빛 실선 · 안쪽 광택 · 그늘 · 발광 */
  --line-hi:rgba(228,199,120,.13); --gold-in:rgba(255,241,205,.28);
  --sh1:0 4px 14px rgba(0,0,0,.45); --sh2:0 10px 26px rgba(0,0,0,.55); --sh3:0 16px 40px rgba(0,0,0,.7);
  --glow-h:0 0 16px rgba(200,162,75,.4); --glow-j:0 0 18px rgba(206,58,42,.5);
  --serif:'Nanum Myeongjo',serif; --sans:'IBM Plex Sans KR',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
.dm-home{padding-top:2px}.dm-hero{position:relative;min-height:178px;overflow:hidden;padding:20px 18px;margin:-14px -14px 14px;background:radial-gradient(circle at 80% 20%,rgba(200,162,75,.24),transparent 35%),linear-gradient(140deg,#291b18,#120f0d 62%,#241b14);border-bottom:1px solid #59452a}.dm-hero:after{content:'興';position:absolute;right:18px;bottom:-32px;font:800 180px/1 var(--serif);color:rgba(228,199,120,.09);transform:rotate(-12deg)}.dm-kicker{font-size:10px;letter-spacing:.18em;color:var(--hwang-l);position:relative;z-index:1}.dm-hero h2{font-size:25px;letter-spacing:.08em;margin:7px 0;position:relative;z-index:1}.dm-hero p{font-size:11.5px;color:#c3b8a6;line-height:1.6;position:relative;z-index:1}.dm-actions{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:15px;position:relative;z-index:2}.dm-actions .btn{padding:11px 8px;font-size:12px}.dm-actions .ghost{background:rgba(0,0,0,.3)}.dm-section{margin:15px 0 8px;display:flex;justify-content:space-between;align-items:center}.dm-section h3{font:700 14px var(--serif);letter-spacing:.07em}.dm-section span{font-size:10px;color:var(--dim)}.dm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.dm-stat{padding:10px 8px;background:rgba(28,23,19,.92);border:1px solid var(--line);text-align:center}.dm-stat b{display:block;color:var(--hwang-l);font:700 18px var(--serif)}.dm-stat small{color:var(--dim);font-size:9.5px}.dm-quest{display:flex;align-items:center;gap:10px;padding:11px 12px;background:linear-gradient(90deg,rgba(128,102,184,.18),rgba(20,15,12,.8));border:1px solid #493c60;margin-bottom:7px}.dm-quest .qicon{font-size:21px}.dm-quest strong{font:700 11.5px var(--serif);display:block}.dm-quest small{font-size:10px;color:var(--dim)}.dm-quest button{margin-left:auto;color:var(--hwang-l);font-size:11px}.dm-featured{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dm-featured .mini{min-width:0}.dm-badge{position:absolute;top:7px;left:7px;z-index:3;background:#d94b42;color:white;font-size:8px;padding:3px 5px;letter-spacing:.08em}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--heuk);color:var(--baek);font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 120% 52% at 50% 0%,#1C160E 0%,transparent 72%),
    repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.14) 3px 4px);
}
:focus-visible{outline:2px solid var(--hwang);outline-offset:2px}
/* 폭 — 폰은 560, 넓은 화면(갤탭)은 960까지 편다.
   560 고정이면 태블릿에서 양옆이 통째로 죽는다. nav 도 같이 넓혀야 어긋나지 않는다. */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
@media(min-width:900px){ #app{max-width:960px} }
.mini .blank{background:radial-gradient(circle at 50% 28%,rgba(228,199,120,.30) 0 12%,transparent 13%),radial-gradient(circle at 50% 42%,rgba(128,102,184,.26),transparent 42%),linear-gradient(145deg,#332822,#12100e 70%)}
.mini .blank:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;font:34px var(--serif);color:rgba(228,199,120,.38)}
.dm-battle-guide{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:10px 0;padding:8px 5px;background:rgba(20,15,12,.82);border:1px solid var(--line)}.dm-battle-guide span{text-align:center;font:9px var(--serif);color:var(--dim)}.dm-battle-guide span b{display:block;color:var(--hwang-l);font-size:13px;margin-bottom:2px}
.dm-boss-state{padding:9px 11px;border:1px solid #493c60;background:linear-gradient(90deg,rgba(128,102,184,.18),rgba(18,14,12,.9));font-size:11px;color:#c5b7ac;line-height:1.55}.dm-boss-state b{color:#f0c979;font-family:var(--serif)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── 머리: 재화 ─────────────────────────── */
header{
  position:sticky;top:0;z-index:20;background:rgba(11,10,8,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 var(--line-hi),var(--sh1);padding:10px 14px;
}
.hd{display:flex;align-items:center;gap:10px}
.who{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.04em}
.lv{font-size:10.5px;color:var(--hwang);font-family:var(--serif)}
.res{margin-left:auto;display:flex;gap:11px;font-size:11.5px;font-family:var(--serif)}
.res b{font-weight:700;font-size:13px}
.r-h b{color:#D98B3A} .r-b b{color:var(--hwang)} .r-y b{color:var(--dim)}

/* ── 몸통 ───────────────────────────────── */
main{flex:1;padding:14px 14px 84px}
.pane{display:none;animation:in .22s ease-out}
.pane.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.1em;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--dim);margin-bottom:16px;line-height:1.6}

.card{background:linear-gradient(180deg,var(--heuk2),#100E0A);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--line-hi),var(--sh1);padding:14px;margin-bottom:11px}
.card h3{font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:.05em;margin-bottom:7px;
  display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:13px;background:var(--hwang);flex:0 0 auto}

.btn{
  display:block;width:100%;padding:13px;
  background:linear-gradient(180deg,var(--hwang-l),var(--hwang));color:var(--heuk);
  font-family:var(--serif);font-weight:800;font-size:14.5px;letter-spacing:.1em;
  transition:.15s;border:1px solid var(--hwang);
  box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h);
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--baek);border-color:var(--line)}
.btn.red{background:linear-gradient(180deg,#E24C3C,var(--jeok));border-color:var(--jeok);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--glow-j)}
.btn.sm{padding:8px 14px;font-size:12.5px;width:auto;display:inline-block}

.err{background:#2A1512;border:1px solid var(--jeok);padding:11px;font-size:12.5px;
     color:#E8A5A0;margin-bottom:11px;line-height:1.6}
.err b{color:var(--jeok);display:block;font-family:var(--serif);margin-bottom:3px}

/* ── 카드 낱장 ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.mini{
  position:relative;aspect-ratio:3/4;background:#000;border:1px solid var(--line);
  overflow:hidden;cursor:pointer;transition:.18s;
}
.mini:active{transform:scale(.96)}
.mini.sel{border-color:var(--hwang);box-shadow:0 0 0 1px var(--hwang),var(--glow-h)}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
/* 그림이 없거나 로딩에 실패한 자리. 예전엔 이름 첫 글자를 크게 찍었는데,
   [hidden] 은 브라우저 기본 display:none 이고 이 클래스 선택자가 그걸 이겨서
   그림 위에 글자가 늘 깔려 있었다. 글자를 아예 뺀다 — 이름은 아래에 이미 있다. */
.mini .blank{position:absolute;inset:0;background:
  repeating-linear-gradient(135deg, #0E0C08 0 6px, #121009 6px 12px)}
.mini .blank[hidden]{display:none}
.mini .band{position:absolute;left:0;top:0;bottom:0;width:3px}
.f-당 .band,.band.f-당{background:var(--hwang)}
.f-물 .band,.band.f-물{background:var(--cheong)}
.f-저승 .band,.band.f-저승{background:var(--jeok)}
.mini .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 5px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.93) 45%);
  font-family:var(--serif);font-size:10.5px;font-weight:700;line-height:1.25}
.mini .st{position:absolute;top:3px;right:4px;font-size:9px;color:var(--hwang);letter-spacing:-1px}
.mini .halo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
            width:112%;aspect-ratio:1;pointer-events:none}
.mini .hp{position:absolute;left:0;right:0;bottom:0;height:3px;background:#3A0F0C}
.mini .hp i{display:block;height:100%;background:var(--jeok);transition:width .4s}
.mini.down{filter:grayscale(1) brightness(.4)}

/* ── 도감 필터 ───────────────────────────── */
.filt{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.frow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.frow .fl{font-size:9.5px;color:var(--dim);font-family:var(--serif);
          letter-spacing:.16em;width:32px;flex-shrink:0}
.chip{font-size:11px;padding:5px 10px;border:1px solid var(--line);color:var(--dim);
      font-family:var(--serif);transition:.14s}
.chip.on{border-color:var(--hwang);color:var(--hwang);background:rgba(200,162,75,.09)}
.chip.f-당.on{border-color:var(--hwang);color:var(--hwang)}
.chip.f-물.on{border-color:var(--cheong-l);color:var(--cheong-l);background:rgba(78,143,192,.1)}
.chip.f-저승.on{border-color:var(--jeok);color:var(--jeok);background:rgba(184,53,46,.1)}

/* 도감 낱장 — 미획득 이름이 회색 위 회색이라 안 읽혔다 */
.mini.dim .nm{color:#9A8F7C}
.mini .tr{position:absolute;top:3px;right:4px;font-size:9px;letter-spacing:-1px;
          color:var(--hwang);text-shadow:0 1px 3px #000}
.mini .noart{position:absolute;top:4px;left:7px;font-size:8px;color:#5C5347;
             font-family:var(--serif);letter-spacing:.1em}

/* ── 파티 슬롯 — 누가 앞장서는지 보여야 한다 ── */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:11px}
.sl{position:relative;aspect-ratio:3/4;background:#0C0A07;border:1px dashed var(--line);
    display:grid;place-items:center;overflow:hidden}
.sl.has{border:1px solid var(--line);border-style:solid}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.sl .e{font-family:var(--serif);font-size:10px;color:#3E3629}
.sl .no{position:absolute;top:2px;left:4px;font-size:9px;font-family:var(--serif);
        color:var(--dim);text-shadow:0 1px 3px #000;z-index:2}
.sl.lead{border-color:var(--hwang);box-shadow:0 0 0 1px var(--hwang),var(--glow-h)}
.sl.lead .no{color:var(--hwang)}
.sl .ld{position:absolute;left:0;right:0;bottom:0;background:var(--hwang);color:var(--heuk);
        font-family:var(--serif);font-size:8.5px;font-weight:800;text-align:center;
        padding:2px 0;letter-spacing:.1em;z-index:2}

/* ── 상세 팝업 — 넓은 화면에선 그림 좌 / 정보 우 ── */
@media(min-width:760px){
  .ov-in{max-width:720px}
  .ov-in.two{display:grid;grid-template-columns:300px 1fr}
  .ov-in.two > div:first-child{aspect-ratio:3/4}
  .ov-in.two .ov-b{overflow:auto;max-height:82vh}
}

/* ══ 카드 상세 — 접으면 그림이 커진다 ═════════════
   그림이 기본이고 정보는 손님이다. 아무것도 안 열면 3:4 전면 —
   카드를 보러 온 사람은 그림을 본다. 스킬이 궁금하면 열고,
   그때 그림이 예의 있게 물러난다. 닫으면 돌아온다.        */
.cd{max-width:420px;width:100%;background:var(--heuk2);border:1px solid var(--line);
    box-shadow:var(--sh3);max-height:88vh;overflow-y:auto;position:relative}
.cd .art{position:relative;aspect-ratio:3/4;background:#000;overflow:hidden;
         transition:aspect-ratio .45s cubic-bezier(.2,.9,.25,1)}
.cd.open .art{aspect-ratio:16/9;min-height:150px}
.cd .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             object-position:center 18%}
/* 그림 아래 옅은 그늘 — 그림과 이름판이 이어 보이게만 한다. 글자는 안 얹는다. */
.cd .art .g{position:absolute;left:0;right:0;bottom:0;height:34%;
            background:linear-gradient(transparent,rgba(12,10,8,.75))}
.cd .art .hl{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
             width:70%;aspect-ratio:1;pointer-events:none;opacity:.5;transition:opacity .35s}
.cd.open .art .hl{opacity:0}
.cd .art .hl circle{fill:none;stroke:currentColor;stroke-width:.7}
/* ★ 이름판(名牌) — 그림 밖에 둔다.
   예전엔 그림 위에 얹었는데, 항목을 열면 그림이 16:9로 줄면서 이름판까지 같이 눌렸다.
   폰에서 16:9는 세로 220px뿐이라 이름·선·부제가 서로를 먹었다.
   판을 그림 밖으로 빼면 그림이 아무리 줄어도 이름은 제 자리를 지킨다. */
.cd .plate{position:relative;background:#0F0D09;border-bottom:1px solid var(--line);
           padding:13px 16px 12px;text-align:center;min-height:78px}
.cd .plate .nm{font-family:var(--serif);font-size:26px;font-weight:800;line-height:1.15;
               color:var(--baek);word-break:keep-all}
.cd .plate .rule{width:70px;height:1px;margin:8px auto 7px;opacity:.6}
.cd .plate .sub{font-size:10.5px;font-weight:600;letter-spacing:.22em}
.cd .plate .st{position:absolute;left:14px;top:14px;font-size:13px;color:var(--hwang);letter-spacing:1px}
.cd .plate .sil{position:absolute;right:13px;top:13px;font-family:var(--serif);font-size:10px;
                color:var(--hwang);border:1px solid var(--hwang);padding:2px 7px}
.cd .x{position:absolute;right:9px;top:9px;width:30px;height:30px;z-index:9;color:var(--baek);
       background:rgba(0,0,0,.6);border:1px solid var(--line);font-size:14px}

.cd details{border-top:1px solid var(--line)}
.cd summary{padding:13px 16px;font-family:var(--serif);font-size:13.5px;font-weight:700;
            cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.cd summary::-webkit-details-marker{display:none}
.cd summary::after{content:"+";margin-left:auto;color:var(--dim);font-size:16px}
.cd details[open] summary::after{content:"−"}
.cd summary .k{font-size:9px;letter-spacing:.22em;color:var(--dim);font-weight:400;flex:0 0 42px}
.cd summary.lk{color:#5C5347}
.cd summary.lk .k{color:var(--jeok)}
.cd .bd{padding:0 16px 15px 68px;font-size:12.5px;line-height:1.9;color:var(--dim)}
.cd .bd .t{font-family:var(--serif);font-size:14px;color:var(--baek);font-weight:700}
.cd .bd .t.hw{color:var(--hwang)} .cd .bd .t.jk{color:var(--jeok)}
.cd .num{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.cd .num span{font-size:10.5px;padding:2px 8px;border:1px solid var(--line);color:var(--baek);
              font-family:var(--serif)}
.cd .num span b{color:var(--hwang);font-weight:400}
.cd .lockbar{margin-top:8px;padding:9px 11px;border:1px dashed var(--line);background:#12100B}
.cd .lockbar .l1{font-size:11.5px;color:var(--jeok);font-family:var(--serif)}
.cd .lockbar .l2{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.7}
.cd .src{font-family:var(--serif);border-left:2px solid var(--line);padding-left:11px}
.cd .src b{color:var(--hwang);font-weight:400}

/* ── 던전 목록 ───────────────────────────── */
.dun{display:flex;align-items:center;gap:11px;padding:12px 13px;
     background:linear-gradient(180deg,var(--heuk2),#100E0A);
     border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--line-hi),var(--sh1);
     margin-bottom:8px;cursor:pointer;transition:.15s}
.dun:active{transform:scale(.99)}
.dun.lock{opacity:.4}
.dun .dl{width:34px;height:34px;display:grid;place-items:center;font-family:var(--serif);
         font-size:11px;font-weight:800;border:1px solid var(--line);flex-shrink:0}
.dun .dn{font-family:var(--serif);font-size:14px;font-weight:700}
.dun .dm{font-size:10.5px;color:var(--dim);margin-top:2px}
.dun .dc{margin-left:auto;text-align:right;font-size:10.5px;color:var(--dim);flex-shrink:0}
.dun .dc b{display:block;color:#D98B3A;font-size:12.5px;font-family:var(--serif)}
.tag{display:inline-block;font-size:9.5px;padding:1px 6px;border:1px solid var(--line);
     color:var(--dim);margin-left:4px}
.tag.ui{border-color:var(--jeok);color:var(--jeok)}

/* ── 전투 로그 ───────────────────────────── */
.log{background:#0A0806;border:1px solid var(--line);padding:11px;max-height:230px;
     overflow-y:auto;font-size:12px;line-height:1.75;font-family:var(--serif);
     box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
.log div{padding:2px 0;opacity:0;animation:pop .3s forwards}
@keyframes pop{to{opacity:1}}
.log .u{color:var(--hwang);font-weight:700}
.log .c{color:var(--jeok);font-weight:700}
.log .h{color:var(--cheong-l)}
.log .e{color:var(--baek);font-weight:700;border-top:1px solid var(--line);margin-top:5px;padding-top:5px}

.bar{height:4px;background:var(--heuk3);margin:9px 0;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;transition:width .5s}
.bar.buj i{background:linear-gradient(90deg,var(--cheong),var(--jeok))}
.bar.pg i{background:var(--hwang)}
.lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
     font-family:var(--serif);letter-spacing:.05em}

/* ── 고풀이 ─────────────────────────────── */
.gopan{position:relative;padding:24px 4px 18px;margin:14px 0 2px;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 88% at 50% 48%, rgba(200,162,75,calc(.045 + var(--rel,0)*.14)) 0%, transparent 60%)}
.gopan::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 46px rgba(0,0,0,.55);pointer-events:none}
.cord{position:absolute;left:9%;right:9%;top:50%;height:2px;transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,rgba(233,226,210,.5) 13%,rgba(233,226,210,.5) 87%,transparent);
  box-shadow:0 0 9px rgba(233,226,210,.14)}
.knots{position:relative;display:flex;justify-content:space-between;align-items:center;
  padding:0 7%;margin:0;min-height:50px;z-index:1}
.knot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:12px;border:2px solid var(--baek);color:var(--baek);
  background:radial-gradient(circle at 40% 34%,#F3ECDD,#6A6152 96%);box-shadow:var(--sh1);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.45),opacity .4s,box-shadow .3s,color .3s,border-color .3s}
.knot.now{border-color:var(--jeok);color:#fff;background:radial-gradient(circle at 40% 34%,#E8C9C4,#7A231B 96%);
  box-shadow:var(--glow-j);animation:knotpulse 1s infinite alternate}
.knot.done{border-color:var(--hwang);color:var(--hwang);background:radial-gradient(circle,rgba(200,162,75,.18),transparent 70%);
  box-shadow:var(--glow-h);transform:scale(.6);opacity:.5}
@keyframes knotpulse{to{box-shadow:0 0 22px rgba(206,58,42,.82)}}
.pull{width:100%;padding:19px;margin-top:2px;background:linear-gradient(180deg,var(--heuk2),#100E0A);
  border:1px solid var(--hwang);border-radius:9px;box-shadow:inset 0 1px 0 var(--gold-in),var(--sh1);
  font-family:var(--serif);font-size:15.5px;letter-spacing:.16em;color:var(--hwang-l)}
.pull:active{transform:translateY(1px);box-shadow:inset 0 2px 7px rgba(0,0,0,.5)}
.pull:disabled{opacity:.5;border-color:var(--line);color:var(--dim);box-shadow:none}
.gp-avg{font-size:10.5px;color:var(--dim);text-align:center;margin-top:11px;font-family:var(--serif);letter-spacing:.06em}
.salpuri{position:absolute;inset:0;left:-115%;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(233,226,210,.72) 50%,transparent)}
.salpuri.on{animation:sweep 1.15s cubic-bezier(.6,0,.34,1) forwards}
@keyframes sweep{to{left:115%}}

/* ── 굿 결과 ─────────────────────────────── */
.pull-res{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.rates{font-size:10.5px;color:var(--dim);line-height:1.8;font-family:var(--serif);
       border-top:1px solid var(--line);margin-top:11px;padding-top:9px}

/* ── 발 ─────────────────────────────────── */
/* ══ 길 — 목록 → 지도 → 보스 ══════════════════════
   목록에서 던전을 누르면 지도가 펼쳐지며 그 자리로 당겨지고,
   그 위로 보스가 화면을 채운다. 새로 그릴 그림이 없다 —
   보스 카드가 곧 그 곳의 기운이다. */
#gilMap{position:fixed;inset:0;z-index:60;background:#0A0806 url('redraw/goheung-map.webp') center/cover no-repeat;
  opacity:0;visibility:hidden;transition:opacity .45s}
#gilMap.on{opacity:1;visibility:visible}
#gilMap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,12,.18),rgba(9,5,9,.42));pointer-events:none}
#gilMap svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#mapg{transition:transform .9s cubic-bezier(.25,.9,.25,1)}
.pin{cursor:pointer;outline:none}
.pin .lab{font-family:var(--serif);font-size:10px;font-weight:700;
  paint-order:stroke;stroke:rgba(10,8,6,.92);stroke-width:3.2px}
.pin .lv{font-family:var(--serif);font-size:9px;font-weight:800}
.pin.lock{opacity:.32}
#gate{position:fixed;inset:0;z-index:70;background:#000;
  opacity:0;visibility:hidden;transition:opacity .55s}
#gate.on{opacity:1;visibility:visible}
#gate .art{position:absolute;inset:0}
#gate .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 20%;transform:scale(1.1);
  animation:breathe 10s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.10)}to{transform:scale(1.18)}}
#gate .vig{position:absolute;inset:0;
  background:radial-gradient(74% 44% at 50% 30%, transparent, rgba(0,0,0,.5) 100%),
             linear-gradient(transparent 30%, rgba(10,8,6,.9) 58%, #0A0806 84%)}
#gate .where{position:absolute;left:0;right:0;top:22px;text-align:center;z-index:3;
  font-size:10px;letter-spacing:.42em;color:var(--dim)}
#gate .bn{position:absolute;left:0;right:0;top:41%;text-align:center;z-index:3;
  font-family:var(--serif);font-size:32px;font-weight:800;
  text-shadow:0 3px 22px #000, 0 0 44px rgba(0,0,0,.92)}
#gate .bs{position:absolute;left:0;right:0;top:calc(41% + 42px);text-align:center;z-index:3;
  font-size:10.5px;font-weight:600;letter-spacing:.26em;text-shadow:0 1px 8px #000}
#gate .kings{position:absolute;left:16px;right:16px;top:calc(41% + 76px);z-index:3;display:flex;gap:3px}
#gate .kings i{flex:1;height:3px;background:#3A1512}
#gate .kings i.done{background:var(--jeok)}
#gate .kings .kl{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:9px;
  color:#E08A80;letter-spacing:.2em;font-family:var(--serif)}
#gate .bd{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 18px 18px;
  max-width:600px;margin:0 auto}
#gate .dn{font-family:var(--serif);font-size:17px;font-weight:700}
#gate .m{font-size:10.5px;color:var(--dim);margin-top:3px}
#gate .desc{font-family:var(--serif);font-size:13px;line-height:1.95;margin-top:11px;
  border-left:2px solid var(--hwang);padding-left:12px;opacity:.94}
#gate .ways{display:flex;gap:6px;margin-top:15px}
#gate .ways button{flex:1;padding:13px 0;font-family:var(--serif);font-size:13px;
  letter-spacing:.14em;border:1px solid var(--line);background:rgba(16,13,9,.9);color:var(--dim)}
#gate .ways button.go{background:linear-gradient(180deg,var(--hwang-l),var(--hwang));color:var(--heuk);
  border-color:var(--hwang);font-weight:800;flex:1.4;box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h)}
#gate .ways button:disabled{opacity:.35}
#gate .ways button.nx{color:var(--baek)}
#gate .err{margin-top:9px}
/* 포인트 선택 상세: 위는 실제 고흥 지도, 아래는 던전 정보 */
#gate .gate-map{position:absolute;left:0;right:0;top:0;height:43%;z-index:1;background:linear-gradient(180deg,rgba(4,10,14,.12),rgba(5,6,9,.72)),url('redraw/goheung-map.webp') center/cover no-repeat;border-bottom:1px solid #80633d;box-shadow:0 12px 35px #0009}
#gate .gate-map:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 15%,rgba(0,0,0,.18) 70%,#08080b 100%)}
#gate .gate-cross{position:absolute;left:50%;top:48%;z-index:2;transform:translate(-50%,-50%);width:30px;height:30px;border:1px solid #e6b65d;border-radius:50%;display:grid;place-items:center;color:#ffe2a0;background:#2a1a1299;box-shadow:0 0 0 6px #e9b45d2b,0 0 22px #efb453}
#gate .gate-map-caption{position:absolute;top:13px;left:16px;z-index:2;color:#f0cf8a;font:700 11px var(--serif);letter-spacing:.2em;text-shadow:0 2px 8px #000}
#gate .art{left:auto;right:14px;top:38%;bottom:auto;width:104px;height:142px;border:1px solid #c9994e;border-radius:8px;z-index:5;box-shadow:0 7px 20px #000;overflow:hidden}
#gate .art img{transform:none;animation:none;object-position:center 20%}
#gate .vig{background:linear-gradient(180deg,transparent 32%,rgba(7,6,9,.5) 43%,#0a0806 58%,#0a0806 100%);z-index:2}
#gate .where{top:45%;left:18px;right:145px;text-align:left;z-index:6}
#gate .bn{top:calc(45% + 27px);left:18px;right:145px;text-align:left;font-size:23px;z-index:6}
#gate .bs{top:calc(45% + 61px);left:18px;right:145px;text-align:left;z-index:6}
#gate .kings{top:calc(45% + 94px);left:18px;right:145px;z-index:6}
#gate .bd{background:linear-gradient(180deg,rgba(10,8,6,.72),#0a0806 14%);padding-top:18px;z-index:7}
/* ══ 전투 연출 ═══════════════════════════════════
   서버가 로그를 통째로 내려준다. 클라이언트는 계산이 없다.
   연출은 순수한 재생 문제다 — 무엇을 언제 보여줄지만 정한다. */
#stage{position:relative;min-height:430px;margin-top:10px;overflow:hidden;
  border:1px solid var(--line);background:#0C0A08;
  background-image:radial-gradient(ellipse 130% 45% at 50% 0%,#1E1912 0%,transparent 65%)}
#stage.shake{animation:shk .34s}
@keyframes shk{0%,100%{transform:translate(0)}15%{transform:translate(-5px,3px)}
  30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,-2px)}
  60%{transform:translate(4px,2px)}80%{transform:translate(-2px,1px)}}
#flash{position:absolute;inset:0;z-index:13;pointer-events:none;opacity:0}
#flash.on{animation:fl .38s}
@keyframes fl{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
.rank{position:absolute;left:8px;right:8px;display:grid;
  grid-template-columns:repeat(5,1fr);gap:5px;z-index:5}
.rank.foes{top:10px;align-items:start}
.rank.usr{bottom:10px;align-items:end}
.bu{position:relative;background:#000;border:1px solid var(--line);overflow:hidden;
  aspect-ratio:3/4;transition:transform .3s cubic-bezier(.2,1.4,.4,1),filter .3s,opacity .3s}
.bu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.bu .bd2{position:absolute;left:0;top:0;bottom:0;width:2px;z-index:2}
.bu .bn2{position:absolute;left:0;right:0;bottom:0;padding:10px 2px 3px;font-size:8px;
  font-family:var(--serif);font-weight:700;text-align:center;z-index:2;
  background:linear-gradient(transparent,rgba(0,0,0,.94))}
.bu .hb{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:#3A0F0C;z-index:3}
.bu .hb i{display:block;height:100%;background:var(--jeok);transition:width .4s}
.bu .sb{position:absolute;left:0;right:0;bottom:2.5px;height:2px;background:var(--cheong-l);
  z-index:3;width:0;transition:width .3s}
.bu .lit{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,#fff,transparent 65%)}
.bu .lit.on{animation:lit .28s}
@keyframes lit{0%{opacity:0}20%{opacity:.75}100%{opacity:0}}
.bu .stg{position:absolute;left:2px;top:2px;z-index:5;display:flex;flex-direction:column;gap:2px}
.bu .stg span{font-size:7px;font-family:var(--serif);padding:0 3px;border:1px solid;
  background:rgba(0,0,0,.7)}
/* ★ 나선다 — 행동하는 자가 앞으로 나와 커진다. 신이 내리는 것과 같다. */
.bu.act{z-index:11;transform:scale(1.9);
  box-shadow:0 0 0 1px var(--hwang),0 0 40px rgba(200,162,75,.45),0 14px 40px rgba(0,0,0,.9)}
.foes .bu.act{transform-origin:center top}
.usr .bu.act{transform-origin:center bottom}
.bu.act .bn2{font-size:5px}
.bu.hit{animation:bhit .3s}
@keyframes bhit{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}
  55%{transform:translate(4px,-2px)}80%{transform:translate(-2px,0)}}
.bu.hit.act{animation:bhitA .3s}
@keyframes bhitA{0%,100%{transform:scale(1.9)}50%{transform:scale(1.9) translate(4px,-2px)}}
.bu.gone{filter:grayscale(.9) brightness(.5);opacity:.72;transform:translateY(6px) scale(.94)}
.bu.gone::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:5}
.bu.rage{box-shadow:0 0 0 1px var(--jeok),0 0 28px rgba(184,53,46,.6);
  animation:rg 1.1s infinite alternate}
@keyframes rg{from{filter:none}to{filter:brightness(1.22) saturate(1.3)}}
.bu.tmp{border-style:dashed;opacity:.85}
.fly{position:absolute;z-index:12;font-family:var(--serif);font-weight:800;pointer-events:none;
  animation:flyu 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes flyu{0%{opacity:0;transform:translateY(8px) scale(.8)}
  16%{opacity:1;transform:translateY(-4px) scale(1.15)}
  100%{opacity:0;transform:translateY(-48px) scale(1)}}

/* ── 역경직(逆硬直) — 급소가 들어간 순간 판이 한 번 굳는다.
      굳는 동안 모든 움직임을 멈춰 무게를 만들고, 풀리며 반동이 온다. ── */
#stage{transition:filter .09s ease, transform .09s ease}
#stage.frz{filter:brightness(1.14) contrast(1.1) saturate(.94);transform:scale(1.012)}
/* 굳는 것은 '판'이다. 획과 수치는 굳지 않는다 — 그게 멈추면 타격이 안 읽힌다. */
#stage.frz *:not(.swd):not(.fly){animation-play-state:paused!important}

/* ── 검풍(劍風) — 치는 쪽에서 맞는 쪽으로 한 획을 긋는다.
      평타는 금빛 가는 획, 급소는 진사빛 굵은 획. ── */
.swd{position:absolute;z-index:12;height:3px;pointer-events:none;transform-origin:left center;
  background:linear-gradient(90deg,transparent,var(--hwang-l) 34%,#FFF6E2 62%,transparent);
  filter:blur(.4px) drop-shadow(0 0 9px rgba(200,162,75,.7));
  animation:swd .26s cubic-bezier(.16,1,.3,1) forwards}
.swd.c{height:7px;
  background:linear-gradient(90deg,transparent,#FFEAD0 22%,var(--jeok) 58%,transparent);
  filter:blur(1px) drop-shadow(0 0 15px rgba(206,58,42,.78))}
@keyframes swd{0%{opacity:0;clip-path:inset(0 100% 0 0)}
  16%{opacity:1}
  70%{opacity:1;clip-path:inset(0 0 0 0)}
  100%{opacity:0;clip-path:inset(0 0 0 0)}}

/* ── 치명타 수치는 무게가 다르다 — 크게 박고, 진사 그림자를 깐다 ── */
.fly.hv{font-size:26px;letter-spacing:-.5px;
  text-shadow:0 2px 0 rgba(206,58,42,.85),0 0 18px rgba(0,0,0,.95);
  animation:flyh 1.05s cubic-bezier(.16,1,.3,1) forwards}
@keyframes flyh{0%{opacity:0;transform:translateY(6px) scale(2.1)}
  14%{opacity:1;transform:translateY(-2px) scale(1)}
  62%{opacity:1;transform:translateY(-18px) scale(1)}
  100%{opacity:0;transform:translateY(-52px) scale(.9)}}
/* ── 합(合) 예보 — 이 한 대에 상성이 어떻게 걸렸는지 한 마디로 읽힌다.
      서버가 따로 주는 값이 아니라 이 게임의 상성 규칙(BEATS)에서 낸다.
      그래서 화면에 뜬 말과 실제로 들어간 피해가 어긋나지 않는다. ── */
#clash{position:absolute;left:0;right:0;top:36%;z-index:14;text-align:center;pointer-events:none;
  font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:.2em;opacity:0}
#clash .h{display:block;margin-top:3px;font-size:13px;letter-spacing:.34em;opacity:.7}
#clash.y{color:var(--hwang-l);text-shadow:0 0 18px rgba(200,162,75,.7),0 2px 12px #000}
#clash.j{color:var(--jeok);text-shadow:0 0 20px rgba(206,58,42,.75),0 2px 12px #000}
#clash.on{animation:clsh .9s cubic-bezier(.16,1,.3,1)}
@keyframes clsh{0%{opacity:0;transform:scale(.74)}18%{opacity:1;transform:scale(1.05)}
  64%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

/* ── 부적(符籍) 파편 — 급소가 들어가면 부적이 찢겨 날린다 ── */
.bjk{position:absolute;z-index:12;width:15px;height:34px;pointer-events:none;
  background:linear-gradient(180deg,#8C2318,#57160F);border:1px solid rgba(228,199,120,.45);
  color:var(--hwang-l);font-family:var(--serif);font-size:8px;line-height:1.2;text-align:center;
  padding-top:3px;box-shadow:0 0 10px rgba(206,58,42,.4);
  animation:bjk .62s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes bjk{0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.9)}
  100%{opacity:0;filter:blur(2px);
    transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.06)}}

/* ── 제사상 기물 — 판 뒤에 놓인다. 자리를 뺏지 않고 전황만 말한다.
      초(걸음)와 향심(부정)은 위 진행바에 이미 있으므로 여기 두지 않는다. ── */
#altar{position:absolute;inset:0;z-index:1;pointer-events:none}
/* 놋저울 — 양쪽이 성한 정도를 견주어 기운다 */
#nsc{position:absolute;left:50%;top:46%;width:196px;height:2px;margin-left:-98px;
  transform-origin:center center;opacity:.22;
  transition:transform .55s cubic-bezier(.16,1,.3,1)}
#nsc i{position:absolute;display:block}
#nsc .beam{left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,#6B5A32 13%,#9C8555 50%,#6B5A32 87%,transparent)}
#nsc .post{left:50%;top:-30px;width:2px;height:30px;margin-left:-1px;
  background:linear-gradient(#9C8555,rgba(156,133,85,0))}
#nsc .str{top:2px;width:1px;height:16px;background:#6B5A32}
#nsc .str.l{left:14px} #nsc .str.r{right:14px}
#nsc .pan{top:18px;width:34px;height:1px;background:#8C7853;box-shadow:0 3px 7px rgba(0,0,0,.6)}
#nsc .pan.l{left:-3px} #nsc .pan.r{right:-3px}
/* 무령(巫鈴) — 신벌이 오면 저 혼자 운다 */
#mury{position:absolute;right:11px;top:9px;width:19px;height:19px;color:#8C7853;
  opacity:.3;transform-origin:top center;transition:opacity .25s}
#mury.on{opacity:.9;color:var(--jeok);animation:mury .09s infinite}
@keyframes mury{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}

#uniq{position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;
  opacity:0;background:rgba(6,5,4,.82)}
#uniq.on{animation:uq 1.5s}
@keyframes uq{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#uniq .who{font-size:11px;letter-spacing:.35em;color:var(--dim);text-align:center}
#uniq .un{font-family:var(--serif);font-size:32px;font-weight:800;margin-top:8px;text-align:center;
  color:var(--hwang-l);text-shadow:0 0 34px rgba(200,162,75,.55)}
#uniq .ur{width:120px;height:1px;background:var(--hwang);margin:11px auto 0;opacity:.5}
#uniq .ut{font-family:var(--serif);font-size:12.5px;color:var(--baek);opacity:.9;margin-top:9px;
  text-align:center;padding:0 26px;line-height:1.8}
#blog{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);
  z-index:6;height:52px;overflow:hidden;font-family:var(--serif);font-size:12.5px;
  line-height:1.75;color:var(--dim);text-align:center}
#blog div{opacity:0;animation:lp .22s forwards}
@keyframes lp{to{opacity:1}}
#blog .a{color:var(--baek)} #blog .c{color:#E08A80;font-weight:700}
#blog .u2{color:var(--hwang-l);font-weight:700} #blog .h{color:var(--cheong-l)}
#blog .r{color:var(--jeok);font-weight:700}
.bctl{display:flex;gap:6px;margin-top:10px}
.bctl button{flex:1;padding:12px 0;font-family:var(--serif);font-size:13px;letter-spacing:.16em;
  border:1px solid var(--line);background:#100D09;color:var(--dim)}
.bctl button.main{background:linear-gradient(180deg,var(--hwang-l),var(--hwang));color:var(--heuk);
  border-color:var(--hwang);font-weight:800;flex:1.6;box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h)}
.bctl button.on{color:#E08A80;border-color:var(--jeok)}
.bctl button:disabled{opacity:.35}
/* ══ 보스 등장씬 — 광배(光背)가 곧 격(格)이다 ═══════
   무신도에서 격이 높은 신일수록 광배가 크다.
   그걸 시간으로 옮겼다. 잡귀는 광배가 없고, 대신은 6초가 걸린다.
   설명하지 않는다. 등장 길이로 안다. */
#ent{position:fixed;inset:0;z-index:80;background:#000;
  opacity:0;visibility:hidden;transition:opacity .5s}
#ent.on{opacity:1;visibility:visible}
#ent .sc{position:absolute;inset:0;overflow:hidden}
#ent .smoke{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:
    radial-gradient(42% 26% at 24% 82%, rgba(200,180,150,.16), transparent 68%),
    radial-gradient(36% 22% at 74% 74%, rgba(200,180,150,.11), transparent 70%),
    radial-gradient(50% 30% at 50% 96%, rgba(200,180,150,.13), transparent 72%);
  animation:smIn 1.4s .1s forwards, drft 16s 1.5s ease-in-out infinite alternate}
@keyframes smIn{to{opacity:1}}
@keyframes drft{from{transform:translateY(0) scale(1)}to{transform:translateY(-22px) scale(1.08)}}
#ent .halo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  width:110%;max-width:560px;aspect-ratio:1;pointer-events:none}
#ent .halo circle,#ent .halo path{fill:none;stroke:currentColor;
  stroke-dasharray:var(--L);stroke-dashoffset:var(--L);
  animation:hdraw var(--d) cubic-bezier(.3,.7,.2,1) forwards}
@keyframes hdraw{to{stroke-dashoffset:0}}
#ent .halo .gw{filter:drop-shadow(0 0 12px currentColor)}
#ent .boss{position:absolute;inset:0;opacity:0;
  animation:brise var(--rise) cubic-bezier(.2,.8,.25,1) forwards}
#ent .boss img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 16%;transform:scale(1.2)}
@keyframes brise{
  0%{opacity:0;transform:scale(1.14) translateY(22px);filter:brightness(.2) blur(6px)}
  60%{opacity:1;filter:brightness(1) blur(0)}
  100%{opacity:1;transform:scale(1) translateY(0);filter:none}}
#ent .vg{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 46% at 50% 32%, transparent, rgba(0,0,0,.62) 100%),
             linear-gradient(transparent 40%, rgba(6,5,4,.9) 74%, #000 96%)}
#ent .bnm{position:absolute;left:0;right:0;top:52%;text-align:center;z-index:5;
  font-family:var(--serif);font-size:38px;font-weight:800;letter-spacing:.05em;
  text-shadow:0 3px 26px #000, 0 0 54px rgba(0,0,0,.95);
  clip-path:inset(0 100% 0 0);
  animation:brush .7s var(--nd) cubic-bezier(.5,0,.15,1) forwards}
@keyframes brush{to{clip-path:inset(0 0 0 0)}}
#ent .brl{position:absolute;left:50%;top:calc(52% + 42px);transform:translateX(-50%);
  width:0;height:1px;z-index:5;opacity:.6;
  animation:ruleW .6s calc(var(--nd) + .35s) forwards}
@keyframes ruleW{to{width:110px}}
#ent .bsb{position:absolute;left:0;right:0;top:calc(52% + 52px);text-align:center;z-index:5;
  font-size:11px;font-weight:600;letter-spacing:.34em;opacity:0;text-shadow:0 1px 8px #000;
  animation:efi .6s calc(var(--nd) + .5s) forwards}
@keyframes efi{to{opacity:1}}
#ent .say{position:absolute;left:22px;right:22px;bottom:104px;z-index:5;text-align:center;
  font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--baek);opacity:0;
  text-shadow:0 2px 14px #000;max-width:560px;margin:0 auto;
  animation:sayIn .8s calc(var(--nd) + 1.0s) forwards}
@keyframes sayIn{from{opacity:0;transform:translateY(8px)}to{opacity:.95;transform:none}}
#ent .say::before,#ent .say::after{content:"";display:block;width:26px;height:1px;
  background:currentColor;opacity:.3;margin:0 auto 11px}
#ent .say::after{margin:11px auto 0}
#ent .skip{position:absolute;right:12px;top:12px;z-index:9;padding:7px 13px;
  border:1px solid var(--line);background:rgba(0,0,0,.6);color:var(--dim);
  font-family:var(--serif);font-size:11px;letter-spacing:.18em}
#ent .go{position:absolute;left:16px;right:16px;bottom:24px;z-index:9;padding:14px 0;
  background:var(--hwang);color:var(--heuk);border:none;max-width:560px;margin:0 auto;
  font-family:var(--serif);font-weight:800;font-size:14px;letter-spacing:.14em;
  opacity:0;animation:efi .6s calc(var(--nd) + 1.6s) forwards}
/* 격노 — 같은 얼굴이 다시 온다 */
#ragel{position:absolute;left:0;right:0;top:44%;z-index:14;text-align:center;pointer-events:none;
  font-family:var(--serif);font-size:20px;font-weight:800;color:#E08A80;opacity:0;
  text-shadow:0 0 30px rgba(184,53,46,.9), 0 2px 12px #000;padding:0 24px;line-height:1.7}
#ragel.on{animation:rgl 1.6s}
@keyframes rgl{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:scale(1)}
  75%{opacity:1}100%{opacity:0}}
/* 넘기기 — 카드 상세 · 보스 게이트 공통 */
.arw{position:absolute;top:0;bottom:0;width:44px;z-index:8;background:none;border:0;
  color:rgba(237,231,218,.5);font-size:20px;font-family:var(--serif);
  display:grid;place-items:center;transition:.15s}
.arw:active{color:var(--hwang);background:rgba(0,0,0,.35)}
.arw:disabled{opacity:.18}
.arw.l{left:0} .arw.r{right:0}
.cd .arw{top:0;height:100%;pointer-events:none}
.cd .arw span{pointer-events:auto;padding:14px 8px;background:rgba(10,8,6,.55);
  border:1px solid var(--line);line-height:1}
.cd .nvi{position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:8;
  font-family:var(--serif);font-size:10px;color:var(--dim);letter-spacing:.14em;
  text-shadow:0 1px 6px #000;pointer-events:none}
/* ══ 오프닝 — 향(香) ══════════════════════════════
   굿은 향을 사르는 데서 시작한다. 그리고 향은 이 게임의 행동력이다.
   첫 화면이 곧 규칙의 설명이다. 아무도 설명하지 않았는데 향이 뭔지 알게 된다.
   그리고 향은 탄다. 18초에 걸쳐 짧아진다 — 사라진다는 것, 그게 이 게임의 주제다. */
#open{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;
  transition:opacity .9s}
#open.gone{opacity:0;pointer-events:none}
#open .plume{position:absolute;left:0;right:0;bottom:120px;height:74%;z-index:2;opacity:0;
  background:
    radial-gradient(26% 44% at 50% 96%, rgba(210,195,170,.22), transparent 72%),
    radial-gradient(16% 34% at 44% 66%, rgba(210,195,170,.16), transparent 74%),
    radial-gradient(20% 40% at 57% 40%, rgba(210,195,170,.12), transparent 76%);
  animation:pfi 2.4s .4s forwards, sway 11s 2s ease-in-out infinite alternate}
@keyframes pfi{to{opacity:1}}
@keyframes sway{from{transform:translateX(-10px) scaleX(1)}to{transform:translateX(12px) scaleX(1.12)}}
#open .stick{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:3px;height:210px;
  background:linear-gradient(180deg,#5C4A2E,#2A2118);z-index:3;
  animation:burn 90s linear forwards}
@keyframes burn{to{height:96px}}
#open .ember{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:#E08A80;z-index:4;
  box-shadow:0 0 16px 5px rgba(224,138,128,.75);
  animation:eglow 2.4s ease-in-out infinite alternate, burn2 90s linear forwards}
@keyframes eglow{from{opacity:.65;transform:translateX(-50%) scale(.9)}
  to{opacity:1;transform:translateX(-50%) scale(1.15)}}
@keyframes burn2{to{bottom:96px}}

#open .ttl{position:absolute;left:0;right:0;top:22%;text-align:center;z-index:8}
#open .ttl .k{font-family:var(--serif);font-size:50px;font-weight:800;letter-spacing:.14em;
  color:var(--baek);text-shadow:0 0 44px rgba(0,0,0,.9);
  clip-path:inset(0 100% 0 0);animation:obrush 1s 1.2s cubic-bezier(.5,0,.15,1) forwards}
@keyframes obrush{to{clip-path:inset(0 0 0 0)}}
#open .ttl .h{font-family:var(--serif);font-size:14px;letter-spacing:.5em;color:var(--hwang);
  margin-top:7px;opacity:0;animation:ofi .8s 1.9s forwards}
#open .ttl .rl{width:0;height:1px;background:var(--hwang);margin:15px auto 0;opacity:.55;
  animation:orw .8s 2.2s forwards}
@keyframes orw{to{width:140px}}
#open .ttl .y{font-family:var(--serif);font-size:12px;letter-spacing:.34em;color:var(--dim);
  margin-top:13px;opacity:0;animation:ofi .9s 2.5s forwards}
#open .ttl .ln{font-family:var(--serif);font-size:13px;color:#A99C86;margin-top:19px;line-height:1.9;
  opacity:0;animation:ofi 1s 3.1s forwards;padding:0 32px}
@keyframes ofi{to{opacity:1}}

#open .btns{position:absolute;left:22px;right:22px;bottom:38px;z-index:9;opacity:0;
  max-width:520px;margin:0 auto;animation:ofi .9s 3.8s forwards}
#open .btns button{display:block;width:100%;padding:15px;font-family:var(--serif);
  font-size:15px;font-weight:800;letter-spacing:.2em;border:1px solid var(--hwang);
  background:none;color:var(--hwang)}
#open .btns button.p{background:linear-gradient(180deg,var(--hwang-l),var(--hwang));color:var(--heuk);margin-bottom:8px;box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h)}
#open .btns .v{text-align:center;font-size:10px;color:#5C5347;margin-top:12px;letter-spacing:.1em;
  font-family:var(--serif)}
#open .nick{width:100%;padding:13px;background:rgba(10,8,6,.8);border:1px solid var(--line);
  color:var(--baek);font-family:var(--serif);font-size:16px;margin-bottom:9px;text-align:center;
  letter-spacing:.1em}
#open .nick:focus{outline:none;border-color:var(--hwang)}
#open .err{margin-bottom:8px}
/* ══ 거리(巨里) — 초보를 데려가는 손 ═════════════
   굿은 「거리」로 나뉜다. 부정거리 → 초가망석 → … → 뒷전.
   이야기가 아니라 손이다. 거리마다 규칙 하나를 가르치고,
   다음에 뭘 할지 알려준다. 설명서가 아니라 할머니가 하는 말로. */
#geo{position:fixed;inset:0;z-index:90;background:#000;
  opacity:0;visibility:hidden;transition:opacity .6s}
#geo.on{opacity:1;visibility:visible}
#geo .bg{position:absolute;inset:0;opacity:0;transition:opacity 1.4s}
#geo .bg.on{opacity:.30}
#geo .bg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;
  filter:blur(2px) brightness(.7)}
#geo .vg{position:absolute;inset:0;
  background:radial-gradient(72% 46% at 50% 40%, transparent, rgba(2,2,2,.92) 100%)}
#geo .gn{position:absolute;left:0;right:0;top:26px;text-align:center;z-index:9;
  font-family:var(--serif);font-size:10.5px;letter-spacing:.42em;color:var(--dim)}
#geo .sk{position:absolute;right:11px;top:11px;z-index:12;padding:6px 12px;
  border:1px solid var(--line);background:rgba(0,0,0,.6);color:var(--dim);
  font-family:var(--serif);font-size:10.5px;letter-spacing:.18em}
#geo .lines{position:absolute;left:26px;right:26px;top:50%;transform:translateY(-50%);z-index:6;
  max-width:560px;margin:0 auto}
#geo .ln{font-family:var(--serif);font-size:17px;line-height:2.1;color:var(--baek);
  opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s;margin-bottom:5px}
#geo .ln.on{opacity:.95;transform:none}
#geo .ln.say{color:var(--hwang-l);font-size:19px;padding-left:14px;
  border-left:2px solid var(--hwang);margin:15px 0}
#geo .ln.dim{color:#7E7364;font-size:14.5px}
#geo .teach{position:absolute;left:22px;right:22px;bottom:96px;z-index:9;max-width:560px;
  margin:0 auto;padding:13px 15px;border:1px dashed var(--line);background:rgba(16,13,9,.85);
  opacity:0;transition:opacity .7s}
#geo .teach.on{opacity:1}
#geo .teach .k{font-family:var(--serif);font-size:9.5px;letter-spacing:.3em;color:var(--dim)}
#geo .teach .v{font-family:var(--serif);font-size:14px;color:var(--hwang-l);margin-top:6px;
  line-height:1.8}
#geo .cue{position:absolute;left:0;right:0;bottom:34px;text-align:center;z-index:9;
  font-family:var(--serif);font-size:11px;color:#5C5347;letter-spacing:.2em;
  animation:gblink 2.4s infinite}
@keyframes gblink{0%,100%{opacity:.25}50%{opacity:.8}}
#geo .go{position:absolute;left:22px;right:22px;bottom:26px;z-index:10;max-width:560px;margin:0 auto;
  padding:14px;background:linear-gradient(180deg,var(--hwang-l),var(--hwang));color:var(--heuk);border:0;
  font-family:var(--serif);font-weight:800;font-size:14px;letter-spacing:.14em;
  box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h);opacity:0;transition:opacity .6s}
#geo .go.on{opacity:1}
#geo .tap{position:absolute;inset:0;z-index:8;background:none;border:0}

/* 길잡이 — 본향에 늘 떠 있다. 다음에 뭘 할지 모르는 순간이 없게. */
.guide{border:1px solid var(--hwang);background:linear-gradient(180deg,#1B160E,#100C07);
  box-shadow:var(--sh1);padding:14px 16px;margin-bottom:11px;position:relative;overflow:hidden}
.guide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hwang);box-shadow:var(--glow-h)}
.guide .k{font-family:var(--serif);font-size:9.5px;letter-spacing:.3em;color:var(--dim)}
.guide .t{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--hwang-l);margin-top:5px}
.guide .d{font-size:12px;color:var(--dim);line-height:1.8;margin-top:6px}
.guide .b{display:block;width:100%;margin-top:11px;padding:11px;
  background:linear-gradient(180deg,var(--hwang-l),var(--hwang));
  color:var(--heuk);border:0;font-family:var(--serif);font-weight:800;font-size:13.5px;
  letter-spacing:.12em;box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h)}
/* ══ 2.5D 시차 ═══════════════════════════════════
   검은 배경에 발광하는 형체 — 밝은 곳이 앞이고 검은 곳은 무한히 뒤다.
   밝기가 곧 깊이(depth)다. 깊이 맵을 따로 저장하지 않는다.
   브라우저가 그림을 받는 순간 그 자리에서 계산한다. 새 파일 0개. */
.px{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.px-off{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(11,10,8,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);box-shadow:0 -1px 0 var(--line-hi),0 -8px 24px rgba(0,0,0,.5);
    display:flex;padding-bottom:var(--safe-b);max-width:560px;margin:0 auto}
@media(min-width:900px){ nav{max-width:960px} }
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;
           align-items:center;gap:3px;color:var(--dim);transition:.15s;position:relative}
nav button.on{color:var(--hwang)}
nav button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;background:var(--hwang);box-shadow:var(--glow-h)}
nav .ni{font-size:17px;line-height:1}
nav .nt{font-size:9.5px;font-family:var(--serif);letter-spacing:.05em}

/* ── 덮개 ───────────────────────────────── */
/* 해금 때는 같은 천을 화면 전체로 쓴다. 고풀이의 .salpuri 와 같은 결·같은 키프레임이다.
   (v29 에서 #salp 를 따로 만들었던 것을 되돌린다 — 같은 연출을 두 벌 둘 이유가 없다.) */
.salpuri.full{position:fixed;z-index:70}
/* 무신도 회랑 — 노드 한 줄씩 */
.gbar{height:5px;background:#241E17;margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hwang),var(--hwang-l));transition:width .4s}
.nodes{margin-top:12px;border-top:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.nrow .nn{font-family:var(--serif);font-weight:700;font-size:13px;min-width:64px}
.nrow .nn .nl{margin-left:6px;font-size:10px;color:var(--dim);font-weight:400}
.nrow .nc{flex:1;font-size:11px;color:var(--dim)}
.nrow.on{background:linear-gradient(90deg,rgba(200,162,75,.09),transparent)}
.nrow.on .nn{color:var(--hwang-l)}
.nrow.lk{opacity:.5}
/* 접신 자리 */
.slots{display:flex;gap:7px;margin-top:9px}
.slotbox{flex:1;border:1px dashed var(--line);padding:8px 9px;min-height:46px}
.slotbox.on{border-style:solid;border-color:var(--hwang);
  background:linear-gradient(180deg,rgba(200,162,75,.08),transparent)}
.slotbox .sv{font-family:var(--serif);font-weight:800;font-size:13px;color:var(--hwang-l)}
.slotbox .ss{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.slotbox .empty{font-size:11px;color:#5C5347}

.ov{position:fixed;inset:0;background:rgba(8,6,4,.93);backdrop-filter:blur(3px);
    z-index:50;display:none;place-items:center;padding:16px}
.ov.on{display:grid}
.ov-in{max-width:400px;width:100%;background:var(--heuk2);border:1px solid var(--line);
       max-height:92vh;overflow:auto}
.ov-b{padding:17px 19px 20px}
.x{position:absolute;right:9px;top:9px;width:32px;height:32px;background:rgba(0,0,0,.6);
   border:1px solid var(--line);font-size:16px;z-index:2}
.row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.row dt{font-family:var(--serif);color:var(--dim);min-width:60px;flex-shrink:0;letter-spacing:.08em}
.row dd{line-height:1.6}

.mid{text-align:center;padding:44px 0;color:var(--dim);font-family:var(--serif);letter-spacing:.08em}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--line);
      border-top-color:var(--hwang);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── 리디자인: 가볍고 선명한 카드게임 UI ── */
:root{--heuk:#f5f7fb;--heuk2:#ffffff;--heuk3:#eef1f7;--baek:#202534;--dim:#778096;--line:#e4e8f0;--line-hi:rgba(255,255,255,.9);--hwang:#e09a36;--hwang-l:#f4b957;--cheong:#4a83c4;--cheong-l:#72a9e8;--jeok:#d65a62;--serif:'IBM Plex Sans KR',sans-serif;--sans:'IBM Plex Sans KR',sans-serif;--sh1:0 4px 16px rgba(43,55,82,.07);--sh2:0 10px 28px rgba(43,55,82,.10);--glow-h:0 5px 15px rgba(224,154,54,.18);--glow-j:none}
body{background:#f5f7fb;color:var(--baek);background-image:radial-gradient(circle at 15% 0%,#fff 0,transparent 34%),linear-gradient(135deg,rgba(224,154,54,.035),transparent 45%)}
#app{max-width:620px}.pane{animation:in .16s ease-out}header{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(43,55,82,.06)}.who{color:#202534}.lv{color:#b8781a}.res{color:#687286}.r-h b{color:#d68127}.r-b b{color:#b8781a}.r-y b{color:#687286}
main{padding:16px 16px 88px}h2{font-size:20px;letter-spacing:.02em}.sub{color:#7a8497}.card{background:#fff;border:1px solid var(--line);box-shadow:var(--sh1);border-radius:14px;padding:15px;margin-bottom:12px}.card h3{color:#30394d}.card h3::before{border-radius:3px;background:#e5a33f}.btn{border-radius:10px;background:linear-gradient(135deg,#f2bd63,#dc9130);color:#fff;border:0;box-shadow:var(--glow-h);font-size:13px}.btn.ghost{background:#f3f5f9;color:#536078;border:1px solid #e2e6ee;box-shadow:none}.err{background:#fff1f2;border:1px solid #f2c4c9;color:#b5424c;border-radius:10px}.err b{color:#c54d57}

<style>
/* ══ 정성 게이지 — 신물을 올려 확률을 미리 끌어올린다 ══════════ */
.jeong{margin-top:13px;padding:11px 12px 12px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--heuk2),var(--heuk));box-shadow:inset 0 1px 0 var(--line-hi)}
.jeong.full{border-color:rgba(200,162,75,.4);box-shadow:inset 0 1px 0 var(--gold-in),var(--glow-h)}
.jeong .jhd{display:flex;justify-content:space-between;align-items:baseline;
  font:600 11px var(--sans);color:var(--dim);letter-spacing:.04em}
.jeong .jhd span:first-child{font-family:var(--serif);font-size:13px;color:var(--baek);letter-spacing:.1em}
.jeong .jhd b{color:var(--hwang-l)}
.jeong .jhd i{font-style:normal;color:var(--hwang);font-size:10px}
/* 칸 하나가 신물 하나다. 몇 번 더 올려야 하는지 세지 않고 눈으로 보게 한다. */
.jeong .jbar{display:flex;gap:2px;margin-top:8px;height:7px}
.jeong .jbar i{flex:1;border-radius:2px;background:#241E15;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.jeong .jbar i.on{background:linear-gradient(180deg,var(--hwang-l),var(--hwang));
  box-shadow:0 0 7px rgba(200,162,75,.55)}
.jeong.full .jbar i.on{background:linear-gradient(180deg,#F6E3A8,var(--hwang-l))}
.jeong .jnote{margin-top:8px;font-size:11px;line-height:1.6;color:var(--dim)}
.jeong .jnote b{color:var(--hwang)}
.jeong .jhave{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;
  font-size:10px;color:#6E6455}
.jeong .jhave b{color:var(--baek)}
.jeong .jhave b.no{color:var(--jeok)}
.jeong .jbtn{display:flex;gap:6px;margin-top:10px}
/* 신물이 들어간 순간 게이지가 한 번 달아오른다 */
.jeong.lit{animation:jLit .5s ease}
@keyframes jLit{0%{box-shadow:inset 0 1px 0 var(--gold-in),0 0 0 rgba(200,162,75,0)}
  40%{box-shadow:inset 0 1px 0 var(--gold-in),0 0 22px rgba(200,162,75,.5)}
  100%{box-shadow:inset 0 1px 0 var(--line-hi)}}

/* ══ 진화 연출 — 그림이 바뀌는 것 자체가 연출이다 ══════════════ */
.evo-ov{position:fixed;inset:0;z-index:96;display:none;place-items:center;
  background:rgba(6,5,4,.93);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.evo-ov.on{display:grid;animation:evoIn .28s ease}
.evo-st{position:relative;width:min(74vw,286px);aspect-ratio:3/4;overflow:hidden;border-radius:14px;
  box-shadow:var(--sh3),0 0 0 1px var(--line-hi)}
.evo-st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
/* 다음 성급 그림이 앞 그림을 밀어내며 자리를 잡는다 */
.evo-ov.on .evo-st img.b{opacity:0;transform:scale(1.07);
  animation:evoTo 1.45s .5s cubic-bezier(.2,.72,.18,1) forwards}
/* 두 그림 사이를 건너가는 동안만 스치는 오방색 — 보조일 뿐 주인공이 아니다 */
.evo-st .ray{position:absolute;inset:-45%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:conic-gradient(from 0deg,
    rgba(206,58,42,.55),rgba(200,162,75,.55),rgba(237,231,218,.5),
    rgba(30,76,115,.55),rgba(11,10,8,.2),rgba(206,58,42,.55))}
.evo-ov.on .evo-st .ray{animation:evoRay 1.7s .3s ease-out forwards}
.evo-st .tr{position:absolute;left:0;right:0;bottom:13px;text-align:center;opacity:0;
  font-size:19px;letter-spacing:4px;color:var(--hwang-l);text-shadow:var(--glow-h)}
.evo-ov.on .evo-st .tr{animation:evoStar .7s 1.5s ease forwards}
@keyframes evoIn{from{opacity:0}to{opacity:1}}
@keyframes evoTo{to{opacity:1;transform:scale(1)}}
@keyframes evoRay{0%{opacity:0;transform:rotate(0) scale(.65)}
  30%{opacity:.8}100%{opacity:0;transform:rotate(155deg) scale(1.3)}}
@keyframes evoStar{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .evo-ov.on .evo-st img.b{animation-duration:.4s;animation-delay:0s}
  .evo-ov.on .evo-st .ray{animation:none}
}
</style>

<script>
/* ══════════════════════════════════════════════════
   클라이언트는 아무것도 결정하지 않는다.
   서버가 시드로 확정한 결과를 받아 재생할 뿐이다.
   ══════════════════════════════════════════════════ */
const API  = "https://ybflkszmymalhafzzdbs.supabase.co/functions/v1/hy";
const ART  = "https://ybflkszmymalhafzzdbs.supabase.co/storage/v1/object/public/";
const $  = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let PID = null, M = null, ME = null, SESS = null;

/* 저장소 — localStorage가 막힌 환경(샌드박스 미리보기 등)에서도 죽지 않는다.
   그런 곳에선 새로고침하면 플레이어가 초기화된다. 실제 배포에선 정상 저장된다. */
let _mem = null;
const store = {
  get(){ try{ return localStorage.getItem("hy_pid"); }catch(_){ return _mem; } },
  set(v){ try{ localStorage.setItem("hy_pid", v); }catch(_){ _mem = v; } },
};

/* ── 통신 ── */
async function api(path, body){
  const r = await fetch(API+path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type":"application/json", ...(PID?{"x-player":PID}:{}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(()=>({error:"BAD_JSON",message:"서버 응답을 읽을 수 없다"}));
  if (!r.ok || d.error) throw d;
  /* 해금은 어느 행동에서든 터진다 — 던전·씻김·가챠·진화, 심지어 앱을 켜기만 해도(소급).
     화면마다 따로 처리하면 반드시 한 군데를 빠뜨린다. 여기 한 곳에서 잡는다. */
  if (Array.isArray(d.unlocked) && d.unlocked.length){
    UNLOCK_Q.push(...d.unlocked);
    setTimeout(()=>{ if(!$("#unlockOv").classList.contains("on")) showUnlock(); }, 150);
  }
  return d;
}

/* 살풀이 — 흰 천을 한 번 쓸어 액을 내보낸다.
   고풀이에서 쓰는 .salpuri 를 그대로 쓰되, 해금 때만 화면 전체(.full)로 편다. */
function salpuriSweep(){
  let v = $("#salpFull");
  if(!v){
    v = document.createElement("div");
    v.id = "salpFull"; v.className = "salpuri full";
    document.body.appendChild(v);
  }
  v.classList.remove("on"); void v.offsetWidth; v.classList.add("on");
}

/* ── 해금 알림 ── */
let UNLOCK_Q = [];
async function showUnlock(){
  if (!UNLOCK_Q.length){
    // 다 봤으면 창을 닫고, 새로 받은 카드가 도감·당에 바로 보이도록 다시 그린다.
    $("#unlockOv").classList.remove("on");
    try{ await refresh(); if (PANES[TAB]) PANES[TAB](); }catch(_){}
    return;
  }
  const u = UNLOCK_Q.shift();
  const src = u.art ? ART + u.art : null;
  $("#unlockIn").innerHTML = `
    <div style="position:relative;aspect-ratio:3/4;background:#000;overflow:hidden">
      ${src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover">`
        :`<div class="blank" style="position:absolute;inset:0"></div>`}
      <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(8,6,4,.92) 8%,transparent 55%)"></div>
      <div style="position:absolute;left:0;right:0;bottom:14px;text-align:center">
        <div style="font-size:11px;letter-spacing:.22em;color:#E08A80;text-shadow:0 1px 6px #000">봉 인 이 &nbsp;풀 렸 다</div>
        <div style="font-family:var(--serif);font-size:26px;margin-top:5px;color:var(--baek)">${esc(u.name)}</div>
        <div style="font-size:12px;font-weight:600;color:${FCOL_L[u.faction]??"var(--dim)"};margin-top:3px;text-shadow:0 1px 6px #000">
          ${esc(u.faction)} · ${esc(u.godhood)} · ${"★".repeat(u.tier)}</div>
      </div>
    </div>
    <div class="ov-b">
      ${u.flavor?`<p style="font-family:var(--serif);font-size:13px;line-height:1.85;color:var(--dim);margin:0 0 12px">${esc(u.flavor)}</p>`:""}
      <dl>
        <div class="row"><dt>연 조건</dt><dd>${esc(u.how)}</dd></div>
        ${u.unique_skill?`<div class="row"><dt>유니크</dt><dd>${esc(u.unique_skill)}</dd></div>`:""}
      </dl>
      <button class="btn" style="margin-top:13px" onclick="showUnlock()">
        ${UNLOCK_Q.length ? `모신다 (${UNLOCK_Q.length}위 더 남음)` : "모신다"}</button>
    </div>`;
  $("#unlockOv").classList.add("on");
  salpuriSweep();
}
function fail(e){
  const why = e?.message ?? "알 수 없는 오류";
  const extra = [];
  if (e?.have !== undefined && e?.need !== undefined) extra.push(`가진 것 ${e.have} / 필요 ${e.need}`);
  if (e?.cost && e?.cap) extra.push(`신력 ${e.cost} / ${e.cap}`);
  if (e?.why) extra.push(e.why);
  if (e?.hint) extra.push(e.hint);
  if (e?.detail) extra.push(e.detail);
  return `<div class="err"><b>${esc(e?.error??"오류")}</b>${esc(why)}${
    extra.length?"<br><span style='color:#8B8275;font-size:11px'>"+extra.map(esc).join(" · ")+"</span>":""}</div>`;
}

/* ── 카드 낱장 ── */
const HALO = {
  3:'<circle cx="50" cy="50" r="33" stroke="currentColor" stroke-width=".9" fill="none" opacity=".62"/>',
  4:'<circle cx="50" cy="50" r="33" stroke="currentColor" stroke-width=".9" fill="none" opacity=".72"/><circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="2.4" fill="none" opacity=".34"/>',
  5:'<circle cx="50" cy="50" r="31" stroke="currentColor" stroke-width="1" fill="none" opacity=".8"/><ellipse cx="50" cy="56" rx="42" ry="47" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".55"/>',
};
const FCOL = {"당":"#C8A24B","물":"#4E8FC0","저승":"#B8352E"};
/* 어두운 배경 위의 글자용. 저승색(#B8352E)은 검은 그림 위에서 그냥 사라진다.
   같은 색조를 유지하되 명도만 올린다. */
const FCOL_L = {"당":"#E3C888","물":"#8FC0E3","저승":"#E08A80"};
const mc = id => M?.cards.find(c=>c.id===id);
/* 전투 응답의 적은 {name,faction,tier}만 온다 — id가 없다. 이름으로 마스터를 찾는다.
   (적 카드는 전부 비히든이라 M.cards 안에 있다. 이걸 안 써서 그림·체력이 안 잡혔다.) */
const mcName = name => M?.cards.find(c=>c.name===name);

/* 신력(神力) — 동시에 모실 수 있는 신의 총량. 격(格)이 오르면 늘어난다.

/* ── 그림 경로 ──────────────────────────────
   서버가 내려주는 필드명은 `art` 다 (Storage 실물이 있는 것만).
   예전엔 `art_url` 이었다. 서버만 고치고 여기를 안 고쳐서
   120장이 통째로 안 뜨는 사고가 났다. 이제 둘 다 받는다.
   그리고 이 함수 하나만 본다 — 화면마다 따로 조합하면 또 엇갈린다. */
const REDRAW_ART = {
  C005:'redraw/C005.webp', C008:'redraw/C008.webp', C015:'redraw/C015.webp',
  C041:'redraw/C041.webp', C055:'redraw/C055.webp', C121:'redraw/C121.webp',
  C122:'redraw/C122.webp', C124:'redraw/C124.webp', C096:'redraw/C096.webp',
  C004:'redraw/C004.webp', C002:'redraw/C002.webp', C037:'redraw/C037.webp'
};
function animeArt(c){
  /* 카드별 서버 아트가 없는 경우에만 사용하는 안전한 대체 아트 */
  const f=c?.faction||"당", col=f==="물"?"#62a8e8":f==="저승"?"#e67883":"#e5a94d";
  const id=String(c?.id||c?.name||"X").replace(/[^A-Za-z0-9가-힣]/g,"");
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="${col}"/></linearGradient></defs><rect width="360" height="480" rx="28" fill="url(#g)"/><circle cx="276" cy="92" r="82" fill="#fff" opacity=".3"/><path d="M65 430Q78 270 180 245Q282 270 295 430" fill="#24304a"/><path d="M112 205Q112 92 180 80Q248 92 248 205Q235 270 180 276Q125 270 112 205" fill="#f6c9ab"/><path d="M106 171Q111 63 184 72Q250 70 257 166Q220 124 181 142Q142 124 106 171" fill="#28344f"/><circle cx="151" cy="194" r="8" fill="#26324a"/><circle cx="209" cy="194" r="8" fill="#26324a"/><path d="M157 232Q180 247 203 232" fill="none" stroke="#a84d55" stroke-width="5" stroke-linecap="round"/><path d="M180 38v40M160 50l20-28 20 28" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/><text x="24" y="452" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">${id.slice(0,14)}</text></svg>`;
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
/* 성급이 오르면 그림이 바뀐다. 같은 넋이 격을 올려 다른 모습이 되는 것 —
   이게 보여야 진화가 숫자가 아니라 사건이 된다.
   빠진 단계는 아래 단계 그림으로 내려가 채운다. 빈 칸은 절대 띄우지 않는다. */
const TIER_ART = {
  C121: { 1:'redraw/C121_t1.webp', 2:'redraw/C121_t2.webp', 3:'redraw/C121_t3.webp',
          4:'redraw/C121_t4.webp', 5:'redraw/C121_t5.webp' }
};
const tierArt = (cardId, tier) => {
  const set = TIER_ART[cardId];
  if(!set) return null;
  for(let t = Math.max(1, Math.min(5, Number(tier) || 1)); t >= 1; t--) if(set[t]) return set[t];
  return null;
};

/* tier 를 넘기면 그 성급의 그림을, 안 넘기면 대표 그림을 준다.
   도감에서 아직 안 모신 카드까지 1성 그림으로 보이면 안 되므로 명시적으로 받는다. */
const artOf = (c, tier) => {
  if (c && tier != null) { const st = tierArt(c.id, tier); if (st) return st; }
  const redraw = c && REDRAW_ART[c.id];
  if (redraw) return redraw;
  const p = c && (c.art ?? c.art_url);
  if (p) return ART + p;
  const id = c && c.id;
  if (typeof id === "string" && /^C\d+$/.test(id)) return ART + "art/" + id + ".webp";
  return animeArt(c);
  /* 서버 아트는 보관용으로 남기고, 현재 시즌은 애니메이션 카드 아트를 사용한다. */
  /*
  const p = c && (c.art ?? c.art_url);
  if (p) return ART + p;
  // 마스터에 art가 없어도(히든/GHOST) card_id로 Storage 실물을 직접 가리킨다.
  // Storage 실물은 언제나 art/{id}.webp 규격 — /master가 히든을 잘라도 그림은 뜬다.
  const id = c && c.id;
  return (typeof id === "string" && /^C\d+$/.test(id)) ? ART + "art/" + id + ".webp" : null; */
};
/* 마스터에 없는 카드(히든 등)를 만나도 화면에서 지워버리지 않는다.
   지워버리면 "가지고 있는데 안 보이는 카드"가 된다. 그 사고도 났다. */
const GHOST = id => ({ id, name:"미상(未詳)", faction:"저승", godhood:"?", rarity:"?",
                       role:"밸런스", art:null, unique_skill:"", source:"" });

function mini(pc, opt={}){
  const c = mc(pc.card_id) ?? GHOST(pc.card_id);
  const t = pc.tier ?? 1;
  const halo = HALO[t] ? `<svg class="halo" viewBox="0 0 100 100" style="color:${FCOL_L[c.faction]??FCOL[c.faction]}">${HALO[t]}</svg>` : "";
  const hp = opt.hp ? `<div class="hp"><i style="width:${Math.max(0,opt.hp.hp/opt.hp.maxhp*100)}%"></i></div>` : "";
  const src = artOf(c, t);
  const img = src
    ? `<img src="${src}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.hidden=false"><div class="blank" hidden></div>`
    : `<div class="blank"></div>`;
  return `<div class="mini f-${c.faction} ${opt.sel?"sel":""} ${opt.down?"down":""}"
    data-id="${pc.id??""}" data-card="${c.id}">
    <span class="band"></span>${img}${halo}
    <span class="st">${"★".repeat(t)}</span>
    <div class="nm">${esc(c.name)}</div>${hp}</div>`;
}

const GKEY = "hy_geori";
const geoSeen = () => { try{ return new Set(JSON.parse(localStorage.getItem(GKEY) ?? "[]")); }
                        catch(_){ return new Set(); } };
const geoMark = id => { try{ const s=geoSeen(); s.add(id);
  localStorage.setItem(GKEY, JSON.stringify([...s])); }catch(_){} };

let GI = 0, GEO = null;

/* 그 거리가 아직 안 나왔으면 연다. 나왔으면 그냥 지나간다. */
function geori(id){
  if (geoSeen().has(id)) return false;
  const g = GEORI.find(x=>x.id===id);
  if (!g) return false;
  GEO = g; GI = 0;
  geoMark(id);
  drawGeori();
  $("#geo").classList.add("on");
  return true;
}

function drawGeori(){
  const g = GEO, n = g.lines.length;
  const shown = g.lines.slice(Math.max(0, GI-2), GI+1);
  // 배경은 최근에 지정된 것을 이어 쓴다
  let bg = null;
  for (let k=0; k<=GI && k<n; k++) if (g.lines[k].bg) bg = g.lines[k].bg;
  const done = GI >= n-1;
  const c = bg ? mc(bg) : null;
  const src = c ? artOf(c) : null;

  $("#geo").innerHTML = `
    <div class="bg ${src?"on":""}">${src?`<img src="${src}" alt="">`:""}</div>
    <div class="vg"></div>
    <div class="gn">${g.name}</div>
    <button class="sk" onclick="geoEnd()">넘 긴 다</button>
    <div class="lines">
      ${shown.map((l,k)=>`<div class="ln ${l.say?"say":""} ${l.dim?"dim":""}"
        style="transition-delay:${k*0.1}s">${l.t}</div>`).join("")}
    </div>
    ${done && g.teach ? `<div class="teach">
      <div class="k">${g.teach.k}</div><div class="v">${g.teach.v}</div></div>` : ""}
    ${done
      ? `<button class="go" onclick="geoEnd()">${g.go ?? "간다"}</button>`
      : `<div class="cue">눌러서 넘긴다</div>`}
    ${done ? "" : `<button class="tap" onclick="geoNext()"></button>`}`;

  requestAnimationFrame(()=>{
    $("#geo").querySelectorAll(".ln").forEach(e=>e.classList.add("on"));
    const t=$("#geo .teach"); if(t) setTimeout(()=>t.classList.add("on"), 500);
    const b=$("#geo .go");    if(b) setTimeout(()=>b.classList.add("on"), 900);
  });
}
function geoNext(){ if(GI < GEO.lines.length-1){ GI++; drawGeori(); } }
function geoEnd(){
  const g = GEO;
  $("#geo").classList.remove("on");
  setTimeout(()=>{ $("#geo").innerHTML=""; }, 620);
  if (g?.task) { TASK = g.task; saveTask(); }
  else if (g && !g.task) { TASK = null; saveTask(); }
  GEO = null;
  if (g?.tab) setTimeout(()=>go(g.tab), 640);
  else home();
}

/* ── 길잡이 — 다음에 뭘 할지 모르는 순간이 없게 ── */

function loadTask(){ try{ TASK = JSON.parse(localStorage.getItem(TKEY) ?? "null"); }catch(_){ TASK=null; } }
function saveTask(){ try{ TASK ? localStorage.setItem(TKEY, JSON.stringify(TASK))
                              : localStorage.removeItem(TKEY); }catch(_){} }
function guideHtml(){

  return `<div class="guide">

    <div class="t">${esc(TASK.t)}</div>
    <div class="d">${esc(TASK.d ?? "")}</div>
    ${TASK.tab?`<button class="b" onclick="go('${TASK.tab}')">간 다</button>`:""}
  </div>`;
}
